<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вегамета — тексты 2019–2026</title>
<meta name="description" content="Архив текстов Вегаметы, 2019–2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=PT+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEDE7;
  --paper-2:#E4E6DE;
  --rule:#D2D5C9;
  --ink:#23222E;
  --ink-soft:#6C6B7A;
  --ink-faint:#9A99A6;
  --accent:#4A3F8C;
  --mark:#B33A3A;
  --mono:"PT Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Literata",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- masthead ---------- */
.top{
  border-bottom:1px solid var(--rule);
  padding:18px 20px 0;
}
.top-row{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
}
.wordmark{
  font-family:var(--mono);
  font-size:15px;
  letter-spacing:.34em;
  text-transform:uppercase;
  margin:0;
  font-weight:400;
}
.count{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-soft);
  letter-spacing:.06em;
}
.count b{font-weight:400;color:var(--ink)}

/* ---------- spine ---------- */
.spine-wrap{margin:14px 0 0;user-select:none}
.spine{
  position:relative;
  height:52px;
  cursor:crosshair;
  touch-action:pan-y;
}
.spine svg{display:block;width:100%;height:100%;overflow:visible}
.tick{stroke:var(--ink);stroke-width:1.15;opacity:.28}
.tick.on{opacity:.95;stroke:var(--accent);stroke-width:1.6}
.tick.off{opacity:.1}
.tick.cur{stroke:var(--mark);opacity:1;stroke-width:2.2}
.spine-band{fill:var(--accent);opacity:.09}
.spine-hair{stroke:var(--ink-faint);stroke-width:1;stroke-dasharray:2 3}
.years{
  display:flex;
  border-top:1px solid var(--rule);
}
.yr{
  flex:1 1 0;
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:.08em;
  color:var(--ink-faint);
  padding:6px 0 9px;
  text-align:left;
  border-right:1px solid var(--rule);
  transition:color .12s;
}
.yr:last-child{border-right:none}
.yr:hover{color:var(--ink)}
.yr[aria-pressed="true"]{color:var(--accent);font-weight:400}
.yr[aria-pressed="true"] .yr-n{color:var(--accent)}
.yr-n{display:block;color:var(--ink-faint);font-size:9.5px;margin-top:2px}
.readout{
  font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);
  height:14px;letter-spacing:.06em;
}

/* ---------- layout ---------- */
.app{
  display:grid;
  grid-template-columns:minmax(260px,340px) 1fr;
  height:calc(100dvh - 155px);
  min-height:420px;
}
.pane{overflow-y:auto;-webkit-overflow-scrolling:touch}
.index{border-right:1px solid var(--rule);background:var(--paper-2)}

/* ---------- controls ---------- */
.controls{
  position:sticky;top:0;z-index:3;
  background:var(--paper-2);
  border-bottom:1px solid var(--rule);
  padding:12px 14px 10px;
}
.search{
  width:100%;
  font-family:var(--mono);font-size:12.5px;
  background:var(--paper);
  border:1px solid var(--rule);
  color:var(--ink);
  padding:8px 10px;
  border-radius:0;
}
.search::placeholder{color:var(--ink-faint)}
.search:focus{outline:none;border-color:var(--accent)}
.filters{display:flex;gap:14px;align-items:center;margin-top:9px;flex-wrap:wrap}
.chip{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  color:var(--ink-faint);border-bottom:1px solid transparent;padding-bottom:1px;
}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.chip.mark[aria-pressed="true"]{color:var(--mark);border-bottom-color:var(--mark)}

/* ---------- list ---------- */
.list{list-style:none;margin:0;padding:0 0 40px}
.li{
  display:flex;gap:10px;align-items:flex-start;
  width:100%;text-align:left;
  padding:8px 14px;
  border-bottom:1px solid var(--rule);
  line-height:1.35;
}
.li:hover{background:var(--paper)}
.li[aria-current="true"]{background:var(--paper);box-shadow:inset 3px 0 0 var(--mark)}
.li-d{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);flex:0 0 auto;letter-spacing:.02em;padding-top:3px}
.li[aria-current="true"] .li-d{color:var(--ink-soft)}
.li-main{flex:1 1 auto;min-width:0}
.li-t{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-x{
  font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);
  display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.li-t.untitled{color:var(--ink-soft);font-style:italic}
.li-f{flex:0 0 auto;color:var(--mark);font-size:11px;opacity:0;padding-top:3px}
.li.faved .li-f{opacity:1}
.li mark{background:rgba(74,63,140,.18);color:inherit}
.empty{padding:28px 16px;font-family:var(--mono);font-size:12px;color:var(--ink-soft);line-height:1.7}
.empty button{color:var(--accent);border-bottom:1px solid var(--accent)}

/* ---------- reader ---------- */
.reader{padding:0}
.rd{max-width:36rem;margin:0 auto;padding:44px 28px 96px}
.rd-back{display:none}
.rd-meta{
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);
  letter-spacing:.08em;
  border-bottom:1px solid var(--rule);
  padding-bottom:7px;margin-bottom:22px;
}
.rd-h{
  font-size:23px;font-weight:600;line-height:1.28;
  margin:0 0 20px;letter-spacing:-.01em;
}
.rd-h.untitled{color:var(--ink-soft);font-weight:400;font-style:italic;font-size:19px}
.rd-body{
  white-space:pre-wrap;
  overflow-wrap:break-word;
  font-size:17.5px;
  line-height:1.5;
}
.rd-foot{
  margin-top:38px;padding-top:14px;border-top:1px solid var(--rule);
  display:flex;gap:18px;align-items:center;flex-wrap:wrap;
  font-family:var(--mono);font-size:11px;letter-spacing:.05em;
}
.fav{color:var(--ink-faint);display:flex;align-items:center;gap:6px}
.fav:hover{color:var(--mark)}
.fav[aria-pressed="true"]{color:var(--mark)}
.fav-i{font-size:13px;line-height:1}
.nav{margin-left:auto;display:flex;gap:14px}
.nav button{color:var(--ink-faint)}
.nav button:hover{color:var(--accent)}
.nav button[disabled]{opacity:.3;cursor:default}
.nav button[disabled]:hover{color:var(--ink-faint)}
.hint{
  padding:80px 28px;max-width:34rem;margin:0 auto;
  font-family:var(--mono);font-size:12px;line-height:2;color:var(--ink-soft);
}
.hint b{color:var(--ink);font-weight:400}
kbd{
  font-family:var(--mono);font-size:10.5px;
  border:1px solid var(--rule);background:var(--paper-2);
  padding:1px 5px;
}

@media (max-width:760px){
  body{font-size:16px}
  .app{grid-template-columns:1fr;height:auto;min-height:0}
  .index{border-right:none;border-bottom:1px solid var(--rule)}
  .pane{overflow:visible}
  .app[data-view="read"] .index{display:none}
  .app[data-view="list"] .reader{display:none}
  .controls{position:sticky;top:0}
  .rd{padding:16px 18px 72px}
  .rd-back{
    display:inline-block;font-family:var(--mono);font-size:11px;
    color:var(--accent);letter-spacing:.06em;margin-bottom:20px;
  }
  .spine{height:44px}
  .wordmark{font-size:13px;letter-spacing:.28em}
  .rd-back{padding:6px 0;font-size:12px}
  .li{padding:11px 14px}
  .yr{font-size:9.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <h1 class="wordmark">Вегамета</h1>
    <div class="count"><b id="shown">—</b> из <b>135</b> · 2019–2026</div>
  </div>
  <div class="spine-wrap">
    <div class="spine" id="spine"><svg id="spineSvg" preserveAspectRatio="none" aria-hidden="true"></svg></div>
    <div class="readout" id="readout"></div>
    <div class="years" id="years"></div>
  </div>
</header>

<main class="app" id="app" data-view="list">
  <div class="pane index">
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="поиск по тексту и названию" autocomplete="off" spellcheck="false" aria-label="Поиск">
      <div class="filters">
        <button class="chip mark" id="favBtn" aria-pressed="false">избранное <span id="favN"></span></button>
        <button class="chip" id="ordBtn" aria-pressed="false">старые сверху</button>
        <button class="chip" id="randBtn">наугад</button>
        <button class="chip" id="clearBtn">сбросить</button>
      </div>
    </div>
    <ul class="list" id="list"></ul>
  </div>
  <div class="pane reader" id="reader"></div>
</main>

<script>
const TEXTS = [{"date":"04.01.2019","title":"Мечты, они такие...","titled":false,"body":"Мечты, они такие...\nСквозь пальцы\nС тыльной стороны\nЛадони\nПрилипнули\nЯ их в рот тяну,\nА мама говорит,\nНе кушай песок.\nИ бьёт\nПо рукам\nПо-материнешески\nНежно\n\nДругие же \nПодходят \nКо мне \nНевежды\n\nТянут свои конечности\nГоворят, мол нет\nИ вытирают мне рот \nСалфеткой \n\nМне 7 миллиардов лет.\nШелестит листва,\nШепчет, шепчет,\nПриговаривает:\nТвоя кровь моя кровь\nТвоя кровь \nМоя вода \nМы да ты со мной..."},{"date":"09.07.2019","title":"***","titled":true,"body":"Опять у меня с волосами полная гименопластика, сложные метаморфозы обдувания растительной сущи, всевидящее желобовидное приучастие, натянутое на линейку дня, морифальные дисперсионные волны длинной частоты и неизвестной глубины Чувашии и южной Осетии, анализаторы рыбных дренажей, забавные сумасшествия и платочки, гороховые неодноразовые чехлы на помидоры, неуклюжие баллончики с сухой шириной и беспросветными ганглиями неузнаваемых шестов и адвокатов, катящихся под мензурные лотринатные границы Глеба и Степана, окружённые полной незабывчимостью, миндальные шуршания придавших веянью еремеев гломиллы, маятниковые сравнения и душевные переживания. \n\nПереживания за душу. \n\nШторы размером с апельсин, шершавые возмездия полноправных, жестокие огурцы ожидания и затравки смелых огуречиков, злые и смешные головоногие, прячущие своё бытиё, за скатертью, ведущей в неземное существование трилобитных траурных затейливых дощечек, триумфальные салюты и невинные трепещущие закаты на кровавых берегах звонкой тревожной пыли, мстительные и сокрушимые династия могил, шепчущих древесные колокола и прочие вкусные радости нежизни, говорящие пегасы и многие другие обитатели подтрамвайных путей, жёлтые словно грабли жнеца одуванчики...\n\nНеспелые и не созревшие, но распустившиеся одуванчики."},{"date":"09.07.2019","title":"***","titled":true,"body":"В огороде\nНаш Семён \nСемён\nСемён Степанович \nСтепанович Семён \nТретью смену долбит\nДолбит молотком\nДа по наковалищу\nСвой топор\nНаш топор\nНаш, свой, как Родина\nА она одна, одна\nДа....\n\nА ещё вот на днях\nБуквально вот в полночь \nВ пол третьего ночи\nНа охоту собрались\n\nДа там у нас есть ещё \nОдна баба\nБабёнка\nМаргарита \nМы на неё не глядим\nНе смотрим, но когда видим,\nВсегда она одежду\nСтирает\n\nА когда стемнеет идёт в сарай\nСырой сарай\nВино есть, сыра нет,\nХлеб есть\nОна нам \nДаст воду\nДаст нам воду \nНет, не пить\nНе пить, а смотреть\nСмотреть, смотреть"},{"date":"09.07.2019","title":"Аполлон","titled":true,"body":"Аполлон был не самым любимым в семье, но после того, как он сбежал из дома, вся его жизнь пошла наперекосяк, и стал он в конечном итоге уличным певцом.\nЗабавно, ведь слуха у него нет, да и гитару, найденную на мусорке без одной струны, настроить не мог он.\nНо играл каждый день и страдал, как страдают все люди из-за неудач, но всё же и не так плохо было ему. Он просил других людей помочь настроить ему гитару, но кто подойдёт к такому, мягко говоря, неопрятному человеку с хриплым голосом в свои 31. И видел он много женщин, и влюблялся, а потом это вроде как проходило. Но дело не в этом. Сутра к нему подошли двое и потащили за угол. Ему вкололи что-то в вену и дальше всё как во сне. Проснулся он на кухне в доме с заколоченными досками окнами, через них так и пробивался тёплый утренний или вечерний свет, (не понятно было). Очнулся он за столом, напротив был магнитофон, ну он вытащил батарейки оттуда и начал размышлять: \"а зачем мне эти батарейки?\". В конечном итоге он решил, что две батарейки, работающие в синергии значит единство, дуализм во всём и что только работая сообща можно добиться высоких результатов. Но эти мысли не имели никакой реализации для Аполлона, поэтому они были бесполезны. Пооткрывал он ящики в поисках еды. Нашёл твёрдые макароны и болт с очень странной резьбой. Болт выкинул, а макароны оставил. Теперь бы ему только сварить их... нет кастрюль, сколько бы он не искал. Встал и начал ходить по комнатам. В доме оказалась черепашка, ну он перевернул её, но подумал, что животных убивать очень мерзко, да и ножа у него нет, начал искать дальше с черепашкой в руках. Зашёл в ванную, увидел ванну, и уже думал принять душ, как вспомнил про черепаху. Он поместил её в ванную, а из её рта вылилась какая-то жёлтая жидкость, и маленький ключик. Подобрал он ключ и пошёл дальше, подумав, что не особо хочет он есть или мыться. Отворил ключом входную дверь и вышел, пошёл куда глаза глядят, дошёл до прежнего места своего и понял, что уже вечер, но нашёл свою гитару и запел как не пел никогда."},{"date":"25.08.2019","title":"Сходил в гости","titled":true,"body":"Я потянул за верёвочку, но дверь не открылась, верёвка порвалась, хотя и вставить обратно её можно..."},{"date":"02.10.2019","title":"***","titled":true,"body":"Слышно стало тихий стон.\n\nСтрашновато и комфортно,\nГрязновато, сыро, плотно.\n\nВдруг раздался крик и лязг,\nЭто скрипнула земля,\nПод землёй ползёт змея.\n\nЗмейка ядом не укусит - \nЗмейка ядом не укусит,\nЗмейка шахнет, ахнет,\nЗмейка стонет, страхом пахнет.\n\nИз последнего вагона вдруг посыпался горох,\nБабы собрали́ чертополох,\nБабы стали на две нóги,\nБабы стали как треноги,\nБаб не видно - ви́дны стали всюду рóги.\n\nИ теперь всё стало красно,\nВсё в шипах, и ноги всех их - ласты -\nВсё теперь всем ясно - \nСтон стал сном, \nВо сне из диких лилий\nСтало много синих линий.\n\nСиних платьев стало мало -\nРазобрали всё назло\nИ дороже липкой стало\nСтали...\nНет, всё разобрали\nИ всё кончилось давно,\nВсё как в бездóнне дно.\n\nНàрук смерти на гире или шпиле,\nГоре в Трое,\nТемень в пирожке,\nПустота в башке,\nВ клетчатой рубашке\nВ фирменной, да в промокашке,\nНе без кошковой мордашки,\nКормится он манной кашкой.\n\nОн сильный, строгий и нарцисс,\nИ он не предводитель крыс,\nХотя кто его знает."},{"date":"03.10.2019","title":"Научите","titled":true,"body":"Научите плавать,\nЛетать научите,\nНаучите звёзды собирать\nИ падать научите!"},{"date":"04.10.2019","title":"Поход ночью в туалет","titled":true,"body":"Иду я ночью в туалет.\nВдруг передо мной появилась дверь,\nОна не пускает, говорит, мол, нельзя,\nНо я всё-таки её убедил.\nЯ вошёл, повернул вращающийся выключатель, свет не загорелся, я оглянулся, дверь исчезла. Всё исчезло, нет ничего. Я немного начал переживать и волноваться, потом подумал, что есть решение моей проблемы, если можно вообще назвать это проблемой, мне кажется, человек всё воспринимает близко к сердцу слишком, верит в происходящее. Я открыл пошире глаза и порвал геройский костёр, как рвали наши львы глухие с испугом, на руки смотря, тянули, будто так и надо, рычали, будто рычаги, рычали будто не спроста: вот так я выбрался на волю, а потом пошёл дальше спать в своей тёплой и нежной, густым, сладким и заснеженным."},{"date":"04.10.2019","title":"***","titled":true,"body":"Я не люблю грибы,\nЯ не люблю горностаев,\nЯ не люблю Гондвану,\nНо больше всего я не люблю липучий снег на ботинках."},{"date":"06.10.2019","title":"Культура","titled":true,"body":"Культ поедания сердца.\nКульт заоблачных загадок.\nКульт котов.\nКульт божьих рогов.\nКульт Матери коров.\nКульт ржаных пирогов."},{"date":"06.10.2019","title":"Я ветку покрепче найду","titled":true,"body":"Границей вселенной \nЯвится шар.\n\nУстали мои колени\nОни трясутся и болят,\nВозьму я верёвку-канат\nИ ветку покрепче найду,\nСделать качели поможет солдат,\nА я стану пулей в его автомат -\nЯ буду клинить всем ружьям, \nИх выстрелы станут как благостный мат,\nКак стоны, как лай нерождённых щенят."},{"date":"06.10.2019","title":"Земля","titled":true,"body":"Трубы из стали\nРжавеют давно.\nРжут кони, ржут трассы,\nОгни, города, ржут пузыри\nНа жгучем асфальте,\nГде трубы из стали.\n\nЗемля.\n\nРвёт трубы, \nОттуда вода,\nСамая горячая,\nКак молоко матери,\nКак солнечный тёплый обволакивающий свет,\nКак слёзы.\n\nЗемля, земля.\n\nИ раскалённый солнцем асфальт\nОблит горячей водой,\nГорячей, как человеческое тело,\nКак объятия, вернувшемуся с войны сыну,\nКак новорождённый ребёнок,\nКак слёзы в полном одиночестве.\n\nЗемля, земля...\n\nЗемля разве тёплая?\nНет солнца под ней,\nВ ней есть черви,\nИ корни растений,\nИ древние кости существ\nИ некогда горячие и живые люди\n\nПод землёй.\n\nЛюди, которые лили слёзы,\nВозвращались с войны и их обнимали,\nКормились молоком из груди матери,\nБоялись, боялись за жизнь смертью,\nБоялись смерти,\nТеперь не боятся и не льют слёзы.\n\nЗемля всё хранит.\n\nЗато, ты можешь кричать громко\nИли рыдать,\nВсё рано земля сохранит.\nА любовь земли такая же, как и любовь солнца,\nОбволакивающая,\nКак объятия сына, вернувшегося с войны."},{"date":"06.10.2019","title":"Она одна","titled":true,"body":"Подштанники, штаны ли\nО том, что шили, мыли, шли мы,\nТаблетки раньше были в день,\nТаблетки раньше были здесь,\nТо здесь были, то не были,\nТо одежды, то грибы ли,\nТо гитара, то гита -\nЗагорели провода\nЗагудели, засверкали,\nЗаискрились, застремали,\nЗасрамили, поиссохлись\nПолегоньку, по лодоньке\nВетки крыльями ветвиться\nСомкнуты они молиться,\nКому сахар, кому пыль,\nКому звёзды, кому быль,\nКому крылья, кому порох,\nКому деньги, кому твòрог."},{"date":"10.10.2019","title":"Турбины","titled":true,"body":"Разбиты толпы пауков,\nРазбиты взводы тараканов,\nРазгромлены и полчища стаканов,\nЗаводов синеньких турбин.\n\nЗаводы синие, заводы алые, \nЗаводы, бòльшие и малые,\nЗаводы трезвые,\nЗаводы талых вод,\nЗавод - вот-вот,\nЗавод турбин, мажорных нот.\n\nНа чувства жмот\nИ в принципе простак,\nТак оказалось - он русак.\nРусалка стала пронирать,\nЧудовка плети сетевать,\nА я познался приниженьем:\nСмитроп и малым, и большим,\nНо очень звонким и большим."},{"date":"31.10.2019","title":"Посв. Старику Букашкину","titled":true,"body":"Если всё вот так сложить -\nМожно будет жить."},{"date":"01.11.2019","title":"***","titled":true,"body":"Маракасы и кокосы -\nКулебяки, абрикосы,\nДеревяшки, пылесосы, \nЗемноводные насосы\nИ фуражка с перекосом,\nПоцелуи рек взасосы.\nПо снегам, да по сугробам\nТянут псами ног ознобы,\nНаругали и ни в день\nСохнут щёки новизень."},{"date":"02.11.2019","title":"Бобры","titled":true,"body":"Почему же всякая надежда\nСтанет пухом очень нежным,\nСтанет линией несмежной,\nСтанет ёжиком и поздным,\nСтанет временем бесхозным\nЗа окнàми и дверьми\nСозидали и плели,\nСебя самобичевàли,\nНа рассвете позднем ночевали,\nВСЁ стремится через край,\nА бобры тут не причём,\nСебя били всё бичом?"},{"date":"03.11.2019","title":"***","titled":true,"body":"С речки талая гроза \nНаливается в глаза\nЗа сотню лет - и к нам,\nИ ярче цвет у гамм,\nИ громче шум и гам,\nК антропоморфным берегам,\nУютам, из кирпичиков домам,\nГде пёстры запахи, чтоб там\nПогромоглаще, покучнее,\nВкус тоже стал в разы сочнее\nИ нежных ручек прикасанья \nБыли полны ошибок предписанья,\nЧтоб стали понежнее по незнанью,\nХватило чтоб одной иголочки пронзанья!"},{"date":"09.11.2019","title":"***","titled":true,"body":"Дайте-ка мне!\nДайте-дайте, дайте,\nПодойдите. Не бойся,\nПодойди, на ушко что шепну,\nПодойди-подойди."},{"date":"10.11.2019","title":"***","titled":true,"body":"Ставил нà кон - проиграл,\nЗамахнулся, что упал,\nПоперхнулся и пропал.\nЗаворочался, что встал,\nИз могилы - \nВстал, да и пошёл.\nПо домам гулял, по крышам \nПо селениям неслышным,\nПо посёлкам и просёлкам,\nШёл чрез сосны, через ёлки,\nШёл в густых, да в кандалах,\nШёл без цели, без стремлений,\nШёл без ноты сожалений,\nБез законов, ожерелий,\nШёл как глаз больной свистит,\nОн пришёл на свадьбу - спит,\nОн пришёл на праздник детства,\nОн пришёл на праздник жизни -\nОн ожил и стал капризным."},{"date":"13.11.2019","title":"***","titled":true,"body":"Никто не может очень долго\nСпеть безымянную песню\n\nПро отчаянных кошек зелёных,\nПро громы и камни в горах, \nО льдах в берегах раскалённых,\nПро строгий и шуточный прах,\nМоей безмятежни ступеньках,\nДержавных законов канат \nДавно-предавно перескачет,\nСоскучит по нам аромат,\nИ синий кораблик без мачты\nНачнёт отплывать от ребят,\nА песен не пишут про лифты, \nПро тёрки, про пёстрые формы гранат.\nЧуждо просящих наставлены руки, \nЧудно желанных расставлены ноги,\nЖивородящих всех хищных и робких \nС кучею звёзд посадят в коробки,\nОтправят на волю и к небу запустят,\nА через время найдут их в капусте."},{"date":"21.11.2019","title":"Про звёзды, глаза и руки","titled":true,"body":"Глаза - вторые руки \nВ одно морозное утро\nВетра просторов\nСветом Кастора\nНе стало ветров\nВ морозное утро\nСветом от Струвы\nСветит на руки,\nСветит в глаза\nЭпсилон Большого Пса."},{"date":"27.11.2019","title":"***","titled":true,"body":"Синие краски на моих пальцах,\nНаверное, это пятна от вальсов,\nЛандышей нежных столпотворений,\nРук белоснежных прикосновений\nПолон галлон увлечённых китов\nИ кашалотов богат сей улов.\nШансы сломались о скалы с размаху -\nВсе цифры обрушились речью-ручьём,\nЗабились все в щели, развеялись прахом \nИ стала вода их ожившим мечом."},{"date":"28.01.2020","title":"***","titled":true,"body":"На лошадь похожа, да? \nНе лошадь...\nНЕ ЛОШАДЬ - УЖ!"},{"date":"11.02.2020","title":"Славься, слався","titled":true,"body":"Друзья!\nТоварищи!\nИ... некоторые коллеги..!\nВосславим Славу Святославовну!"},{"date":"23.02.2020","title":"Сарафанчики","titled":true,"body":"Маленькие мальчики,\nЗвонкие звёздочки,\nЗаводные куколки,\nТравушки пахучие,\nСарафанчики колючие."},{"date":"23.02.2020","title":"Десять","titled":true,"body":"С точки зрения линии слуха\nПлоскость доисторического нужно\nСвернуть журавликом, поджечь,\nА затем и в брод пойти.\n\nВ псковском районе.\nОна поддразнивает,\nЯ решительно не сгибаю,\nЯ решителен, несгибаем,\nМы слишком поздно погибаем,\nИ кажется, теперь, я понимаю:\nДорожить или не вспомнить?\nДорога, жить, или не вспомнить?\nСпрячет десять карт подряд \nПод пряды \nШелкопряда."},{"date":"27.02.2020","title":"***","titled":true,"body":"Надо попробовать, попрыговать,\nНадо попробовать, попрыговать,\nНадо попробовать, попрыговать,\nНадо попробовать, попрыговать,\nНадо попробовать, попрыговать,\nНадо попробовать, попрыговать,\nНадо попробовать, попрыговать,\nНадо попробовать, попрыговать!"},{"date":"12.03.2020","title":"17","titled":true,"body":"По дню на скате крыши красной,\nТакой же красной, как и день,\nНаполненной горелой сажей, \nПрогорклой рыбой кожаный ремень;\n\nДень ясен, словно блеск\nВерёвки золотой, как блеска,\nКак натяжённая струна, как леска;\nКак у суставов нежный треск и\n\nРовно два плюс пять плюс десять\nНа ровном поле затянуть,\nИ радость будет много весить,\nИ можно в старость заглянуть."},{"date":"06.04.2020","title":"Содержимое","titled":false,"body":"Содержимое"},{"date":"13.04.2020","title":"***","titled":true,"body":"Мне звёзд на небе не хватает\nИ в горле ком от слов таких -\nЯ скоро до конца растаю...\nМой плавный полуночный стих:\n\nРастаю от тепла кометы,\nРешений правильных и нет,\nРасплавлюсь, данною мне метой,\nПод этим небом, что как плед.\n\nПлеяды горизонтных линий,\nОтрезки темноты и мрак,\nЛучи от солнца словно клинья,\nВсе точки собраны в кулак...\n\nИ явь окажется неправдой,\nИ дух захватит сонный труп,\nОбвеет запахом лаванды,\nИ расползётся тень Бермуд!"},{"date":"12.07.2020","title":"***","titled":true,"body":"Дайте неба, дайте тучи,\nЧтоб не мог пробиться лучик,\nДаже маленький кусочек,\nДаже мира лепесточек!\n\nДайте дождь и дайте грозы,\nБуйных вод, морских и пресных,\nУдивительные козы,\nМолоко в стакане тесном\n\nРазлилось на самом дне,\nИз ромашек прорастает \nНеосознанное чудо -\nТрёхголовый синий аист:\n\nТри крыла и три ноги\nИ на всех них сапоги,\nТри виска и три ноздри,\nИ вселенных тоже три:\n\nНаша, их, и дяди Маши \nВот такие пироги..."},{"date":"09.09.2020","title":"Под водой все средства хороши","titled":true,"body":"По голове падлой \nПо макушке тетеревом\nДесять раз плюнуть \nСрезать под корень \nНамекнуть походкой \nРадоваться неудачам \nПодражать поражения \nВ танце с бубном тоже есть свои плюсы\n\nСеверные льды\nОкеаны косаток \nДальневосточные плавания \nЦветочные букеты\nЖёванный пластилин \nПетропавловск на Камчатке\nДань уважения\nЗасунуть голову в песок \nПатрик Варфоломей\nВетка \nЧайник \nГальванометр \nБерёзовый сок по весне очень полезен, он питает весь организм, наполняя его жизнью и чёрствым хлебом, но это только если вы еврей, а если не еврей, вы не любите чипсы с тараканьей эндокринностью под пледом ранним утром, под одеялом и без лодки под забором и без чайника, и без корыта, и без любви, и без любопытства к бестолковым цветочным полянам, несусветным грязевым ваннам и бесконечно-...белоснежным салютам."},{"date":"09.09.2020","title":"Жук","titled":true,"body":"Ветер в щели задувает,\nА жучок по ветке полз,\nЖизнь без страха не бывает,\nА жучок тот так и полз;\n\nЛает страшная собака,\nА жучок всё тот ползёт,\nШпаги протыкали Жака,\nЖук как будто бы грызёт;\n\nБаба Миша засыпает,\nКорчится от страха жук,\nПеред тем, как спать пойти,\nОна сыпет средство от жуков."},{"date":"13.09.2020","title":"***","titled":true,"body":"Как мурлыканье некошек \nя могу услышать?"},{"date":"21.09.2020","title":"Волшебник","titled":true,"body":"Туфли из ромашек,\nЛазеры из глаз,\nЗайцы первоклашек,\nРозовый колпак,\n\nСолнечные ветки,\nРазная труха,\nМячик и ракетки,\nЧудо-облака,\n\nГазовая дымка,\nЧёрные слова,\nНа лице улыбка,\nНа плече сова,\n\nМимо дымоходов,\nМимо мягких стен,\nДерево заводов,\nБиржевых систем,\n\nПятки и ракеты,\nГромкие слова,\nЧудеса, секреты,\nРтути полоса,\n\nЛампочка затухла,\nПорвались носки,\nГде-то возле уха\nЗыбкие пески.\n\nЭхо гарнизонов,\nБелый флаг любви,\nГадости бозонов,\n\nПотолок в слюне."},{"date":"02.10.2020","title":"***","titled":true,"body":"Гнёзда навозные,\nРуки бесхозные,\nСознаны, загнаны,\n\nДоски полезные,\nБелки любезные,\nРазного рода дарма,\n\nЖаль за нехваток,\nМамаша без схваток,\nЯблочный нежный бисквит,\n\nЭтики, метики,\nФантики, бантики,\nВеки тяжёлые, ух!\n\nГалочки - петельки,\nНоженьки в саженьке:\nДерево дальше растёт."},{"date":"14.10.2020","title":"Осень","titled":true,"body":"Я видел квадраты над тисовым полем\nИ видел подсолнух на газовой трубке,\nЯ видел Шри-Ланку на улице Мира,\nБессонница кисла в фарфоровой ступке.\n\nХороший подарок - дешёвая куртка,\nУлитка ползёт наугад, но вперёд,\nА честное слово, как пепел окурков,\nСгорело дотла, но уже не умрёт.\n\nГондолы с отелями гадили ласты,\nБодрее желанный потоками веет,\nЗамученный жаждою порванный пластырь,\nЗатылок побритый идеями зреет.\n\nЗастывшие ливни лежат в полудрёме,\nПосуда немытая, вскользь, через пальцы,\nНа вéках остались следы глаукомы,\nЦветы распускаются, бегают зайцы.\n\nИ вообще всё спокойно так..."},{"date":"07.12.2020","title":"С днём рожденья","titled":true,"body":"Минимальность загибалась, \nИзвивался Сулейман, \n \nТретьей третью, перекатью, \nЗастепною супрематью, \nСупермать обложит катет, \nКатит антиквара гать. \n \nШирпотребное юленье, \nОтфильтрованный тюлень, \nНа кассете с днём рожденья, \nРук, прекрасных тел олень. \n \nЖивописные помои, \nКраны разрезали путь, \nПо утру и в рукомое \nНашли истинности суть. \n \nЗеркала казались мёдом, \nПауки сошли с ума, \nКараванные походы, \nЭхо сознанного сна."},{"date":"08.12.2020","title":"Разведение костров в непредназначенных для этого местах","titled":true,"body":"Растоптано вполголоса \nНевиданной невинностью\nРаспаханная молодость, \nРастрёпанная изморось, \n \nКалиновая хвоя, \nПокачиваясь веточкой, \nТак сложно жить порою, \nЗакрашивая клеточки, \n \nКак родинки на пальчиках, \nКак радужка из зеркала,\nЗачаток мысли датчика\nРеальность исковеркала. \n \nДинамика конверсии\nСплясала танец с бубнами, \nА кот, по нашей версии, \nСкичурился под тумбами. \n \nИ след давно ослеп, простыл,\nИ простынь также запылилась; \nПоследних слов простой посыл: \nНемая девочка влюбилась."},{"date":"24.12.2020","title":"Звериное","titled":true,"body":"Проснуться от испуга,\nПолуночная вьюга,\n(Фарфоровой посудой) \n\nВойной на полюса,\nНавстречу полоса, \n\nПо вечной мерзлоте,\nСпокойны, но не те,\nГорящих в темноте, \n\nПодслушанных случайно,\nЗабытых и отчаянно, \n\nПобитых о бетон,\nНепойманных в притон, \n\nКосмических туристов,\nПритворных акультистов, \n\nЗалаянных до ужаса,\nЗапуганных замужеством,\n\nЧернично-абрикосовых,\nМалиново-кокосовых \n\nЗайчонков, обезьян!"},{"date":"18.02.2021","title":"***","titled":true,"body":"Вы станете бабушкой или дедушкой"},{"date":"08.04.2021","title":"Незабываемо","titled":true,"body":"Забыть такое невозможно \nШары над полем Пифагора\nШтаны из ткани единиц \nЗабавные червя нагромождения \nПогода сделала ликбез \nА наш любимый Дядя Таня \nПодпрыгнул вышела небес \nНа завтрак тофу и огурчик \nНемое судорожно съело\nИ проблевалось огурцом \nПотом запущенная старость\nПережевала и сглотнула \nИ со слюной и без слюны\nА гладиолус на могилке\nПодкинул общей суеты \nЗашевелились пальцы-пяльцы,\nЗаёрзали тихонько глазки \nДа неужели в них капуста\nТак скажет вам любой прохожий \nА свет оранжевую лампу\nПодтает плавит и стонает\nХагакристос язычески шагает\nЖан Пьер дерилий скажет тост \nЗаявка зябкая трезвонит \nДешёвый выпил я невкусный\nЗашевелились в брюках цацки \nЗалаяли заежевились \nЗаёжились косички да.\nКогда уже они настанут \nЗелёные от копыти своей \nКогда немного будет слышен \nСовсем чутка забавный вкрик\nПодкри́к и за́крик подтобойный\nСлегка чуть-чуть дурацкий стон\nА также крик и плач и смех\nКогда уже он будет виден?...\nВживую...?\nЧто такое со́смех\nЗабавные картиночки собачек\nИ что такое в принципе колядка \nКралья покрученные тазом \nКуличики запаваротом гамма та\nКарал подводный обиходный\nБа Ба Ба ран\nЖевачечка для девочки буржуйки\nДружуй, \nПоешь говна, порастеряшка"},{"date":"05.05.2021","title":"Анекдот о варёном яйце","titled":true,"body":"Шёл дождь, видит - мужик стоит, он остановился, принюхался, а это и не мужик-то вовсе - куколка тряпичная!"},{"date":"19.07.2021","title":"Похуй!","titled":true,"body":"Похуй грянут зябки рано,\nПротрясутся над водой \nИ летит на свет упрямо \nПод железную любой. \n\nЗагорятся наутёки,\nЗагудят их бледный цвет,\nСтуки-стукают намёки,\nГеморроя, пальцев нет! \n\nИззаканчивались руки\nИ под веками песок,\nНесусветнейшие муки\nЗагибались из-под ног, \n\nЗагубные пятитрубы,\nПоловинки чёрной бля,\nШеепопочные бубы,\nНу а в сердце тополя. \n\nНе дано с заглавной буквы -  \nПритворись большим ведром:\nИ противный запах брюквы,\nИ любимый наш гондон."},{"date":"22.07.2021","title":"Кому чё - кому ничё,","titled":false,"body":"Кому чё - кому ничё,\nКому хуй через плечо,\nКому сахар, кому пыль,\nКому звёзды, кому быль,\nКому крылья, кому порох,\nКому деньги, кому твòрог."},{"date":"10.08.2021","title":"9.1","titled":true,"body":"В окончании массивов,\nГоризонтов наклонений,\nПерекошенных красиво,\nВсех цветочных точек зрений, \n\nВ заповедной и заветной,\nЗаедая всухомятку,\nЗатесался безответный:\nПосмотреть бы на девятку: \n\nТам с закрытым ртом и дверью,\nЗа калиткой огурцов,\nРовный след чужого зверя\nИ кривая жесть концов. \n\nЗаворочились тихонько - \nЭто пальцы в молоке,\nЗубы стукают легонько ‐\nЗвёзды какают в руке."},{"date":"13.08.2021","title":"Ижица пыжится","titled":false,"body":"Ижица пыжится\nРобкою саженцой -\nКладбище, полное бля,\nГрадус основан -\nЗримый фонарик -\nНаши движения рук. \n\nСнов ускользающе,\nГорло пронзающе,\nВеткой обломано,\nСловом заковано -\nЖидкий кишечник любви;\nГлазки заплёваны;\nРучкой записаны\nВещие вёсны и сны."},{"date":"18.08.2021","title":"Научитесь","titled":true,"body":"Научитесь плавать, \nЛетать научитесь, \nНаучитесь звёзды собирать \nИ падать научитесь!"},{"date":"15.09.2021","title":"Постфиксация - наш девиз","titled":false,"body":"Постфиксация - наш девиз"},{"date":"12.10.2021","title":"теперь уже старая, когда просыпаешься одним чудесным днём и осознаёшь что твои вакуоли не такие эластичные и упругие а скорее полувялые но вода засохла а ея пустоты клеям намазали связующее звено цепи за кристаллом потолка за скатертью крупных грязевых частиц под ногтями матери роженицы свет\nтолько стонал свет\nтолько молчал свет"},{"date":"18.11.2023","title":".брели по лесу. увидели что-то поблизости. оно начало формироваться. оттуда выскочили два зайца. больше мы их не видели.","titled":false,"body":".брели по лесу. увидели что-то поблизости. оно начало формироваться. оттуда выскочили два зайца. больше мы их не видели."},{"date":"18.11.2023","title":"мне схожее причудилось и выпячивало.","titled":false,"body":"мне схожее причудилось и выпячивало.\nсвоими маленькими пуговками - хлопает.\nиногда бывает сложнее, чем не бывает.\nстроить вязкие стыдливые постройки..\nзра зря за ря вг лаза и снова темно.\nза бесстыдством лужайки и тени бредят.\nписьменно-осенний нá воду стремглав.\nдвижения неподконтрольные контроль.\nпредпоследний этаж и жмых безводный.\nтихо ругается руна дагаз пожимая плечо.\nнастала веерная, наполняя её и твоё.\nгул дал и сжал опрокинул под твоё тело.\nнонече бродят по углам шастают без нас.\nхриплявит и зодчит испугливых перенос.\nдрявлит маленький жирафик любит нас."},{"date":"27.11.2023","title":"натри ноги чистотелом","titled":false,"body":"натри ноги чистотелом"},{"date":"20.12.2023","title":"колебается трясётся","titled":false,"body":"колебается трясётся\nждёт чего-то | изорвётся\nпостоянные толчки\n\nветки тянутся и гнутся \nглазки колят и дерутся\nизрываются зрачки\n\nв тихой влаге с корешками\nрвутся ноги все мешками\nподрываются из вен\n\nветры ткани рвут и стонут\nтам где дети уток тонут\nмежду палочек и пней\n\nкто-то разорвал меня\nя убил его шмеля\nнам покланялась земля\n\nтает тихих звуков ясля \nпосле каждого трухля\nи розовое вниз\n\nесли падает личинка\nпод диванчик или шкафчик \nэто наш родной подвальчик\n\nпод кормой и дохлой сойкой \nв перегнившей синей сливе\nзаикаться и дрожать\n\nдачка спелый огородик\nпод землёй и корнях-пакетах\nпрыгают мёртвые зайчики\n\nпод губами и сливовый компот\nотдирается часть кожи\nрвётся от одной мысли\n\nприближается и языки \nпожирают и жуют\nснова яркий салют больно\n\nпод крышей опять пусто\nбыстрые ели опадают\nстрашно под крышами когда снег тает\n\nмаленький кричит\nне ведись это специально\nон разрывает душу клочки\n\nобрывки взглядов\nосколки глаголов \nпод домом три человека\n\nпо дороге и по аллее\nравенство птиц на букву к\nдревесные метяжи\n\nсторонние наблюдатели\nстрогие преследователи\nкоженные обложечки \n\nразные тугости и отрывы\nнадрыв и растягивать\nтихо петь как колобок\n\nв нужное время играть как барабан\nкто-то совсем один\nнадо\n\nголосовые хлопья и ранники\nпледья над коробом\nкто-то бьётся\n\nкто-то рвётся\nя лёд\nя мысленно сжигаю его\n\nего обращается\nрастворяется во мне\nодно и то же\n\nраспускается на четвёртое мая\nлисточек ' лепесточек по крови\nпо небу плывёт ручеём смотри"},{"date":"20.12.2023","title":"носороги разбежались","titled":false,"body":"носороги разбежались \nвыпадали зубы зубров\nглотки выпали у кур\nс расписного помидора\nполилась густая жижа\nпод асфальтом пролилась\nи укуталась в ячейки \nиз яичников стрижа\n\nпод малиновой живицей\nпогнутой ижицей\nмячик спустился на третий этаж\nнежно зевает\nкаждый узнает\nчто на земле есть и бывают пожары и жевать из лужи кобальт\nпролиферация синильных щей\nповылезал кощей\nблестит его лицо как на восток лицом\nстранным сонным подлецом\nмоим задроченным отцом\nзаядлым порохом и глиной\nнамазом, солью и малиной\nмалина пролилась на лужи\nиз лужи вырос каземат\nиз старых порванных ботинок\nузвар заёбаный кумкват\nоблился птичий заголовок\nу света нету под подушкой\nя загадал на день рожденья\nахуенную лужу и заговор против того чтобы стать козленочком и старую ветку обглоданную младенцем и муравьями кислый под ртом подмечая \nхочешь со мной выпить чая\nиз лужи в ботинках\nс обрезанной стелькой\nиз керамических капель\nиз героиновых вафель\nсмешной погребок\nгрибов на ногах так много\nи кушать их тоже так вкусно\nа стрелка как кролик упрыгал 🐇\nи стены как жёвыный плинтус\nи я как плинтус в пластине\nи пластик пластмассы весь синий\nи здорово чая\n\nза стенами полазали мухи\nу них всех вельветовы брюки\nс подложками\nспорят с кошками\nлают всеми собаками\nскобки не ставят и матами\nгромко ругаются\nрыгают и просто питаются\nмоим трезвым супом и глиной под пальцами\nи маленькие личинки их тоже под плинтусом\nтоже жуют под койкой и коитусом\nвела палатка и штора так же белая\nкнопки и булавки как на груди укололи в сердце но попало в рёбра и осторожно покрасили гасиво\nвесело \nнаши подрясило \nтак же трясется и бултыхается\nте же слова и на бетоне сохнет ко*\n\nот вас остаётся пепел в глаза летит и осыпается я его развожу с водой и получаю глину грязь на руках и от вас из-под моих ногтей сыпется и мухи это съедают жадно как пьяные мухи и теперь я жую мух и превращаю их в отголоски и их никто уже не слышал и я с ними не виделся их не было их нет их не будет я в ярком красном свете\nпереходя туда я точно знаю что что-то забыл и я точно знаю что время не существует и не существует как шарики или медленные\n\nна граните лежат пояса\nстопы покрыты куркумином\nжернова смазались сами\nзавертелась огромная мельница\nмельник стоит ахуевший\nего кот тоже в ахуе\n\nвремя обозначаю я\nвремя назначаю я\nя являюсь я существую\n\nкорнем по голове\nжабой по подзатыльнику\nшлепай ресницами - дуй на мельницу\nкруги на воде каймят\nдоски под водой не гниют\nкороткие спички все достаются нам"},{"date":"20.12.2023","title":"С улицы повеял холод.","titled":true,"body":"Мы молчали, не могли.\nПо спине посыпались угли.\n\nв уголках сориночки у глаза\nжук смеётся и растёт\n\nВ впадине коленей гнутых\nпарус, загорелась маска\n\nпряжа растянулась и убёгла\nв свёкле новенький арбуз\n\nлёжа на спине гармошкой\nсвязь излилась на воздухе"},{"date":"20.12.2023","title":"лежать","titled":false,"body":"лежать \nпо земле\n\nна гладкой \n\nпо воде\n\nна ряби\n\nпо картону\nЖАБРЫ\n\nНОЖНИЦЫ ПО МЕТАЛЛУ\n\nКУСОЧКИ В ТОМАТЕ\nЛОПНУЛ ШАРИК\nТИШИНА НА ОЗЕРЕ { ПОД ТРАВОЙ СВЕРЧОК\n\nКОЛЕСОМ РУКИ И НОГИ\n\nКАКТУС. Я НЕ ДУМАЛ ЧТО ОН НАСТОЛЬКО КАЛЮЧИЙ\n\nЯ ЛЮБЛЮ нул язык\nЛезет лобызаться\nХлеб порезал и поник\nХочется кусаться!"},{"date":"16.06.2025","title":"вот было раньше такое","titled":false,"body":"вот было раньше такое\nклопы фиолетовые такие, хотя, наверное, больше синие, так вот, надавишь на них - а из них вытекает. где сейчас таких взять?"},{"date":"16.06.2025","title":"сведённый отрезок правого колеса ягод поднутрений желтушно☆ягодливый","titled":true,"body":"в свёрнутую прядь забрались жуки синие\nподлёт за тихим дощатым _стилом\nживая ягода спустилась, испустилась влага\nценная влага заклинания песчаного воздуха\n\nпряные пальцы суются в карманы за ниткой.\nза чорным тянущимся твёрдым разлито\nприсед за стенкой за глазом свежие листья\n\nтащатся глупо на выдохе тёплые зубы"},{"date":"16.06.2025","title":"Глядела на солнце каждый день.","titled":true,"body":"Прилив точно заберёт мои вещи. Маленькая галька - на деле ракушки, и в них скоро стёкла, на будущий год - и там то темно, то красиво. Притягиваются верно, из воды, скопления пользы для сна и старения. В гремучую жижу затягивает накопленное. На секунду выбрасывает мусор и снова затягивает. Отлетает во все стороны влажная пена и частички живого. Мы целуемся. Иногда. Он не знает. \n\nПод тягучее сожжённое скользкое небо заползает явления наблюдения и моя сетчатка. Разрывается прочно стены липких накоплений. Чёткий символ. Наверное ровный. День. Его страшные странные воздействия губительны и ценны. Свет заполняет пространство. Я так же плотно разрываю липкие наколения. Я от него скрываюсь. Он знает.\n\nМаленькая галька 17 лет назад. Благостная опора. Сбор красивых камней. Чёткий символ впечатался в память - скотомой в сетчатку.\n\nГлядела на солнце каждый день."},{"date":"16.06.2025","title":"Пряник сказки мило чешет","titled":false,"body":"Пряник сказки мило чешет\nПару сводных свояков\nСвёкр золовку потешет\nДеверь выпил молоков\n\n---\n\nМасло падало в ладони\nКони ветки снегири\nЖалоб не было и корни\nГусто в сердце проросли"},{"date":"05.07.2025","title":"что такое благо","titled":false,"body":"что такое благо\nпить сухую влагу\nесть сырую рыбу\nтечь напором дыр\n\nсвета нам не надо\nобдала прохлада\nшире растянулась\nлазерная мышь\n\nсемечки и гречки\nстарые словечки\nперемёрзла кожа\nдикие кусты\n\nсамая слепая\nвидит по дороге\nпалые от алых\nваленок цветных\n\nколят между рёбер\nили глаз почешет \nили рот помажет\nпромелькнёт святое\n\nкопоть между чешек \nчашек снов гранитных\nлижет питекантроп\nсерый хвост у мышки\n\nв день солёной скорби\nвнешние услуги \nперепутал сабли\nпаровоз и плут\n\nкнопки цифры пяльца\nмедные ботинки\nжестяные пальцы\nсветят в темноте"},{"date":"10.07.2025","title":"пухлые листья","titled":false,"body":"пухлые листья\nтёмные тёмные\nне перепечённые\n\nза дыханием \nмоим"},{"date":"10.07.2025","title":"вдуваясь текучей фразой","titled":false,"body":"вдуваясь текучей фразой\nим \"нужно всего и разом\"\nон умер вчера два раза\n\nего страшно отпели \nкак красный клубок\nего уносили тихонько\n                                                        вбок\n\nон Заледенял\nи Оттаял\nпод громкими норами \nв пышном песке\n\nего дослужатели пели\nпро ноги его и кипели\n\nон не будет лежать\nв тени листьев берёз\nили тени слонового тополя\n\nв бабушке ползает\nмоль по сосудам \nи ищет работу\n\nк падению\nбыло готово\n\nв семь лет\nкаждый год\nполулунный\nплывёт\n\nи кассету\nсладкую \nдарит\n\nв лёд\nидёт\nвсё\n\nи\nоттуда\n\nсжимая порванный кусок красной ткани\nзубами\nвозникая и заслуживая \nне видел (не смотрел) не слышал и ничего никогда не говорил\n\nпростое\n\nвечнозелёная камфора\nвеник полыни\nперехлёстывай реки и петли \nи петельки на моей голове\n\nсмять\n\nсемечко вязло тебя в новый год\nпод лютый и тонну мороза\nот холода тёплые руки\nот мела колючие звуки\n\nстихает\n\nвесёлый под лóктем\nчертящий долóтом \nдыша позолóтом\nсверкающий жук\n\nмлеет\n\nреет вездеходной паранойей\nтрепыхает чёрной смолой\nмой лучший друг\n\nнезаслуженно\n\nтлеет лучина - щепка\nс новым морозом и новой простынкой\n\nвыдыхает \n\nбелая роща и пыль и овраг\n\nмеденеет\n\n\nприм: \nон умер вчера два раза\none for tomorrow one just for today"},{"date":"24.07.2025","title":"ни хуя в железной бочке","titled":false,"body":"ни хуя в железной бочке"},{"date":"25.07.2025","title":"покинутые ворота","titled":false,"body":"покинутые ворота\nлуга на жидком масле\nтянутся вдоль рота\nмятликовой массой\n\nхрен и сурьма\nмёд наливной набивной\nжито с малиной и тьма\nжирные сухой дело запахом\n\nна пробивной мороси\nна мразе морской \nна чудо юде с жировиками\n\nклёцки набухли \nпена стремглав\nразвязывает\nвстающих \n\nс паукав\n\nс терема в темечко \nс яблони в яблочко\nс нитки да около\nлапти мои велики\n\nс чудо юдом на палубе\nпересыхают ватой смелые выцветшие\nвымпел покажет\nкривую усрачку\n\nв смачную точку\nсрочную качку \nногтей неприкрытых \nзимой в водокачку\n\nс нелепо потухших\nпрекрасных стемнело\nпо их позолотам \nтопталися мелом\n\nза вечную плёнку\nи кодлу котёнка\nза падлу и свечку\nза мамину речку\n\nи прыги с подскоками\nтень на затылке\nот рыжих коленей\nпосыпались вилки \n\nи тени грохочут\nстепное корыто\nспокойно упало\nпелёнкой покрыто\n\n... стяги бляхи \nдублёная кожа\nсвисая смекаю\nстреляю тоже\n\nконтра желудка\nконтур котёнка\nзелёная жижа\nи вкусная фомка\n\nюжнее залито хребет и рука\nнаверное крепко зажата рука\nплиточно точно седьмою рукой\nгладко и с точностью свежести тронул рукой"},{"date":"07.08.2025","title":"пальчики петельки","titled":false,"body":"пальчики петельки\nмаленьким бантиком\nелозя канатом облупленным\n\nдóворот с елями гущами\nпрóлетной кучей и тучами\n\nвещи окучены руки закручены\nкручи уступлены волосы ступлены\nбесы исступленны лесы преступлены\nкости затуплены мылом покусанным \nсмело потоплено валом истоптано\nпёсово хрючево - туша измучена\nкожа натянута - дёргает занавес\n\nстылые яблоки пёстрые дóроги\nпадали в валенок: велено - валено\nкóлено белено\n\nкрасным просветом\nзапертым светом\nдолго ползущим\nтелом несущим\n\nтяготно-сливочно\nсолнечно-заечно"},{"date":"06.09.2025","title":"жать сладкую дверь","titled":false,"body":"жать сладкую дверь \nслоёной стрекочащей щепкой\nвыгни пёструю банку рваную острую\n\nналедь стоячая \nнити висячие\nгляди пропащие \nвещи цветнущие\n\nклáди упрямые \nпереворачили\nмедью и колом\nи острым терновым\nизблéдным уколом\nпотопом затоном \n\nзавалом уверенно\nпрямо у двери там\nчёрные лебеди\n\nклешни с арбузами\nс синими пузами\nлюбят и корчатся\nв стенах ворочатся\n\nпалые капельки\nрытые камушки\nпадали на асфальт\n\nгрохотом клёпок\nтреском надорванным\nплачет в медовом настое из снурых трав - полынь там, пустырник и семь килограмм зверобоя\nсладкое зарево\nзáлило \nвпитано\n\nсныли подсунули \nкаждое дерево\nхочет узнать \nсладкое вежливо\nвлагу и нежное \nтёплое жаркое\nострое сладкое\nкислое горькое\n\nсливы избитые\nноры прорытые\nгрешные мальчики\nжалкие перчики\nсухлые вялые\nпряные свежие\nлёжа и стержни\nлетали над прежней\nземлёю \nмятежной\nприбрежной\nлюбимой\n\nзапрись колобок ты в кладовку сырую\nтам ты найдёшь оберег и вторую\nкислую мину свою наболдажную \nкрасномалинову заживо\n\nповлёкло тускло между солнечных дорог самую хмурую босоногую кровную палую лиственницу под подорожником брёвна избытка селена и кроме заливы ничё кроме ветреной красной под яблоней поля и снурых трав степных горьких и кроме глашатаях сусликов нет за исключением жаворонок жарптичных\nтаких неприличных \nнепойманных в сумку \nсхватили за руку\nиз плаванья мления\nпопали камения\nв рот и песок\nи очень приятно в желудке"},{"date":"06.09.2025","title":"заморозки выскребло сведённым подзащитником","titled":false,"body":"заморозки выскребло сведённым подзащитником\nкопьё немытое дало обдало по голове\nзвенящая порча прошла\nснимались оковы и скулы ушли\nнамазано на фонарях \nтяжёлой рукой ведь не я\nпрочитал на окурке седьмую строку\nо том что всё хорошо у орла золотого \nорало и звон под рукой и под колом\nзвено под рукою и гладкая кома \nсилком он пошёл под рукой под немой \nзáледь обсохла и нáледь руки обветшала отпрыснула\nвидимый мир затянулся под пояс\nпод дорогой темно под осиной темно\nвверх натянуто смотрит\nком и под палкой пятно на тину похоже\nпод разными световыми лучами\nпотомок поток и под сливой\nмелькают синонимом вялые пальцы \nна стол накрывает отчаянный гость\nпусть ветка пусть ветер засохнет \nзахочет узнать \nкак говорить слово"},{"date":"07.01.2026","title":"еле дышáща","titled":false,"body":"еле дышáща\nрастёт трава на камне\nбесцветен стебель"},{"date":"20.01.2026","title":"в камне зелёном лыжня обеззвучилась","titled":false,"body":"в камне зелёном лыжня обеззвучилась\nв гладком и мокром слоновом камне\nв полоску продольную белую меловую ровную\nсместился центр железного здания\nтвёрдо завкопанного наблюдаемого\nзвероподобно отчаянно распластанного \nсферой по темечку круглое зарево\nмёртвое здание - смятое пуговкой\nмышка под плинтусом дюже напугана\nплесень под плинтусом тесно под плинтусом\n\nжалкое зрелище белые танки в пятке рогатки\nжалкие деревья дающие антиплоды\nантисемена усеяны в белозём корнями в небо\nустали и нестойко выползают наружу\nтам я их собираю и развешиваю на стену\nприложив к ней ухо еле различимый смех\nи на лице нет радости а только дом травы\nчёрной смоляной душистой солодки \nна морщинистой руке моей старой сухой\nи утро над пеплом моим вездечерепным\n\nнад моим вздохом пролетело 11 уток\nэто утро запомнилось вещим озером\nчуть родным и чуть более чистое дно\nв нём полторы сотни ракушек и звуки \nсведённых конечностей сладкие муки\nа порох на гладком краю пробегает\nсиними лесками трясущийся белый уж\nи глаз его синий от лесок и высоко\nи стал он как шаткого представления\nпоследствий лишённый сделанный шаг"},{"date":"20.01.2026","title":"движение - смерть","titled":false,"body":"движение - смерть"},{"date":"31.01.2026","title":"сухой запылённый","titled":false,"body":"сухой запылённый\nестественно водянистый\nчистый незамутнённый\nне проверял и не верю \n\nбез меня сочетаются клинья пожарной весны\nраскрываются здесь и сейчас бредни отдельной лисы \nиз пробеднённой по тонкому льду полосы\nне на нас [ни на кого] надвигается солнце\n\nдальше дымящейся двери \nя дальше стою\nза полем хлопкóвым \nгде тополь не видно \n\nя там где тебя я нигде не увижу\nдаже на чёткой крахмальной картинке\nи волосы твои морской пеной \nне вольются в беспочвенность \nмоих глаз \n\nхоть я видел их в детстве...\nтак много раз...\nно не помню\nне вижу\n\nты видел январь и ты был таков\nпод сáнями разной консистенции\nрезной самописный по гальке журавль\nтихо смеялся в лицо тебе летом\n\nи не было это\nи я не был там\nи я никогда не почувствую почву\nи никогда я не мял и не вымну травы\n\nи журáвельный тот крик не услышу"},{"date":"17.02.2026","title":"от глода до тала","titled":false,"body":"от глода до тала\nнаглядная хтала\nохватывала\nпемезы св<л>ои целовала\n\nлицы намазаны\nстёкшим с топаза\nэрции ёжевшей\nмякоть нарвала \n\nпо верхней сухой серой линии трезво\nпо мелкой дощечке где щёки стянули\nкирпичную зыбкую пару дерюжную\nкожу натужную - газа из лужи\n\nне пепельной маски\nнет порóся тиснений\n\nкривых окаянных текстилей киселей\nсуфлёристо-сушливых нет карасей\nи под ладошкой нет ветра зелёного\nесть только стойкий сыпучий полóз\n\nв изгибе тягучем \nна пробке из луба \n\nиз чётких аморфных телят поурезан\nсапфировый стыдный эякулят\nи твёрдой опорой железной древесной\nмой праздник по жёлтым врут\n\nа на мне трезвонит первая ласточка\nпо моём глиняном нóсу раковины\nспичечно-серно гуляет удар\nиз слизи и грязи мертвеет \nего наполняет неумело\nшвыряет направо\nи душит руками\nналево летит\nсудно его\nтак уже\nдалеко\n\nвблизи\nи окно\nпромах\nскучно\nхворост\nна хвост положили лисе\nспать будет крепко \n\nне спит только жалкое древко\nв решётчатой кóсти сухих андертальцев\nявлённое сверху причастное лишь копьё \nи север неотчуждённый замороченный"},{"date":"25.04.2026","title":"где ползёт змея","titled":false,"body":"где ползёт змея\nгде сбрызнутая от подтыковокных, в жаре топят и сгорают ткани с вонючими чутьнеупадами, им тепло и даже очень жарко, где я этот пейзаж на нём нет меня.\n\nлежит на ровном полу джинура и я с ней."}];
const LS = 'vegameta.fav.v1';

const strip = s => s.normalize('NFD').replace(/[\u0300-\u0336]/g,'').replace(/ё/g,'е').toLowerCase();
TEXTS.forEach((t,i)=>{
  t.i = i;
  const [d,m,y] = t.date.split('.');
  t.y = +y; t.m = +m; t.dd = +d;
  t.t = new Date(+y, +m-1, +d).getTime();
  t.hay = strip(t.title + '\n' + t.body);
});

let fav = new Set();
try{ fav = new Set(JSON.parse(localStorage.getItem(LS)||'[]')); }catch(e){}
const saveFav = ()=>{ try{ localStorage.setItem(LS, JSON.stringify([...fav])); }catch(e){} };

const S = { q:'', year:null, month:null, favOnly:false, asc:false, cur:null };
let view = [];

const $ = id => document.getElementById(id);
function shorten(s){
  s = (s||'').trim();
  const w = s.split(/\s+/).filter(Boolean);
  if (!w.length) return '· · ·';
  if (w.length <= 5 && s.length <= 46) return s;
  return w.slice(0,5).join(' ').replace(/[,;:—–-]+$/,'') + '…';
}
function listLabel(t){
  const src = /^\*+$/.test(t.title) ? (t.body.split('\n').find(l=>l.trim()) || '') : t.title;
  return shorten(src);
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- spine ---------- */
const T0 = new Date(2019,0,1).getTime();
const T1 = new Date(2026,11,31).getTime();
const pos = t => (t - T0) / (T1 - T0);

function drawSpine(){
  const svg = $('spineSvg');
  const active = !!(S.q.trim() || S.year || S.favOnly);
  const ids = new Set(view.map(t=>t.i));
  let s = '';
  if (S.year){
    const a = pos(new Date(S.year, S.month?S.month-1:0, 1).getTime());
    const b = pos(new Date(S.month?S.year:S.year+1, S.month?S.month:0, 1).getTime());
    s += `<rect class="spine-band" x="${(a*100).toFixed(3)}%" y="0" width="${((b-a)*100).toFixed(3)}%" height="100%"/>`;
  }
  for (const t of TEXTS){
    const x = (pos(t.t)*100).toFixed(3) + '%';
    const on = active && ids.has(t.i);
    const cur = S.cur === t.i;
    const off = active && !ids.has(t.i);
    s += `<line class="tick${cur?' cur':on?' on':off?' off':''}" x1="${x}" y1="${cur?2:8}" x2="${x}" y2="${cur?50:44}"/>`;
  }
  svg.innerHTML = s;
}

function spineDate(clientX){
  const r = $('spine').getBoundingClientRect();
  const f = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  return new Date(T0 + f * (T1 - T0));
}
$('spine').addEventListener('mousemove', e=>{
  const d = spineDate(e.clientX);
  $('readout').textContent = String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
});
$('spine').addEventListener('mouseleave', ()=>{ $('readout').textContent = ''; });
$('spine').addEventListener('click', e=>{
  const d = spineDate(e.clientX);
  const y = d.getFullYear(), m = d.getMonth()+1;
  if (S.year===y && S.month===m){ S.year=null; S.month=null; }
  else { S.year=y; S.month=m; }
  render();
});

/* ---------- years ---------- */
const YEARS = [...new Set(TEXTS.map(t=>t.y))].sort();
$('years').innerHTML = YEARS.map(y=>{
  const n = TEXTS.filter(t=>t.y===y).length;
  return `<button class="yr" data-y="${y}" aria-pressed="false">${y}<span class="yr-n">${n}</span></button>`;
}).join('');
$('years').addEventListener('click', e=>{
  const b = e.target.closest('.yr'); if(!b) return;
  const y = +b.dataset.y;
  if (S.year===y && !S.month){ S.year=null; } else { S.year=y; }
  S.month = null;
  render();
});

/* ---------- filtering ---------- */
function filter(){
  const q = strip(S.q.trim());
  return TEXTS.filter(t=>{
    if (S.favOnly && !fav.has(t.i)) return false;
    if (S.year && t.y !== S.year) return false;
    if (S.month && t.m !== S.month) return false;
    if (q && !t.hay.includes(q)) return false;
    return true;
  });
}

function hl(text, q){
  const e = esc(text);
  if(!q) return e;
  const h = strip(e); const i = h.indexOf(q);
  if(i<0) return e;
  return e.slice(0,i) + '<mark>' + e.slice(i,i+q.length) + '</mark>' + e.slice(i+q.length);
}

function snippet(t, q){
  const h = strip(t.body); const i = h.indexOf(q);
  if (i < 0) return '';
  const a = Math.max(0, i - 24), b = Math.min(t.body.length, i + q.length + 40);
  const raw = (a>0?'…':'') + t.body.slice(a,b).replace(/\s+/g,' ').trim() + (b<t.body.length?'…':'');
  const e = esc(raw); const hs = strip(e); const j = hs.indexOf(q);
  if (j < 0) return e;
  return e.slice(0,j) + '<mark>' + e.slice(j,j+q.length) + '</mark>' + e.slice(j+q.length);
}

function renderList(){
  const q = strip(S.q.trim());
  const ul = $('list');
  if (!view.length){
    ul.innerHTML = `<li class="empty">Ничего не найдено.<br><button id="resetIn">сбросить фильтры</button></li>`;
    const r = $('resetIn'); if(r) r.onclick = reset;
    return;
  }
  ul.innerHTML = view.map(t=>{
    const cur = S.cur === t.i;
    const un = !t.titled || /^\*+$/.test(t.title);
    const label = listLabel(t);
    const sn = q && !strip(label).includes(q) ? snippet(t,q) : '';
    return `<li><button class="li${fav.has(t.i)?' faved':''}" data-i="${t.i}" aria-current="${cur}">
      <span class="li-d">${t.date.slice(0,5)}.${String(t.y).slice(2)}</span>
      <span class="li-main">
        <span class="li-t${un?' untitled':''}">${hl(label,q)}</span>
        ${sn?`<span class="li-x">${sn}</span>`:''}
      </span>
      <span class="li-f">✚</span></button></li>`;
  }).join('');
}

function renderReader(){
  const el = $('reader');
  if (S.cur === null){
    el.innerHTML = `<div class="hint">
      <b>${TEXTS.length} текстов, ${YEARS[0]}–${YEARS[YEARS.length-1]}.</b><br>
      Полоса сверху — все тексты по датам. Клик по ней — месяц, клик по году — год.<br>
      Поиск идёт по названиям и по телу текстов; ударения и ё не мешают.<br>
      Новые сверху; <b>старые сверху</b> переворачивает список.<br>
      <b>✚</b> — отметить в избранное. Отметки хранятся в этом браузере.<br>
      <kbd>↑</kbd> <kbd>↓</kbd> листать · <kbd>/</kbd> поиск · <kbd>f</kbd> отметить · <kbd>r</kbd> наугад
    </div>`;
    return;
  }
  const t = TEXTS[S.cur];
  const pos_ = view.findIndex(x=>x.i===t.i);
  const un = !t.titled || /^\*+$/.test(t.title);
  el.innerHTML = `<article class="rd">
    <button class="rd-back" id="backBtn">← к списку</button>
    <div class="rd-meta"><span>${t.date}</span><span>№ ${t.i+1}</span></div>
    ${un ? '' : `<h2 class="rd-h">${esc(t.title)}</h2>`}
    <div class="rd-body">${esc(t.body)}</div>
    <div class="rd-foot">
      <button class="fav" id="favT" aria-pressed="${fav.has(t.i)}">
        <span class="fav-i">✚</span><span>${fav.has(t.i)?'в избранном':'в избранное'}</span>
      </button>
      <span class="nav">
        <button id="prevB" ${pos_<=0?'disabled':''}>← пред</button>
        <button id="nextB" ${pos_<0||pos_>=view.length-1?'disabled':''}>след →</button>
      </span>
    </div>
  </article>`;
  el.scrollTop = 0;
  $('favT').onclick = ()=>toggleFav(t.i);
  const b = $('backBtn'); if(b) b.onclick = goList;
  $('prevB').onclick = ()=>step(-1);
  $('nextB').onclick = ()=>step(1);
}

function step(d){
  const p = view.findIndex(x=>x.i===S.cur);
  const n = p + d;
  if (n>=0 && n<view.length) open(view[n].i);
}

function toggleFav(i){
  fav.has(i) ? fav.delete(i) : fav.add(i);
  saveFav(); render();
}

let listY = 0;
function open(i){
  if ($('app').dataset.view === 'list') listY = window.scrollY;
  S.cur = i;
  location.hash = 'n' + (i+1);
  $('app').dataset.view = 'read';
  render();
  window.scrollTo(0,0);
}
function goList(){
  $('app').dataset.view = 'list';
  requestAnimationFrame(()=>window.scrollTo(0,listY));
}

$('list').addEventListener('click', e=>{
  const b = e.target.closest('.li'); if(!b) return;
  open(+b.dataset.i);
});

function render(){
  view = filter();
  if (!S.asc) view.reverse();
  $('shown').textContent = view.length;
  $('favN').textContent = fav.size ? '(' + fav.size + ')' : '';
  $('favBtn').setAttribute('aria-pressed', S.favOnly);
  $('ordBtn').setAttribute('aria-pressed', S.asc);
  [...$('years').children].forEach(b=>b.setAttribute('aria-pressed', +b.dataset.y===S.year));
  renderList(); renderReader(); drawSpine();
  const a = document.querySelector('.li[aria-current="true"]');
  if (a) a.scrollIntoView({block:'nearest'});
}

function reset(){ S.q=''; S.year=null; S.month=null; S.favOnly=false; S.asc=false; $('q').value=''; render(); }

$('q').addEventListener('input', e=>{ S.q = e.target.value; render(); });
$('favBtn').onclick = ()=>{ S.favOnly = !S.favOnly; render(); };
$('ordBtn').onclick = ()=>{ S.asc = !S.asc; render(); };
$('clearBtn').onclick = reset;
$('randBtn').onclick = ()=>{
  const p = view.length ? view : TEXTS;
  open(p[Math.floor(Math.random()*p.length)].i);
};

document.addEventListener('keydown', e=>{
  if (e.target.tagName === 'INPUT'){ if(e.key==='Escape') e.target.blur(); return; }
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='/'){ e.preventDefault(); $('q').focus(); }
  else if (e.key==='ArrowDown'||e.key==='j'){ e.preventDefault(); S.cur===null? (view[0]&&open(view[0].i)) : step(1); }
  else if (e.key==='ArrowUp'||e.key==='k'){ e.preventDefault(); step(-1); }
  else if ((e.key==='f'||e.key==='а') && S.cur!==null){ toggleFav(S.cur); }
  else if (e.key==='r'||e.key==='к'){ $('randBtn').click(); }
  else if (e.key==='Escape'){ goList(); }
});

const m = /^#n(\d+)$/.exec(location.hash);
if (m){ const i = +m[1]-1; if (TEXTS[i]){ S.cur=i; $('app').dataset.view='read'; } }
render();
</script>
</body>
</html>
