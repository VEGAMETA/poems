"И совсем один,\nЖдёшь середин,\nЖдёшь крапиву или ручку,\nЖдёшь дождя и непогоды, тучку,\nНочку, проведённую не в одиночку,\nТочку."},{"date":"06.10.2019","title":"Глазницы полные (придумай сам)","titled":true,"body":"Вот я сижу без глаза,\nСорока выклевала его, зараза,\nНу что мне делать-то теперь? \nСовсем хмурнò с таких потерь.\n\nНа вид я весь иссяк,\nПод правым глазом у меня синяк,\nА левый и не видит ни черта\nИ шрам ещё чуть выше рта.\n\nЗачем мне муки эти все нужны?\nЗачем? Мне хочется лишь радоваться, жить!\n\nА в это время с корабля на бал\nСошёл пират - то капитан с чернеющей повязкой.\nТакие он всем анекдоты загибал...\nСошёл — вот вам, читателям, завязка.\n\nУвидел он больного нашего без глаза,\nТихонько подошёл, и начал он свои рассказы\nТравить, мол в молодые времена его могли казнить,\nКорили всё его за то, что он любого мог идеей заразить.\n\nРассказы слушал наш больной без интереса:\nВсё думал в голове, как же поставить ему свою пьесу\nИ той сороке отомстить — вот было бы прелестно,\nИ глаз ещё вернуть же на своё бы место.\n\nЗатем Пират вдруг прогуляться предложил им.\nХодили час, другой и так и задружили,\nВедь глаз остался в них один\nИ оба ненавистники сорок-жади́н.\n\nПират признался, что был случай,\nКогда царь птиц, который самый ещё злючий, \nНе выполнил часть неких обещаний\nИ можно долг с него стрясти, вцепившись в честь, словно клещами.\n\nПират больному предложил отправиться в круиз,\nКогда тот яблоко отгрыз,\nТот согласился, затаив сюрприз,\nЧто у него морская есть болезнь и дед его Чингиз.\n\n\"Пойду!\"\nНо не пошёл он.\nСтрашно всё ему,\nРетировавшись, отдал он поклон нам.\n\nВ порту причаленная шхуна,\nА паруса все бледные, как наши луны:\nВсе серые, все светятся, \nНатянуты, как полумесяцы,\n\nНа мачту неба, будто правда с космоса.\nА люди все на корабле всё смотрят и́скоса,\nГлядят ещё на небо в высь пока,\nЧтоб бури не было, ненастья облаках,\n\nКогда удостоверились - сорвали якорь\nИ плыли, сквозь просторы, горизонты,\nИ всё там было впереди, гляди!\nОдин лишь глаз, не подведи!\n\nА у кого в груди \nВсё так же, жажда бури,\nТого глаза раскрыты, и не два,\nА море вечное и вся всё в даль бежит, да синева..."},{"date":"06.10.2019","title":"Охота","titled":true,"body":"Одно и то же я пишу? \nЗато хоть рыбу не сушу,\nПожары не тушу.\nНо сколько я грешу? \n\nВо вторник жертвенный клинок \nЖивым назначил срок\nДо сумрака дышать.\n\nПока никто не слышал, дождь пошёл.\n\nСтучался в окна, в стёкла, в двери,\nСтучался, он хотел лишь веры,\nНо в дом его не пропустил никто,\nПлющом - водой окутало окно,\nСтекло сломав, наш верный генерал\nВорвался, где никто его не ждал.\nИ стал им всем очки тереть, \nУ лодки он нашёл ключи\nОт склада, там, где кирпичи.\nЖесток он был и под его лопаткой\nВсё было жутко и темно,\nКак в стареньком без слов кино,\nНо даже хуже, без огня, \nТемно, но видно круглость пня\nИ дров, как лист металла.\nМне в руки всё метал он \nИ говорил: \"для печки мало\"\nВсё мало было \nГенералу,\nА ведь ему скандалы\nВсегда к обеду, без прогалов\nИ мало будет и бокалов \nФужеров, вёдер и бидонов,\nВсё хочет он невидимых бизонов\nСтрелять ружьём с затвором -\nИ никаких те разговоров.\n\nИтак, собрàлись на охоту.\nЯ, генерал, \nЕго слуга, который мал, \nСупруга генерала - \nОна нам сумку собирала.\nТам были: \nДва ружья, бутыли,\nОбед и ужин, (чтоб потом накрыли), \nЕщё патроны, магазины, \nАптечка, жгýты из резины,\nЕщё там были зеркала,\nПотом я расскажу, зачем же их она взяла.\nИтак, готовы, генерал?\nПодал нам часовой сигнал,\nВзялись за ружья и помчались,\nНа кòнях, дружно мы скакались.\nНашли сначала мы леса,\nТам вроде водится лиса,\nЗаметил наш слуга,\nХотя ему мы слова не давали, \nНо знали, что он славный малый.\nКороче, стали ждать лису в лесу,\nСтоим минуту, час проходит,\nИ вот, она, лисица к нам подходит \nИ говорит:\n\"Не видели тут мой матрас? \nМне тут сегодня в первый класс,\nМне в школу надо, помогите,\nНу что вы на конях сидите? \nСходите в лес хоть, поищите\"\nВот мы и пошли,\nКакой-то бункер мы нашли\nВремён не наших, допотопных,\nВремён Ассаи, трёх разновидностей животных:\n\"Две черепахи, слон и кит\".\nРаскинул сети и сидит \nПаук на двери той, у плит,\nНо вроде держится и не сулит,\nСовсем уж сделав хмурый вид,\nОн отступил пред генералом\nИ даже дверь открыл, намазал нас и снегом талым.\nВсё говорил: \n\"Давайте, дуйте вы туда, там новый,\nСидит один, грустит с подковой,\nОна удачу раз уж принесла:\nВ лесу настала всем весна,\nТеперь сидит он и грустит,\nА в прочем, сходите вы к нему\nНо только если не беду\nХотите ему сообщить\".\nТак, ладно, павучок, \nТы слишком трезвый, ты жучок.\n-НЕ ЖУК Я, Я ПАУК, \nРАЗ НЕ ДОБРЫ КО МНЕ ВЫ,\nЯ ПРОКУШУ ВАМ ВЕНЫ,\nИ БУДЕТ ВАМ НЕДУГ!.\nПаук тихонько отступил,\nНо только за порог последний наш ступил,\nЗакрылась дверце - мы в его ловушке,\nПридётся навострить нам ушки,\nЧтобы сбежать отсюда.\nИ кровать с матрасом тут найти,\nХотя, а вдруг лисица заодно? \nНаверное, она сюда нас заманила,\nВот подлая, хватило ж воли силы.\nНо есть тут выход - потолок,\nОн хрупкий, тут нужен только молоток,\nУдарить чтобы и тогда \nОткроется дорога на чердак,\nТам, как всегда, бардак.\nПройдём мы через кавардак,\nИ сразу попадём в кабак \nУлиточий, там ведь нельзя собак,\nНельзя с мороженным, для гольфа клюшкой,\nОсобенно с животной тушкой,\nНам повезло, ещё зверей мы не стреляли,\nНо надо отомстить, пока все чувства не увяли.\n\nДорога нам наружу -\nПрошли, достали все оружия,\nПрицелились и выстрел был в кусты,\nА там...белёсые песцы,\nКрасивые, как белый свет,\nКак свет от солнца, светящегося гýгол лет.\nОни полились радугой всё дальше,\nЛовить их мы не стали, это далеко не наше.\nПошли мы дальше.\n\nБолото кинуто дороги поперёк,\nМы сняли с лодки якорёк\nИ через тину \nОтправились, теперь в пути мы,\nА день тихонько угасает в спешке,\nПокушать прихватили мы орешки.\nСидим - едим.\nВдруг навзничь падая назло \nОлень с распоротым пузлом \nУпал и в лодку завалился \nНо генерал тут разозлился:\n\"Чего тут развалился?\nА ну! Марш с корабля!\".\nИ оленёнок встал - здоровым он вдруг стал\nИ поскакал... \nНо утонул в болоте.\nПриплыли - снег настал \nПриплыли, видим скаты скал\nИ скаты в том болоте корчат нам оскал.\n\"Я вроде бы бизонов тут искал\" -\nНевинно генерал сказал.\n\nЖена его вдруг оказалась ведьмой,\n(Все женщины такие) \nТаскала всё мешочек с медью,\nА зеркала нужны ей для обряда,\nОн расставила их, поперхнулась,\nПеренеслась, на острове она очнулась\nОна взбираясь всё по пальмам,\nСвалилась, отыгрывая смерть так театрально.\n\nНас трое наконец.\n\nНеужели в единстве отца, сына и святого духа есть третий лишний?\n\nТеперь пошли ловить овец,\nУбивец\nГенерал, весьма он кровожаден,\nЯ не стрелял, стоял я сзади.\nНа утро вижу, что слуга\nЗарезал генерала, началась пурга,\nЯ встал на колени, слуга же повторил за мной,\nИ тут я понял — это он, \nТот самый я, что весь влюблён,\nА генералом оказалась шляпа, \nЕго супругой был кокос,\nА я - я прокурор, что составлял\nВот этот вот донос.\n\nРешение в суде приня́то \nПожизненное заключение...\nПлюс сахарная вата.\nВсем встать, всем сесть,\nНа этом суд закончен,\nВынесен вердикт,\nА приговор всю истину твердит. \nУх, бок уже зудит..."},{"date":"09.10.2019","title":"С чего начинать?","titled":true,"body":"С какого момента начинается вечер?\nС какого момента начинается ветер?\nС какого момента начинается юность?\nС какого момента начинается вечность?\nНичтожно много всего\nИ в искрах, и в икрах, и в икринках,\nВ человеческих слезинках,\nВ человеческих ботинках\nМного всего...\nЭшелоны стремятся,\nВьются лазы винограда,\nШьются для парада всё наряды.\nПальчик задела игла \nИ так часто бывает, не беда:\nНи обида, ни гневно, \nНо так хочется иногда, чтобы тебя обняли, крепко-крепко, по-материнешески, и пожалели."},{"date":"10.10.2019","title":"Ох","titled":true,"body":"Час от часу не легче -\nПолегче час за часом.\n\nГлаза седые, словно вата,\nОни видали много слёз,\nОни видали много грёз,\nГлаза всё повидали -\nГлаза всё увядали:\nОни повяли,\nРазвеялись \nРазлукой,\nСкукой\nИ тоской.\nВ крови застой -\nПоберегись, кричит, постой!\nГлаза как будто в речке малахит \nМеня манит, меня скулит,\nВсё льёт меня, как разозлит,\nСкула... Стакан разлит."},{"date":"10.10.2019","title":"Турбины","titled":true,"body":"Разбиты толпы пауков,\nРазбиты взводы тараканов,\nРазгромлены и полчища стаканов,\nЗаводов синеньких турбин.\n\nЗаводы синие, заводы алые, \nЗаводы, бòльшие и малые,\nЗаводы трезвые,\nЗаводы талых вод,\nЗавод - вот-вот,\nЗавод турбин, мажорных нот.\n\nНа чувства жмот\nИ в принципе простак,\nТак оказалось - он русак.\nРусалка стала пронирать,\nЧудовка плети сетевать,\nА я познался приниженьем:\nСмитроп и малым, и большим,\nНо очень звонким и большим."},{"date":"10.10.2019","title":"Цикличность","titled":true,"body":"Цикл сна -\nПриснилась весна;\nЦикл воды -\nНалились пруды:\nЦикл труда -\nВ мельнице жернова;\nЦикл плодà - \nИз одного прорастает по два;\nЦикл крòви -\nМоё состраданье кровью и умоет;\nЦикл луны -\nВ полночь воют волки, ноют даже львы;\nЦикл картона;\nЦикл трикарбоновых кислот;\nЦикл падений и достижений до высот;\nЦикл закончен -\nШпагу наточат;\nЦикл домов \nВсё материньих и отчих;\nЦикл за дверь;\nЦикл на стол;\nЦикл к циклу - произвол;\nЦикл жизни произвёл,\nПроизвёл на свет солдата,\nПроизвёл на свет кукушку,\nМою сладкую подушку."},{"date":"10.10.2019","title":"***","titled":true,"body":"Вот и осень наступила -\nГлазки мило потупила,\nСнова чувства притупились,\nСнова мысли прицепились\nО Семёнах и сметанах,\nО борьбе, о ярких кранах,\nКарнавалах, перевалах,\nИ пустых всё театральных залах."},{"date":"13.10.2019","title":"Для чего нужны твои глаза","titled":true,"body":"Для чего нам нужны твои глаза?\nДля чего тебе нужны твои глаза?\nЧтобы маленькие человечки выпячивали,\nВысовывали, ёжились, молили\nШероховатые пальчики,\nГреховные девочки\nПоспитка, сыграли в прятки,\nРыли зеМлЮ НОГТЯМИ!\nПодошвой наступали и, как бы выдавливая\nДождь из смолы,\nИз весёлого пластика\nИ ручейка странствий лебедя,\nНа запад, на запах из дали от нафталиновых,\nОт неформированных частей -\nГраниц ключей -\nКолючей проволоки,\nЗаволокли \nВолки \nГрядущими всё скатертями и санирами,\nКарабаншей от наручных знамений\nИ знамениты они лежащей покрывалой\nНа необитаемом острове правды\nСо включённым кондиционером,\nБез горячей воды,\nС неуклюжей улыбкой странствий летящих осколков стекла.\nЗанижены лодки до ватерлиний,\nДорога по ступне ходит-бродит,\nДорога шла своим чередом:\nЗадом назад,\nЛужей под кроватью растекается\nМои лакомые носочки с черникой,\nРучка с чернилами из извитых волос с лобков,\nЖаберных, жабных, жабных, жадных желобков.\nМалачок из-под скатерти моей, да\nНогами вверх, наверх окутало,\nПромазало.\n\nУналкатка \nПарекнаг \nГлапберек\nКивукекурек \nГнукер \nБаш на баш \n38729110101064112345\n\nБарана загладили до смерти утюгом -\nШерсть не вьётся, она давай извиваться.\nЖараванарки поют, веселятся...\nА вот мне шерсть своя как раз подходит по размеру.\nНигилизм чистого спирта\nЯ люблю оторать и подкрикиваться,\nЯ никоем кажись продумано.\n\nПадака тра та та \nДаа"},{"date":"13.10.2019","title":"Про шмеля","titled":true,"body":"Увы \nУмы\nУмыли -\nУ нас всё хорошо!\n\nУвы \nУмы \nУмели -\nВсё плохо - кашу не поели.\n\nУвы, завышены\nОценки всех - все рàвны ведь труды.\nСорвали грозди винограда, сочные плоды.\nОтцы оценивали строго,\nМоя воèт тревога.\nНа пороге\nВстретил девушку -\nОна всё в синим платье, \nА глазки словно шоколадки карие, \nНу, я подошёл, \nКак настоящий джентльмен, \nТряхнул свои часы в кармашке, \nУ сердца есть который в пинджаке, \nИ протянул ей руку...\nТа с ужасом подвинулась, порастянулась, \nНо не противилась и руку подалà.\nЯ ей сказал: \"чудная немота...\"\nТак просидели, наступила темнота,\nЯ выпил здесь на горле шов\nИ застегнул подтяжки от штанов\nИ с непристоинством спросил:\n\"А вам газон ну кто хоть раз косил...?\"\n-Нет-нет, ответила она и звонко\nЯ не заметил на щеке eë осу, у носа пчёлка,\nШмель тоже приходил, \nГолодный всё ходил,\nОн шершеня позвал\nИ вызвался через подвал -\nОн вырвался на волю, сквозь трубу -\nТам ждал его покой, а дальше было что -\nИзвестно шмелю одному."},{"date":"14.10.2019","title":"Скучно было моим очкам — вот они и кончили жизнь самоубийством","titled":false,"body":"Скучно было моим очкам — вот они и кончили жизнь самоубийством"},{"date":"15.10.2019","title":"Жизнь и смерть!","titled":true,"body":"Жизнь и смерть!\nЖизнь и смерть!\nБытие-небытие.\n\nЗабытое-забитое,\nСерое сознание \nСо знанием,\nС желанием познания.\nПо знанию не судят, \nСловно по обложке\nКниг всё ходят кошки\nУ окошка, из окошка\nЖизнь и смерть гуляют по мощёной кирпичом дорожке.\n\nРождает мать\nВсё, что вообразит летать,\nВсё, что прыгает, что мнётся, \nЧто кусается и жжётся,\nЖмётся ближе, греет руки,\nШутки веселят от скуки.\nВинтит что-то в очень мало,\nВсё ругается - устал он,\nВстал развеяться, ушёл -\nВсё он чувствует душой...\n\nВот и дождичек пошёл."},{"date":"18.10.2019","title":"Почему небо голубое?","titled":true,"body":"А на вопрос \"Почему небо голубое?\"\nБудет ответ такой:\n\"Возможно, потому, что там живут \nГолубые человечки \nПрямиком из печки,\nПрямиком из спячки -\nГолубые человечки.\nОни маленькие и голубые,\nА ещё их очень-очень много.\""},{"date":"22.10.2019","title":"Как поступать?","titled":true,"body":"Нужно поступать так, чтобы..."},{"date":"24.10.2019","title":"***","titled":true,"body":"Грели громы по утрам.\nТо ли грабили граблями,\nТо ли воры в дыры дрели\nВсё сверлили и шумели,\nТо ли с неба листик падал,\nТо ли в море пластик плавал,\nТо ли в море корабли\nИ матросы раз, два, три.\nШли на полном ходе\nНа лилово-алом пароходе.\nКапитан идёт - на взводе:\nОн считал, что было вроде\nСемь матросов, но увы\nИх осталось ровно три:\nДвое бросились за борт,\nОдин лопнул, съевши торт,\nА последний, знаменит он грèхом -\nВ детстве был воспитан греком,\nВ речке раком, \nВырожден был женским пахом, \nПослан нà смерть ручки взмахом, \nЗапахом горящей спички,\nТой, что держит не от двèри ключ - \nOтмычки!\nЕй в мученье есть печенье,\nЕй в мученье муравьед,\nПородивший восемь бед:\nСумрак, сон, произведенья Сартра,\nНоги, крылья, ласты, послезавтра,\nСкрип скрипучих уз женатых.\nДогорела спичка - снова вспять -\nЦветкам из ниток не завять -\nЗапускается верёвка-нить \nИз-под земли нам узелки всё вить...\nМорские...\nЧтобы связать тех трёх матросов, где \nКорабль плавал по воде.\n\nВ общем, там конец хороший был,\nКорабль на орбиту всё-таки приплыл,\nА те четверо воскресли\nИ стали есть сосиски в тесте."},{"date":"24.10.2019","title":"Молодым","titled":true,"body":"Мало дыма молодым -\nВсё больше нужно жечь и жечься им,\nНо сколько не старайся, \nНе стать тебе седым.\nНи в жизнь, ни даже в сказке,\nНи в книжке, ни в стихах,\nНикак ничто не обратится в прах.\nНет смерти, нет любви, \nНе существует счастия, удачи,\nБолезней, горя, даже плача \nТой маленькой сиротки...\nТак, я ограничен, мне сократили сроки.\nИтак, как говорил...\nНет времени...\nИ нет пороков,\nНет жалости...\nДа где ж мои носки?..\nНа чём там я остановился?\nТак, нет жалости, нет лысых \nНет тощих, нету крыс и...\nНет гордости, нет пламени, \nНет совести, нет, чтоб расправили \nЗнамения или другие части механизма,\nЧто вертятся, скитаются как призрак\nПо несуществующим трòпам,\nПо прочим гадким ноотропам.\nИ, в общем, всё прекрасно,\nА молодым всегда быть классно."},{"date":"28.10.2019","title":"***","titled":true,"body":"Я достаю из широких морей\nДубликатою циклов бесценной -\nЧитайте, завидуйте,\nЯ - гражданин Вселенной!"},{"date":"28.10.2019","title":"Сны одной птицы","titled":true,"body":"А двери ведь тоже смеются\nНекой обречённостью,\nКак волны, суть которых не понять,\nНо можно понять их сущность,\nКоторая совсем в другом,\nА сущность ребёнка в боязни боли,\nКоторую он боится. \nБоится больше, чем остальные.\n\nОколо колоколов \nЧёрт от звонкости оглох.\nПолетела навзничь птица - \nВсё брыкается, кренится -\nХочется воды напиться.\nПо пустыни всё летела\nИ нашла в пустыне тело,\nЗалетела под бочок,\nСпряталась ему в зрачок.\nСнилось ей как нежучок\nПолзал брюхом в бардачок,\nСнилось пять червивых стен,\nСнились шторы и пылинки,\nМеленьких художников картинки.\nСнились письма и грибы,\nСнилось много синевы.\nМного в общем чèго снилось.\nА на утро снова в путь - \nНевозможно, жарко, жуть.\nВидится всё впереди река, \nПодлетела, посмотрела\nИ застыла на века - \nЗалетел песок в рукав\nПтица бы́ла такова.\nПошагавши, та пошла,\nПришла к царю всех птичек,\nТа дàла ей немножечко водички,\nИ наша птица ожила, вспела, \nРасправила всей крылья и взлетела."},{"date":"29.10.2019","title":"Волшебства","titled":true,"body":"Чья ж совсем ещё манера\nГоворить, что всё тримерно?\nЛистья, грёзы и бинты,\nА мимозы, острые как шипы розы,\nСтали красными как ты,\nНо не страшно это нам,\nНичего не страшно нам,\n(Утекая, крикнул шум.)\n\nГриб замёрзший в шляпке ходит.\nСшили, мёрзнувши, деревьи,\nЛапой мёдом зализавши,\nСпрятались в снегу медведи.\nТаких прочих много-много,\nВот только редко те встречаются вяву,\nНастолько яркий будет звон, писк, треск и свет в борý."},{"date":"30.10.2019","title":"а)Звёзда и жизнь б) Час","titled":true,"body":"а)\nЗародилась жизнь в звезде -\nТа пошла гулять везде,\nПрилетела в мир цветов,\nНачала творить творцов,\nПоджигать свечей концов.\nВсё звезда поподжигала:\nСердце, душу и глаза - \nВ принципе не существует зла.\nМать кормила молоком, \nЛуны шли, светясь теплом.\n\nб)\nЧас звезды летит всё вспять -\nМы обязаны сиять.\nЧас цветов запах опять\nНе придётся нам завять.\nКаждый человек как свечка,\nНету звёзд в его сердечке,\nЕсть в желудке молоко,\nЧас луны глядит в окно..."},{"date":"31.10.2019","title":"Каково это - спать как рыба?","titled":true,"body":"Мàнит пистолетом в сон -\nЭто нужно поскорей\nЛошадь трезвую в загон,\nТучку гладкую на небо, \nЧтобы было ближе к солнцу -\nТак и вьюга лучше вьётся,\nСловно диски из луны\nТоже тучками видны,\nНадо, чтоб наполовину,\nЧтобы поровну и врозь,\nНоги чтобы сразу в глину,\nЧтобы лучше подспалось,\nЧтобы полосы и краски \nНо холсте, на старой маске\nВ форме шута-кулича,\nЧтобы было всё как в сказке:\nКровь, дракон и блеск меча,\nБлеск зубов у лодки синей,\nКак у женщин три плеча,\nТак и топят смех резиной,\nТак и плавят свет луча\nОт костра, от всяй огнива,\nХоть от мелкой-мелкой льдины.\nНайдены молочные средины, \nОкопы, лужи, завести, тритоны,\nНайдены девятые щербеты и перроны\nВсё водой... который раз...\nМной воспитан страстный вальс,\nМной воспитан первый класс,\nЯ учитель, я же рыба!\nНу и стал я плавать, плавать\nВокруг пальца своего...\n\nА возможно, человека тянет к морю из-за того, что в процессе эволюции он произошёл от рыбы...?"},{"date":"31.10.2019","title":"Посв. Старику Букашкину","titled":true,"body":"Если всё вот так сложить -\nМожно будет жить."},{"date":"01.11.2019","title":"***","titled":true,"body":"Маракасы и кокосы -\nКулебяки, абрикосы,\nДеревяшки, пылесосы, \nЗемноводные насосы\nИ фуражка с перекосом,\nПоцелуи рек взасосы.\nПо снегам, да по сугробам\nТянут псами ног ознобы,\nНаругали и ни в день\nСохнут щёки новизень."},{"date":"02.11.2019","title":"Бобры","titled":true,"body":"Почему же всякая надежда\nСтанет пухом очень нежным,\nСтанет линией несмежной,\nСтанет ёжиком и поздным,\nСтанет временем бесхозным\nЗа окнàми и дверьми\nСозидали и плели,\nСебя самобичевàли,\nНа рассвете позднем ночевали,\nВСЁ стремится через край,\nА бобры тут не причём,\nСебя били всё бичом?"},{"date":"03.11.2019","title":"***","titled":true,"body":"С речки талая гроза \nНаливается в глаза\nЗа сотню лет - и к нам,\nИ ярче цвет у гамм,\nИ громче шум и гам,\nК антропоморфным берегам,\nУютам, из кирпичиков домам,\nГде пёстры запахи, чтоб там\nПогромоглаще, покучнее,\nВкус тоже стал в разы сочнее\nИ нежных ручек прикасанья \nБыли полны ошибок предписанья,\nЧтоб стали понежнее по незнанью,\nХватило чтоб одной иголочки пронзанья!"},{"date":"05.11.2019","title":"Про ветер","titled":true,"body":"В кучу, вместе как-то разом \nСобрались все выдохи приказом.\nТот, командовал кто этим,\nБыл никто иной, как ветер.\n\nОн направился - и в путь\nИзучать людей всю суть,\nИзучать как землю строят,\nКак чудесных выдр моют.\n\nПолетел на запад он -\nТам увидел царский дом.\nЗалетел, задул в окошко, \nПростудил принцессы кошку.\n\nТа, очухавшись немножко\nПожелала ветру снов,\nПожелала сшить узлов...\n10 штук морских... как свинок.\n\nВетер дальше брёл на север,\nОборвался о ледник,\nЛьдиной - мина под балконом,\nВ водах чутких насекомым,\n\nДревних палочников в ряд\nСтроил ветренный отряд,\nПерестроил, что жуки\nВсе сказали: \"пустяки\".\n\nУлетели в миг на юг,\nВечера длиннее вдруг,\nА под пятым крышеносцем\nСорвалась резьба на донце,\n\nНебо, клинное как сажа,\nОбратилось по неволе\nВ долговременную нашу\nЛужу лунной жизни поля.\n\nТак и мчали на восток\nК иноземцам, под мосток,\nГде не водится креветок,\nВетер гнул концы у веток,\n\nВетра гул разнёсся всюду\nПо горам и изумрудам,\nПо пустыням, света чудам,\nКриво стоптанным тропинкам,\n\nПо резиновым подстилкам.\nШёлком будто всех продуло,\nВетер долго-долго думал,\nОн прищурился... И ПЛЮНУЛ!"},{"date":"09.11.2019","title":"***","titled":true,"body":"Дайте-ка мне!\nДайте-дайте, дайте,\nПодойдите. Не бойся,\nПодойди, на ушко что шепну,\nПодойди-подойди."},{"date":"10.11.2019","title":"***","titled":true,"body":"Ставил нà кон - проиграл,\nЗамахнулся, что упал,\nПоперхнулся и пропал.\nЗаворочался, что встал,\nИз могилы - \nВстал, да и пошёл.\nПо домам гулял, по крышам \nПо селениям неслышным,\nПо посёлкам и просёлкам,\nШёл чрез сосны, через ёлки,\nШёл в густых, да в кандалах,\nШёл без цели, без стремлений,\nШёл без ноты сожалений,\nБез законов, ожерелий,\nШёл как глаз больной свистит,\nОн пришёл на свадьбу - спит,\nОн пришёл на праздник детства,\nОн пришёл на праздник жизни -\nОн ожил и стал капризным."},{"date":"10.11.2019","title":"Пожарный кран","titled":true,"body":"Я - пожарный кран!"},{"date":"13.11.2019","title":"***","titled":true,"body":"Никто не может очень долго\nСпеть безымянную песню\n\nПро отчаянных кошек зелёных,\nПро громы и камни в горах, \nО льдах в берегах раскалённых,\nПро строгий и шуточный прах,\nМоей безмятежни ступеньках,\nДержавных законов канат \nДавно-предавно перескачет,\nСоскучит по нам аромат,\nИ синий кораблик без мачты\nНачнёт отплывать от ребят,\nА песен не пишут про лифты, \nПро тёрки, про пёстрые формы гранат.\nЧуждо просящих наставлены руки, \nЧудно желанных расставлены ноги,\nЖивородящих всех хищных и робких \nС кучею звёзд посадят в коробки,\nОтправят на волю и к небу запустят,\nА через время найдут их в капусте."},{"date":"21.11.2019","title":"Про звёзды, глаза и руки","titled":true,"body":"Глаза - вторые руки \nВ одно морозное утро\nВетра просторов\nСветом Кастора\nНе стало ветров\nВ морозное утро\nСветом от Струвы\nСветит на руки,\nСветит в глаза\nЭпсилон Большого Пса."},{"date":"21.11.2019","title":"***","titled":true,"body":"Прощай навеки, юная принцесса,\nТяжёлых странствий полная собой,\nСквозь узкие канавки, в мрак и зной \nНе остановит расстояния прецессий\nО нашем расставании прелестном\nСлужить настанут гаснущие свечи,\nМочи нет на столь чудовищные ночи\nО том, как наших с Вами потолками\nПридонные лукавые толкали\nПод натиском и шелестом хозяев -\nОживших лепестков всё ткали\nГербарий звёздчатых кудрей\nПод тихий стон немой собаки,\nПрощай навеки, юная принцесса,\nБеги ж на поле синих маков \nПод топоты уверенных процессий."},{"date":"21.11.2019","title":"Про разум","titled":true,"body":"Теперь не пойми сколько ждать\nЧасов, лет, рук, осетровых,\nПрочих желтушников,\nОдетых как в звании руккола.\nХоть горло переполнено звуком, но\nРаздаётся мяуканье\nИ разом над радугой разума\nОткроется сразу по-разному\nНаш Ниагар, виноградовы лазы\nИ грянет светом от лазера,\nРёв грома зарàжен проказою,\nСкверно расслышать приказы нам,\nЛучше прочесть дай на глаз или\nЛучше отведать дай пыли той.\nКлином лодки рассекая\nВоду, словно топором,\nМы болотьеце пересекаем,\nВосемь метров там нутром,\nА на утро мы крещёный,\nМы на утро креветчок,\nСлышно было, словно уток\nТы сажали на крючок,\nНет, нам совестно стыдиться -\nПо стакану мне водицы \nВылей, выпьем и пошли,\nДолго шли, три ночи вспять\nИ наткнулись на распятье,\nА затем и на распутье:\nВлево мрак,\nНаправо тень,\nА вперёд подашься если -\nБудешь дома в мягком кресле,\n(Может даже на кровать?!)\nБудешь ты стихи читать."},{"date":"25.11.2019","title":"Свобода","titled":true,"body":"Единое решение всех проблем -\nЭто выпадение снега,\nВ былые времена не жадили подмен,\nИ лошадей тогда ковали бегом,\nОднако одного\nЕдинственного индивида\nНе сокращает факт того,\nЧто жизнь как красками индиго,\nТеперь полёт нам кажется земной \nТакой такой, \nЖивотно-длинный, ременной, \nБез сокращений, не без взгодов, \nНо межпространственный, межвременной -\nТаков он, вкус нагой свободы!"},{"date":"27.11.2019","title":"Приключения старика (классические)","titled":true,"body":"Старик в полном расцвете сил хочет спасти принцессу. Он облачается в доспехи и направляется к замку. Итак, старик приходит к дракону. Они беседуют по душам, а потом устраивают вечеринку... со стриптизёршей, в таком ещё торте большом... знаете? И в общем стриптизёршей оказывается сестра нашей принцессы, про которую совсем забыли. Дракон отпускает принцессу, а потом все танцуют и веселятся.\nКонец."},{"date":"27.11.2019","title":"***","titled":true,"body":"Синие краски на моих пальцах,\nНаверное, это пятна от вальсов,\nЛандышей нежных столпотворений,\nРук белоснежных прикосновений\nПолон галлон увлечённых китов\nИ кашалотов богат сей улов.\nШансы сломались о скалы с размаху -\nВсе цифры обрушились речью-ручьём,\nЗабились все в щели, развеялись прахом \nИ стала вода их ожившим мечом."},{"date":"07.12.2019","title":"\"Танцы\"","titled":true,"body":"Как фотоны и радуги сходятся в ряд?\nКак на небе молчит, догорая, заря?\nКак из пепельниц с дымом дорогая зола\nОбвивает и душит, заводит меня?\n\nКак синих затмений гордая тишь\nСыплется с неба, падая с крышь?\nТы не спеши, звуки молний расслышь,\nЛяг, словно снег, пятиглазый малыш.\n\nДочка твоя уж давно ходит в сад,\nЛево с затылком уходит назад,\nПятый притихнет, откроет девятый -\nГрудью кормить себя станут ребята.\n\nТрели сверчков, молодые брели,\nСохли над ними дни, нет, корабли,\nВысохли лодки, натужилась гладь,\nРябью и пеной грозится обнять.\n\nРанних лучей,\nИз-под пола ключей,\nВнутрь его ненаглядных щелей,\nВнизу, между дòсок струится ручей.\n\nНовый снова через век\nКаждый раз приходит:\nТо глаза насторожит, то печально входит, \nТо тревожно кувырком, то натужно бродит,\n\nХодит словно командир, \nСловно виноватый,\nВесь в наградах, сшит мундир, \nГубы как лопаты,\n\nДеревянная нога, \nА во рту всё вата, вата,\nВы запомните теперь\nЭтого солдата!\n\nЭто вам не каучук, \nНет, отнюдь, ребята,\nЭто - генерал Лющюк!\nС виду вороватый.\n\nТак и жили сто годов,\nА потом однажды\nПомер командир взводов,\nПомер трижды, дважды.\n\nНоль с расцветом снегирей\nДелим на один с телёнком,\nПолучаем, что зверей\nЖук, да шиш с котёнком,\n\nЖук взлетел и полетел, мы же наблюдали,\nТак и время пронеслось прямо перед нами,\nШли ни сутки - шли года, мы стояли, ждали,\nЖдали сумрак, холода, а дождались благо.\n\nА котёнок тот - не лев, он сидит и плачет,\nМы его приобняли, котик теперь скачет,\nНету толка совсем в том,\nЧтобы кот наш стал вдруг львом \n\nИли тигром, ягуаром,\nСтал он так воздушным шаром,\nУлетел сквозь всё пространство\nИ придумал слово \"танцы\"."},{"date":"08.12.2019","title":"Зима","titled":true,"body":"В понедельник четверга\nРазрастаются рога,\nРазрастается рука,\nЖмётся, ёрзая, зима.\n\nБольшой резиновый хлеб,\nНадетый наничку,\n(О, точно, отлично)\nХата сжгётся\nС одной спички\nВ норы звèрей,\nВ письмах личных,\nТак и тает ободок,\nТак и рвётся по утру \nТак кудрявит и пырнёт\nНа планете рыбошпрот,\nЗашвырнёт, так зашвырнёт,\nИ вокруг наоборот\nВыстроит всех сесть на борт \nГолубого самоката,\nЧто нас в космос полетит,\nА летать он будет смело:\nБез хвостов, с обводкой мелом,\nДух держать в здоровом теле,\nТам, где дух, там стовый стух,\nПеретух петух, потух, \nИ угли давно истлели\nТой избы, что год горела,\nТак и было, дайте веру,\nДайте правду и весло\nИ тогда я буду делать\nДорогое ремесло."},{"date":"09.12.2019","title":"Чудеса","titled":true,"body":"Эх, чудеса... \nЧудеса и бескрайние просторы..."},{"date":"10.12.2019","title":"Торт","titled":true,"body":"Многозначная структура,\nПолимерность Эпикура,\nМетамерность пули-дуры,\nПыль дороги в том ауле,\nНа той улице, где, судя по всему, проводится испытательные сроки граждан эмансипацией и требухой из и под моего кафтана.\nБольше всё левиафанов,\nИ дешёвых ручек тоже,\nНу а я привык к широким брюкам,\nВ них свободней для страны,\nВ них под новый одуванчик,\nА надет всё тот кафтанчик,\nЧто за хворостом ходил,\nЯ его не в смерть прикрою,\nЯ его не в смерть прикрою,\nБуду радовать и бить,\nНаказанием судить,\nЧто он был на пухлой морде,\nЧто он был как песня вроде,\nСтал теперь как три куска:\nЭлемент, ступень, тоска\nЭти три объединятся \nБудут так толкать вперёд \nТех, кто станет - выше тот."},{"date":"10.12.2019","title":"Про крокодила и хорошее время года","titled":true,"body":"Мне за солью заходил\nБлаговонный крокодил \nИ друзей своих водил,\nДеревянный крокодил,\n\nВесь в пыли и всех отрадней,\nНаготовил нам отравы -\nДля пелёнок трав отвар\nЗаварил - и стал он стар,\n\nСтал склоняться над заслоном,\nВсех слонов застал с полна,\nОн нам несколько столовых\nВилок бросил вслед - играл,\n\nПод влиянием прыщей\nВсё растёт святых мощей,\nПлющ зловонный с сигаретой.\nНе волнуйся, скоро лето."},{"date":"10.12.2019","title":"Секрет одной птицы","titled":true,"body":"Одним холодным вечером саду \nЗемная птица какаду \nЗадула праздничные листья,\nОпали палые, прильнула,\n\nОна вдруг стала удивляться,\nЧто жизнь такая вот така,\nПолёт ея средь веточек и снов,\nЧуть-чуть немного катастроф,\n\nИ вот забыла она что-то.\nНарочно выйдя из гнезда,\nОна всё вспоминала... соты?\nНет, это ж пчелиные заботы,\n\nЯ птица, я отныне тихая зима,\nЯвляясь частью горделивой,\nЗабыла я про... тонкого жука?\nДа нет, по мне какой-то он противный\n\nИ нищета, и голод, \nМосква, делённая на н0ль,\nОн сколько бы ни плакал, плакал,\nНе перестанет плакать он \n\nИ будет литься, литься, \nПод звуки-шелесты берёз\nНе будет злиться, злиться,\nВезде резиновые лица,\n\nНо надо вспомнить мне его,\nЗаветно-длинные они\nИ светом льются как огни,\nА личность - тени мантикоры,\n\nОни всходят выше гор и...\nДля них поются песни в море.\nЯ долго тайну эту хороню,\nВо мне не счесть всех этих дней,\n\nЧто я ни разу никому не говорю\nПро то, сломал, что я очки,\nАх да... я вспомнил...\nЗВЁЗДОЧКИ!!!"},{"date":"10.12.2019","title":"Я иду на ТЭЦ,","titled":false,"body":"Я иду на ТЭЦ,\nА вокруг кругом пиздец,\n\nТак разделилась пятка с почкой\nИ стала слабым местом Ахиллеса,\nТак же известного как Ахилл,\nВ его честь придуман образ был бахил.\n\nДень на ТЭЦ окончен,\nНолик в крестик кончил,\n\nТак развязалась ниточка до волокна,\nТеперь лежать мне у окна,\nИли совсем уж под окном, \nПод ветров необъятный стон\n\nИ грохот из земли...\nИ тихий шёпот криптографии."},{"date":"14.12.2019","title":"Недописанное стихотворение","titled":true,"body":"Въ грѣховныхъ мукахъ падалъ я къ ногамъ,\nЧѣрвилась подо мною твѣрдь зѣмная,\nА пѣрсты сажѣй чорною покрылись,\nЯ длань руки взложилъ на лобъ,\nВъ ушахъ тотъ часъ жѣ звономъ взвылись,\nТогда я встал и прокричал:\nГраницей селе станут воли!\nНастолько трезвый-партизанный,\nЧто я насмешку проглотил\nИ кашлял горною приправой,\nНастолько глупым был весь мир,\nЧто всеми временами\nОн был как ласковый жульен,\nКак самый свежий, панорамный!\nЯ воздух в печень наберу\nИ стану выдыхать из глаза,\nЯ смело батюшку возьму \nИ стану выдыхать из глаза,\n...\n\nПримечание автора:\nЭто стихотворение является недописанным. Тот, кто читает это, может сам его дописать."},{"date":"18.12.2019","title":"Рецепт","titled":true,"body":"Я вечно задаю себе вопрос,\nКак я предоставляю вкусам спрос\nО том, что мне поесть сегодня,\nВот мой рецепт:\n\n7 грамм дыханий;\nПримерно 30 жертвоподаяний;\nАрбузных косточек по вкусу;\nЩепотку соли,\nПлавленных чудовищных деньков, от силы штуки две;\nЛиловых парусов,\nНасколько хватит воли;\nИ горсть нарезанных трусов;\nВзболтать, сложить в духовку, маслом смазать;\nДобавить тёртый сыр;\nДва зубчика, два зуба выбить,\nНо три уж будет чересчур;\nРассыпать фурнитур;\nПриправить грехом;\nНасыпать пыль мускатного ореха;\nЕщё раз кошки хвост добавить;\nИ блюдо получилось!\nВсё чудесно!\n\nВот так вот очень интересно \nГотовить кашу Геркулеса!"},{"date":"18.12.2019","title":"***","titled":true,"body":"Тот факт, что я не спал так долго\nМне в коем веке веки мне открыл.\n\nИ всё мне у-тю-тю,\nА я ещё купил утюг\nИ обзывался куклой.\n\nМне подарили пароход,\nПотом отняли - такой сюжетный поворот.\n\nА где-то далеко отсюда \nЯ тоже подарю колечко\nЖелтушной пламенной змее,\nКоторой жаловаться вечно\nНе жаль змеиновой семье,\nТой змейке мой колечко велико,\nНастолько стыдно ей настало,\nЯ (в) век таёжный падал целиком \nИ ей я тоже падать не заставил,\nИ этим вот змеиновым хвостом,\nТем кончиком всё менее и менее конечным,\nЗадумался я заново и снова всё о вечном, вечно-перевечном."},{"date":"19.12.2019","title":"Дамские расчёски","titled":true,"body":"Я выйду ночью в чудо-поле,\nТам я найду три яблочных куста,\nЗадýшит сердце снова долей,\nПроявятся секретные места.\n\nОт этой мудрости, вот этой,\nНастало мне обидно,\nНевкусно стало и тогда\nСчитать я начал капли ливней...\n\nЯ вышел ночью в чудо-поле,\nУвидел я там три куста,\nЯ дал раскрыться силе воли,\nНаполнились теперь живым уста,\n\nТеперь нога болит - устал,\nНо лазать я не перестал,\nТам ветви, я пират, \nЯ с бородой и не пират,\n\nТам заползает трясогузкой,\nТам ложно-вывихнувши, врозь,\nЯ прогонял, болел кто лось,\nИз них горючее лилось,\n\nНадел на них штаны,\nЕщё подштанники одел\nПодделку леской, сыт на ты,\nНо номер пряный, бестолковый,\n\nИ вроде как я напылил,\nВезде пороги, ноги, да тревоги,\nВсей жизнью подведённою итоги,\nТорги на рынке вербой.\n\nЖаль жалость проявляю, \nДверьми не стало хорошо,\nА плохо вовсе расплескало\nИ стало сухо и тепло."},{"date":"21.12.2019","title":"Про человека","titled":true,"body":"Мне страшно.\nНе столько страшно, \nСколько просто странно.\nЯ встал-проснулся утром,\nПришло сознание и вот\nЯ осознал, что я как ночь, как толстый рыжий кот...\nА человек как гончий пёс,\nВсю жизнь в погоне, как река,\nНо он отбросил берега,\nИ ключ источником забил, пошли года,\nИ принял обезболивающее,\nНо нет животных ноющих,\nНастолько сомневающих,\nКак человек. \n\nДвенадцать дней,\nТри сомна как один, невольный капитан,\nТревоги, муки, смех, капкан\nИ я один. Смял мятлик, доложил,\nИ сколько кто бы там не жил, \nХаотик нàручей, опять ручей,\nДелил собою 0 и жаркость,\nМне было не до этого, зажатость\nОбвила мой натужный взгляд\nИ те камзолы, яркость пят, \nНаполовину и за хвост,\nДовольный тортик, древний мозг,\nДревнее древа жизни то,\nДревнее яблони грехов,\nПрирода радует, и радует она китов."},{"date":"21.12.2019","title":"Слова в пустоту","titled":true,"body":"Слова направлены к тебе\nВот слушай:\n\nПробелы все в чём-то логичном,\nА стены в краске неприличной,\nНастолько пошлой, что вигвам\nНастал борделем плотских дам.\n\nНо быть каким-то мне не хочется,\nИначе смеху самому хохочется \nВ уютном неглиже.\n\nИ вот не поздно мне уже\nПознать разумности черты\nИ благо, ровно, как и ты,\n\nДавным-давно ржавеют звёзды\nИ уплывают поезда,\nНо лучше нет, чем счастья слёз и\nНемеют земли и слова,\n\nНемеют ноги при луне,\nИ жадность тоже отнимает,\nНо нет прекрасней, чем во мне\nОт жара пламени всё тает,\n\nА город жадный, рукотворный,\nПо мне так маской непритворной,\nСожмётся в страхе и ему \nПринýдит час пойти ко сну.\n\nЯ радостно рукой косну,\nЖелательно и благотворно,\nЯ снова пухлость губ её кусну,\nИ буду тоже сна всё ждать покорно."},{"date":"23.12.2019","title":"Хроника круглого","titled":true,"body":"Кто такая Навсикая?\nРеют звёзды рассекая,\nГреют розвые пелёнки,\nИ мальчишки, и девчонки, \nВсе согрели - суррогат -\nОн боится, что богат.\nВот и небо голубое,\nГолубь голый, всё нагое,\nШевелиться под ногою, \nБрызжет льда метеорит,\nА во лбу звезда сверли́т,\nТа, что реет, греет, шьётся,\nВòду крàдит из колодца,\nВоду льёт всё по ведрàм\nБольше круглых, господ/дам,\nНу давайте, выпьем мы\n(Из того ведра воды),\nЧтобы не было зимы,\nНу а лето - чудо света,\nМы оставим на потом,\nИ рубашки рвали где-то,\nИ ночнушки сапогом.\nЧудно! Весело, ребята,\nНам не скучно быть опрятным, \nНам не скучно быть понятным.\nДàли, птицы, там, ждали́, \nСальвадор пришёл Дали́."},{"date":"29.12.2019","title":"...","titled":true,"body":"Мало чувств, чтобы почувствовать,\nМожет быть, предчувствий чувственных,\nЗачерпнуть, таить, сочувствовать,\nСемиспинный Рубикон,\nСпит, москит, наглец, бесстыжий,\nСны же там же \nЛужей рыжей\nОтдаются как капель \nКапает, чтоб с далека,\nНаверное/наверняка\nНету днà той, что(б) река.\nСразу в брод её с утра,\nСапог не сразу, пару пар,\nА на привет au revoir."},{"date":"29.12.2019","title":"***","titled":true,"body":"Много...\nНеприлично много всего в пустоте."},{"date":"31.12.2019","title":"***","titled":true,"body":"Город засыпает.\nПросыпается дух авантюризма."},{"date":"31.12.2019","title":"Новогоднее стихотворение","titled":true,"body":"Понимаешь, этот в красном,\nТри \"привет\", три самобранца, \nКактус, ёлка, телогрейка,\nИ красивая индейка,\nНаподдали всем, ребята,\nВсем раздали дигидраты,\nВсех обдали, везде вата,\nТакова за новь оплата.\nДелись тёплые штаны,\nИ ресницы улетели,\nНочи нам уж не страшны,\nА страницы били телом,\nБеллетристикой сложили,\nЛожно-залежно прожили.\nПережили три потопа \nТри потомка пережили \nЭрудиты, дебоширы,\nВсех полей, пространства шири,\nВсех облить зелёным жиром,\nВсех заставить танцевать,\nЧтоб настолько было много\nВеселиться, петь, сиять,\nЧтобы не было тревоги,\nИ того поднялся меч,\nЧьи престарческие ноги \nВремя заставляют течь."},{"date":"02.01.2020","title":"Рассвет","titled":true,"body":"С глазу нà глаз докучает,\nСлучай набожно скучает,\nКак начнёт три тонны взвеси,\nСразу станет неизвестным,\nСразу тронутся все льды,\nИ дороги, и пруды,\nСтанут землю поливать,\nСтанут зырками плевать,\nЗадерутся, что есть мочи,\nЖили дальше дни и ночи,\nТри, три ласковых и банных,\nМы затравим всех неравных,\nВсех неверных обречём,\nИ давай рубить ... (мечом),\nНу а грацию кобылы\nМы заставим допивать,\nЧтобы было, наши, было,\nЧтобы лакомей швырять.\n\nИ тоскует, и марает,\nТот без зависти моргает,\nЧьи три горные кобылы,\nБыли, наши, дело, было,\nРовно в полночь на горе\nБык упрячется в норе,\nНа горе запляшут страхи,\nУ подножья взойдут маки.\nЖили всё мы, пролетели,\nНу хотя бы держим в теле\nИ себя, и три кобылы,\nТех, что норы было-были,\nТреугольником ружья\nДух заплачет на меня,\nЯ ему: \"не плачь, дружище\nСолнце скоро нам взойдёт,\nИ тогда на пепелище\nСтрой из муравьёв пойдёт!\""},{"date":"13.01.2020","title":"Шах и мат","titled":true,"body":"Может разом, может в горы? \nМожет, в тени мантикоры?\nМожет, радиоприборы?\nМожет, сказку почитать?\n\nЖадно, трепетно и ясно\nСмотрят муравьи напрасно.\nДогорели уж угли,\nПоплыла тоска в углы,\nЗаточилась наизусть,\nКто-то скажет: \"Ну и пусть!\",\nСкрипнет ржавое корыто,\nТело всё травой покрыто.\n\nПроплывём гусями реки,\nВсе края перелетим,\nБудто спать теперь навеки\nНас уложат в карантин,\nЗакуют себя цепями\nИз верёвок и платков,\nПригрозятся прыгнуть в яму.\nБой курантов-молотков \n\nЗвучен в тёпленьких ушах.\nНам опять-таки притворный\nШахматист поставил шах.\nМатериться не любитель,\nВ общем, плакал до утра,\nНу а сказочник-губитель\n(То ли змей, что искуситель)\nНе показывал нутра."},{"date":"13.01.2020","title":"***","titled":true,"body":"Отчаянно самонадеюсь\nНа прогулки по горящим тропинкам под дождём\nИ на гнетуще-грядуще-идущую самобытность."},{"date":"16.01.2020","title":"Ты, живущий!","titled":true,"body":"Не болело бы сердце,\nИ ноги чтоб сами несли,\nПродирая глаза, утром греться\nУ деревьев, что вечность росли.\n\nНезадолго до солнца садиться,\nЧтобы утром его обогнать,\nЧтобы жарче цветов разродиться,\nЧтобы ярче повсюду сиять.\n\nПоклонись же, где твоя вежливость?\nВидишь, как хрупко вокруг?\nИ тогда ту спокойность и сдержанность \nОщутишь прикасанием рук.\n\nОна вырвет тебя отовсюду,\nНаизнанку тебя повернёт \nТы, живущий! Обрадуйся чуду!\nДальних странствий твой вечен полёт."},{"date":"28.01.2020","title":"***","titled":true,"body":"На лошадь похожа, да? \nНе лошадь...\nНЕ ЛОШАДЬ - УЖ!"},{"date":"29.01.2020","title":"***","titled":true,"body":"Мой дорогой, можно сказать, лучший друг, здравствуй, вот в общем-то и всё, что я хотел сказать."},{"date":"29.01.2020","title":"Ветер","titled":true,"body":"А ветер уносит, качает, роднит,\nМысль он впечатляет, сидит, да сидит.\nОн встал и ушёл,\nЧто теперь делать нам? \nНе уж то нас ждёт лишь печаль и туман? \nПридётся искать у ворот, по углам, \nИль нового сделать ребёнка — вот план:\n\nПостучавшись в окошко, попросим воды,\nТотчас же крикнет смотрящий: \"Коты \nРазбегутся, откроется ящик,\nЛопнет затем неуклюжести мячик,\nА там гармонично расставлены сосны \nИ старых зданий штук сто - все под сносы,\nТропинки пропитаны ленью и массой \nИ вот-вот обвалятся стены каркаса -\nМакеты напрасно стоят из пластмассы,\nА ящик почётный деревьями горд,\nИ листья с него опадут в новый год,\nНи больше, ни меньше, они все подряд \nГотовы разбиться - чтут старый обряд\".\n\nОбняли сгущённые краски закат,\nДень опустился, я шёл наугад,\nА дочь родилась, \nТак оно в первый раз,\nТак будет ещё, её чувственный глас\nСменит опять долговечного руки,\nВот раздаются всё благости звуки,\nА триумфальности юное знамя \nОбъяло невинности вечное пламя."},{"date":"01.02.2020","title":"Самобытность сверчка","titled":true,"body":"Лампа, гранат, ледяной, тригонометрия, опять я синусоид, шершень, щётка.\n\nДетвора резвится, просят меня им мяч кинуть, а я его раз... и проколол. Долго плакали, я успокаивал, говорил, что это ради блага, говорил, что мяч напоминает о круге, который является символом цикла и цикличности, я не люблю, не люблю такое, и мяч этот - бесконечное бессмыслие.\nНескончаемое поле боя красноармейца и Андрея, его гипофиз повреждён, а в районе колена ранение. Он любит женщин и не любит умирать, он любит тоску и не любит картошку, он любит, он не любит.\nА там, где сверчок всё-таки стрекочет своим стрекоталом — вот там и открывается истинная тропа победителя, и результат прохождения по ней обретает суть только в начале и конце пути.\n\nНа сём всё."},{"date":"05.02.2020","title":"***","titled":true,"body":"А ты представь, если б разум ожил, сознание стало осязаемым... Тогда может, и не писал бы никто ничего, ведь пишут от одиночества, от того, что не понимают, мол, может кто другой когда поймёт, но вот только времени не существует... Так вот, станет, значится, разум живым, ну и с телом пойдёт гулять, веселиться, а душа... Бог её знает где... Наверное, повсюду... Повсюду и нигде."},{"date":"10.02.2020","title":"Танец луны","titled":true,"body":"Плавала луна по небу, \nПозвала на танец деву.\nИ застыла, и зависла,\nСмотрит-радуется, быстро.\n\nВсё обвило старым дымом,\nТèплят розовые щёки,\nДревних странствий всех незримых\nСделал звездочёт расчёты.\n\nЛунный танец обречён!\nЖемчуга обвили сетью -\nОна знала, знала в чём\nСмысл двигаться к бессмертью.\n\nНо понять её природу,\nБледных глаз немую моду,\nСерых рук, сухих, безводных, \nНет таких в нас производных.\n\nПолумесяц обречён\nСтыть навек параличом.\nСлушать музыку любви,\nИзрождённой из пыли.\n\nНо она украсит бледность,\nДаже если нет цветов,\nДаже если путь как бренность\nИ на нём следы котов.\n\nКролик бегает по небу,\nСкачет, собирает звёзды в сеть,\nЧтоб сияющую деву\nЧерез поцелуи слёз воспеть."},{"date":"11.02.2020","title":"Славься, слався","titled":true,"body":"Друзья!\nТоварищи!\nИ... некоторые коллеги..!\nВосславим Славу Святославовну!"},{"date":"16.02.2020","title":"Песчаное чудо света","titled":true,"body":"Моё море - пустыня, а я в ней песок,\nЕда уж остыла, а ем я песок.\nНо вдруг несваренье - я начал блевать,\n\nИ вышли наружу песчаные замки,\nИ сотни строений от крупных до жалких,\nПостроился город на море без дна,\n\nА имя ему дали в дар небеса.\nИ в городе том начались забастовки,\nИ пламя на улицах, злости листовки,\n\nТеперь этот город другой стал совсем,\nОбвился заставой из мраморных стен,\nА трупы покойных бросали под ноги,\nИ горько мне стало с такого итога.\nТогда я набрал в свою грудь небольшую\nВесь воздух на свете, что можно принять,\nИ встали все радостно дети на стулья,\nИ начали сольные вальсы плясать,\nА я потихоньку отдался забвенью.\n\nИ кто я - не знает меня ни отец и ни мать,\nДесантные ливни стучали о землю -\nПривыкли так музыку жизни играть."},{"date":"19.02.2020","title":"***","titled":true,"body":"ЧТО СДЕЛАЛ ГОРОХ О СТЕНКУ, ЧЕГО НЕ МОЖЕМ МЫ?!"},{"date":"23.02.2020","title":"Сарафанчики","titled":true,"body":"Маленькие мальчики,\nЗвонкие звёздочки,\nЗаводные куколки,\nТравушки пахучие,\nСарафанчики колючие."},{"date":"23.02.2020","title":"Десять","titled":true,"body":"С точки зрения линии слуха\nПлоскость доисторического нужно\nСвернуть журавликом, поджечь,\nА затем и в брод пойти.\n\nВ псковском районе.\nОна поддразнивает,\nЯ решительно не сгибаю,\nЯ решителен, несгибаем,\nМы слишком поздно погибаем,\nИ кажется, теперь, я понимаю:\nДорожить или не вспомнить?\nДорога, жить, или не вспомнить?\nСпрячет десять карт подряд \nПод пряды \nШелкопряда.\n\nМоя комета - шарик маленький.\nА чавкая, мы просто мыслим,\nСорвать ли нам цветочек аленький?\nДуховность закрутилась, мы́ с ней,\nНырнули в чёрную дыру,\nВ ней же тепло,\nПурум-пурум!\nТеплее всего.\nПурум...-пурум!"},{"date":"23.02.2020","title":"Дорога","titled":true,"body":"Только вымрешь понемножку -\nСтанет туфель по чуть-чуть,\nЗакричит от зла дорожка -\nОна строит чудо-путь\n\nЧерез векторы и поле,\nЧерез двери и мосты,\nНо кричит она от боли,\nЧто извилины просты,\n\nЧто на ней такая доля,\nЧто не хочется ей стыть.\nПротоптать собою поле,\nНаправления открыть,\n\nСемь путей согласно ветру\nВрозь раскинется она,\nИзучать её придётся \nНам потратить не года -\n\nСорок три столетий ярких\nНам придётся изучать,\nОт холодных рук, до жарких \nНам придётся пережать,\n\nНам держать придётся плечью,\nГоловы родных и нет,\nНам придётся жечься печкой,\nЧувствовать пульсаров свет,\n\nА когда сотрём тропинки -\nНа их трупах танцевать,\nНам ещё сыграет Глинка,\nЦеловать чтоб землю-мать."},{"date":"27.02.2020","title":"***","titled":true,"body":"Надо попробовать, попрыговать,\nНадо попробовать, попрыговать,\nНадо попробовать, попрыговать,\nНадо попробовать, попрыговать,\nНадо попробовать, попрыговать,\nНадо попробовать, попрыговать,\nНадо попробовать, попрыговать,\nНадо попробовать, попрыговать!"},{"date":"01.03.2020","title":"÷÷÷","titled":true,"body":"Моих тревожных мыслей \nКоробочный характер \nУплыл без весточки за горизонт,\nКак будто самоходный катер,\nКак будто из себя он возомнил \nСкалу под следующей скалой,\nТранзитом пробегая заграницу -\nИсследовать всё хочется самой,\nИ все дома, где свет горит,\nИ кто-то корчит свою рожу,\nИ как непаханое поле говорит,\nПро сок гранатный, про любовь,\nНа маятник движения похожи\nДвоюродных и смелых берегов.\n\nНо голос был готов отдаться,\nОн руку протянул и не зажал кулак,\nИ вот уже и начало смеркаться,\nИ живодёров жадных, как бурлак, \nОн пристыдил и раньше заступился\nЗа сметные сокровища и дверь,\nВедущую наружу отовсюду.\nСдержал я слово, но увы,\nОт жалких слов до стона вы\nМеня оранжереей убедили\nО широте тех разговорчивых полей,\nО самодурах, (сумасбродах,) самосвалах, \nО сырости запущенных подвалов,\nВсего, что, в общем, сердцу ближе и милей."},{"date":"02.03.2020","title":"Жить #3","titled":true,"body":"Жизнь живёт, это её свойство. Жизнь возродится и будет брыкаться. И снова будет танцевать, плясать, радоваться, играть и смотреть на эти очаровательные глаза, в которых видна безграничность всего, в том числе, и самой этой жизни."},{"date":"02.03.2020","title":"Откройте","titled":true,"body":"Хочу я говорить, не открывая рта,\nХочу я петь с закрытыми глазами,\nКогда кричал - чтоб истечения утрат\nПоисключали час и полумедь незнаний,\n\nГероям сказок небольших\nДоходит срок до сыпкости в структуре,\nПо выражениям их лиц\nВозможно лишь слепить скульптуру.\n\nСтепенно мог хоть до утра\nРассказывать о благостных твореньях,\nОт Илиады до Петра,\nЖаль, я не сведущ в откровеньях.\n\nНа утро надо мне признаться в смерти,\nНа день развратный план составить,\nА вечер полон самобытий,\nМоей тревогой, перипетий, \n\nНакатит хмурая усталость,\nИ блеск сомнений поугас,\nИ, кажется, вот-вот, лишь малость -\nИ станет лошадью пегас,\n\nИ шорох трепетом настанет,\nЖивой покланится земли, \nИ женский парус дуть заставит,\nКак будто бури замели.\n\nОставлен запах последождный -\nНа деревянных полках он,\nИ наслажденьям радуяся ложным,\nРаздастся жалобливый стон.\n\nНо вот он поутих, и глупость ожиданий \nПодарит жаренных на солнце Артемид,\nДесертом станут боли оправданья\nИ откровения застывших пирамид."},{"date":"02.03.2020","title":"Гвозди","titled":true,"body":"Шли проходом два урода,\nЗавернула вдруг дорога,\nТе на лавочку присели.\n\nВдруг из рта у одного \nНачался понос словесный,\nПрокряхтел про самогò...\n\nОн пропел, что слон нечестный \nЗастучал и разозлился,\nЧто уж некуда бежать,\n\nНо пришёл один и влился,\nА затем и заступился.\nИ ступил на ржавый гвоздь,\n\nТот направился в слона,\nОт слона слоновья кость,\nА течёт не кровь - слюна.\n\nСлон тот был чудной, волшебный,\n(Формой стал похож на пушку,)\nОн обвил собою шею,\nВыковал в печи заглушку,\n\nДёрнул за руку февраль\nИ копал святой грааль.\nДокопался до невзгоды,\n\nВдруг гвоздь начал подступать,\nСлон несчастный скинул годы,\nНачал в цирке выступать.\n\nТак его он успокоил -\nТак его он усмирил.\nВсе теперь узнают точно,\n\nЧто тот самый, что с гвоздями,\n(А ещё и жил он в бочке -)\nТак взошёл на Фудзияму,\nУ него у уха, в мочке\n\nГвоздь торчит, нет, саморез,\nОн теперь ночует с нами,\nГоловой к нам в сон пролез,\n\nМы его оттуда гнали,\nЗаползал он, всё он лез,\nМы тогда его погнали\nПо тропинке в тёмный лес,\n\nДолго там он брёл слезами,\nОн не вспомнил, что с гвоздями \nНадо быть смелей с горстями,\n\nОн остался там навеки -\nТак и умер до костей,\nНо нашли его вдруг греки -\n\nТруп их начал прогонять,\nЗная, что нет толка в этом,\nНо себя так не унять,\n\nОн им дал все свои гвозди,\nПроржавели уж они,\nА незваные те гости \n\nНачали плясать и пить,\nЧто он умер, что с гвоздями,\nЧто смог слòн здесь победить!"},{"date":"04.03.2020","title":"Кушайте","titled":true,"body":"Кушайте бананы!"},{"date":"12.03.2020","title":"17","titled":true,"body":"По дню на скате крыши красной,\nТакой же красной, как и день,\nНаполненной горелой сажей, \nПрогорклой рыбой кожаный ремень;\n\nДень ясен, словно блеск\nВерёвки золотой, как блеска,\nКак натяжённая струна, как леска;\nКак у суставов нежный треск и\n\nРовно два плюс пять плюс десять\nНа ровном поле затянуть,\nИ радость будет много весить,\nИ можно в старость заглянуть."},{"date":"13.03.2020","title":"Синдром","titled":true,"body":"Жиром, маслом понарошку,\nА потом и в землю-сырь,\nЧтобы стали хоть немножко\nШире руки, руки вширь!\n\nИ глазища широки,\nИ чтоб ноги по углам,\nЧтобы уши-пауки\nПоделились пополам,\n\nОт пупка осталось слово,\nВолоса плывут в ручье,\nДетородный орган новый,\nНос запутался в ничье.\n\nКрасны красные сосцы\nИ язык порозовел,\nГрубо гунны гнут крестцы,\nГубы белые, как мел,\n\nИ ресницы, словно перья -\nБархатистые они,\nПальцы божьего творенья\nПрорастают, словно пни,\n\nШевелится селезёнка\nИ в кишках завёлся жук,\nЭто всё из-за зелёнки,\nЧто стучится: \"тук-тук-тук\".\n\nЧто случится?\n\nСыровато, серовато,\nСерой скорая полна,\nГрудь, наполненная мятой,\nВ сердце пламени волна!"},{"date":"22.03.2020","title":"Дыра моей повседневности","titled":true,"body":"Бронзовые звёзды улыбались грустно,\nПоздние берёзы расцветали густо,\nРазверзалась скверна кислою капустой,\nА мне так же снова мило, поздно, пусто,\n\nИ уже не скажешь слово,\nВсё заткнулось взаперти -\nЭто поиски сверхновой,\nЦелью задался: найти.\n\nЯ бродил по дну галактик,\nНа ауле звёзд кричал,\nМне подруга-математик \nЗаварила крепкий чай.\n\nПыль созвездий изучая,\nЯ в туманностях бродил,\nТам я встретился случайно\nС тем, зовут что Крокодил,\n\nНаходил я в нём не солнце - \nЯ нашёл в нём мира свет,\nВ том несчастном меченосце\nГод считался за сто лет,\n\nСотни лет подземных коек,\nТриста дней червонных туч,\nСеребро созвездья троек -\nНичего не скроет луч.\n\nТолько вместо излучений\nНичего не видно там,\nЗначит, быть и приключеньям\nТам ведь чёрная дыра!\n\nПахнет кислою капустой,\nКапитан закрыл свой нос,\nМы направились ей в русло -\nПеред нами встал колосс.\n\nВот мы в точке невозврата,\nЭкипаж даёт нам честь,\nЯ стесняюсь, ведь к ребятам\nВсей любви моей не счесть.\n\nВот все стали раздеваться,\nИ вокруг стало темно,\nИ я начал волноваться,\nВдруг увидел я кино\n\nПро баранов и про чаек,\nПро апрель и про любовь,\nПрослезился я нечайно,\nВолосатой стала бровь,\n\nЯ тогда верёвкой-ниткой,\nЧто от синего платка \nПривязал к чудной калитке\nНепослушного себя,\n\nПривязал и был спокоен -\nТак остался я во сне,\nНе ворочаюсь, освоен,\nТак всю жизнь я сплю в весне."},{"date":"31.03.2020","title":"Квас","titled":true,"body":"-Знаешь, что такое квас? \n-Нет, а ты?\n-Дурачина, это же птичка такая!"},{"date":"06.04.2020","title":"Содержимое","titled":false,"body":"Содержимое"},{"date":"10.04.2020","title":"***","titled":true,"body":"Одно окно хочу, чтоб открывалось в лес,\nДругое в океан,\nЧтоб третье на пустыню посягалось,\nЧерез четвёртое - буран,\nА сверху крыша к звёздам открывалась,\nМне нужно ведь немного, саму малость..."},{"date":"10.04.2020","title":"Амнезия","titled":true,"body":"Забыл я про юность, про старость, года,\nИх не было, может, совсем никогда.\n\nСидишь, трясёшься, гнёшься птицей\nИ сочиняешь находу,\nИ песенки немые напевая,\n\nДоярки ходят подоить\nКоров из звёзд что сотканы,\n\nИх ниточки прочны,\nА млечные пути сочны,\n\nИ это так всегда и было\nДа и скорее будет так ещё.\n\nДа вот религия такая,\nО том, что нужно быть как столб,\nБыть величавым и без стоп,\n\nСрастись с землёю надо в старость,\nЧтоб на века, чтоб позабыть усталость.\nЖивотных хочется обнять,\nА самого себя принять\n\nИ отвернуться ото всех,\nТогда вот это будет грех.\nУ нас религия проста,\nИ если ты дожил до ста,\n\nТо соизволь напиться солнца,\nТяжёлым гелием наешься,\nПрисядь, и посмотри в оконце,\n\nТы посиди и не спеши,\nНаешься гелием несносным,\nНапейся солнцем трёхполосным,\n\nИ обомлей, и обожгись,\nИ упади - не простудись.\nСрастись с землёй!\nУж потрудись..."},{"date":"13.04.2020","title":"***","titled":true,"body":"Мне звёзд на небе не хватает\nИ в горле ком от слов таких -\nЯ скоро до конца растаю...\nМой плавный полуночный стих:\n\nРастаю от тепла кометы,\nРешений правильных и нет,\nРасплавлюсь, данною мне метой,\nПод этим небом, что как плед.\n\nПлеяды горизонтных линий,\nОтрезки темноты и мрак,\nЛучи от солнца словно клинья,\nВсе точки собраны в кулак...\n\nИ явь окажется неправдой,\nИ дух захватит сонный труп,\nОбвеет запахом лаванды,\nИ расползётся тень Бермуд!"},{"date":"13.04.2020","title":"Белка и Француз","titled":true,"body":"Тогда я нарисую стебель,\nА из него родится дуб!\nЯ ожидаю глупо осень \nИ я считаю: семь, да восемь,\nИ вдруг сто,\nА праздники с утра листом\nМеталлом-простынёй накроет,\n\nМурует древние поделки,\nВсё ищет, ищет норы белки,\nТой самой жуткой из чудес,\nЧто обитает там, где лес,\nПовсюду где листы металла,\nЛесных орешков, всё ей мало,\n\nЕй звери строили корабль,\nПостроили и запустили в космос -\nЛетала где созвездие журавль,\nИ приземлилась на планету.\nПовсюду много-много лета,\n\nНо мне бы до весны прожить,\nМне в осень хочется кружить,\nКак листья над землёй,\nТогда она ползла змеёй \n\nК пчелиным сотам на лугу.\nТе попросили одолжение\nИ было безотказно предложенье,\nИ белочка кричит: \"Могу!\".\n\nТогда она пошла к берлоге,\nРасставивши пошире ноги,\nОна вдруг стала напевать:\n\"О, мой любимый, выйди погулять...\"\n\nИ из берлоги вышел труп,\nОдетый в чин - на нём тулуп,\nИ на французском отвечает:\n\"Да что ты, я в тебе души на чаю!\".\n\nОни пошли под тень от дуба,\nИ возле бани, что из сруба,\nУселись тот француз и белка.\nИ вроде их любовь и мéлка,\n\nНо всё же лучше ничего.\nНа этом я рассказ кончаю,\nПойду-ка заварю я чаю."},{"date":"19.04.2020","title":"Жабры","titled":true,"body":"Седьмая клетка расползлась,\nРасплавились шасси,\nГрибы весною словно всласть,\nГосподь, помилуй и спаси.\n\nДельяра марина перна\nКивила розовые плечи,\nИ перны колером полна\nРастапливать грозится печи,\n\nКраватьей шуткой правруком\nКланала длань гешната несье,\nЗарала давние тирком\nИ вот запела нежной песней:\n\n\"Карила сила влатемила,\nТиньяна пенья Гватемала,\nТоска несчастья не убила -\nКартавила, пила, ей мало,\n\nЕй мало шариков и шишек,\nЖернòва талые храня,\nОна развесила бельишек,\nБеркант созвездия миня.\n\nПранидикат картавый стал,\nОн тоже кинулся под поезд,\nОн тоже гладил, пил \"навал\",\nЖемчугой вызванная боязь\".\n\nТак пела бледная девица\nДо пор таких, что ночь настала,\nОна искусная певица,\nНо было всё ей, всё ей мало.\n\nОна тарторой та-ра-ра,\nГнэльшатой радугой поневши,\nВзнимает с неба Нептуна,\nВ обед она совсем не евша,\n\nИ вот он был сие таков,\nОн радинàкил, санискòв,\nНу а потом он снял оков,\nСвоих немодных, кундриявых,\n\nИ улыбнулся..."},{"date":"19.04.2020","title":"Пирог","titled":true,"body":"Я поиссохся,\nГлаза как рыбы,\nЯ полон ветра\nИ звёздной пыли,\n\nЯ ранен гвоздем,\nЯ пахну хромом,\nНавозом козьим,\nДетским громом.\n\nЛимонна туча -\nСинен лес,\nЗловонней, круче,\nЧем из чудес,\n\nСедьмой декадой\nДолог красен,\nКто пахнет адом\nВсех жирных масел,\n\nЗарублен шашкой,\nКто в лес уходит,\nКто с чёрной пташкой\nПод древом бродит,\n\nТот сразу найден,\nТот в мире жизни,\nКто льётся сзади - \nГлухи мелизмы.\n\nИ пешкой чёрной,\nИ шашкой властной,\nПирог печёный\nИз яблок красных."},{"date":"19.04.2020","title":"Весна","titled":true,"body":"Как всё натужно зазеленеет:\n\nИ медь, и мысли, и трава,\n\nКак зеленится горизонт,\nГраница неба, как мой зонт\n\nПромок в густом дожде косаток,\nПол сотни их из вод морских\nПлывут по облакам пустым,\n\nПустынным воем навывая,\nПалитры красок обронив,\nИ \"торопливость\" жизнью называя,\nО смерти триста лет молитв\n\nНа языке не рыб, а птиц,\nОни не чувствуют покоя,\nИ не хотят красивых лиц -\nОни желают плавать в море,\n\nОни желают вечно выть.\nЗачем им эта многозначность?\nИм не нужна подруга свеч,\nИм лишь бы бледную удачу\nНе освещая сразу сжечь!\n\nТираны вышли как скульптуры\nИз мифов о вершинах странных,\nКак будто части той культуры,\nКак будто ран, но не кровавых,\n\nИх долг понять свою природу,\nГорнило пламени посеяв,\nИ развязав Гордийву ноду,\nПризнаться в братстве Моисею.\n\nТеперь они стоят недвижно -\nОни уже не взаперти,\nНу всё, пойду уже я в книжный,\nА те... вольны да хоть куда идти."},{"date":"19.04.2020","title":"Бибизяны","titled":true,"body":"Когда я приду я не знаю,\nНо я точно когда-то приду!\n\nБлагородный жар конструкций,\nЧудеса полны деструкций,\nНе нужны листы инструкций,\nИ вагонов полон рот,\nЧужекрылых, \"белых\" нот.\n\nОт щеки отскачет верность,\nВетер в поле не угас,\nНа тарелке ждёт безмерность -\n\nОстывает; любят нас\nГолубые бибизяны\nБез приличий и изъянов,\n\nЗолотые бибизяны \nБез причины и тревоги,\nУ них ласковые ноги.\n\nСтопы, словно монастырь,\nВы поверьте, их дороги\nПерехожены до дыр.\n\nЯ заветно постараюсь,\nЯ воспитывался сам,\nХоть ходить по ним стесняюсь,\n\nЯ направился вперёд.\nПо дороге встретил сумрак,\nЯ спросил: \"чего грустишь?\".\n\nОн ответил мне натужно,\nХоть и был как лев наружно,\nТонким голосом пропел:\n\n\"Я хожу сюда как странник, \nЯ ищу проход в Тибет.\nДля меня дорога - пряник,\nВот подарок мой тебе\"\n\nКак сказал - то дал мне свёрток \nЯ открыл - внутри как короб,\n\nВ этом коробе шкатулка\nСо сменяющейся втулкой.\n\n\"Дашь мелодию чи що?\" -\nНо он, видимо, ушёл.\n\nЯ направился подальше, \nШаг уже сменил на бег,\nСтало мне немного страшно:\n\"И зачем мне ваш Тибет?\".\n\nПрискакал я к слизняку,\nК виноградной той улитке,\nЧто сидела на калитке,\n\nОна фыркнула в ответ \nГоворит, мол \"стыдно, нет?\".\n\nЯ легонько отвечаю:\n\"Ладно те, давай-ка чаю!\".\n\nБыстро стол накрыли в зале,\nПрискакал и сумрак тот,\n\nМы кого-то там связали,\nА потом всего стязали,\n\nМожет этот был и я,\nЯ не помню, но в итоге\nВидел я как те дороги\n\nОбратились в прах и пух.\nМне досталась встулка с песней,\nЯ включил и звук потух.\n\nЯ опять его включил,\nИ тогда из той шкатулки\nПрорвалась сильней всех сил\n\nЧудо...\n\nПесня про любовь."},{"date":"20.04.2020","title":"Рождение бурундука","titled":true,"body":"Зародился как-то в точке\nНи то сыном, ни то дочкой,\nСтал гнать подвигов каркас,\nОбрекли его \"Пегас\".\nПолетел на запах он,\nТут увидел телефон\nЗазвонил и был таков,\nВсё отбросил от оков,\nОн спросил: \"ну кто звонит?\".\n\"Он родился, он убит!\" -\nТри так раза прокричавши,\nАкушер поднял ту чашу,\nЧто лежала над ребёнком.\n\nТем неведомым ребёнком\nОказался наш герой,\nПарень, в общем, бурундук,\nПод его мышиный звук\n\nЗатряслость вдруг всё вокруг,\nЗастонали понаслышке,\nТри небритые подмышки:\nРаз - кричит на пенопласте,\nДва - заёрзает крестом,\nТретья - любит слово здрасьте:\nТри девицы под окном -\nТрём девицам путь в дурдом.\n\nЖернова на ферме встали,\nОкучнились волоса,\nСобрались слова из стали -\nСтала белой полоса.\n\nГоворит одна девица:\n\"Я люблю орать, я птица!\".\nА вторая ей кричит:\n\"Я мартышка чи-чи-чи!\".\nТретья долго не сдержалась\nИ сказала как ножом:\n\"Притворялась я ежом!\".\n\nТри солёные девицы \nПеликан, енот, синица...\nНет же, ёж, свинья, жар-птица, \nНу почти, сейчас, чуть-чуть...\n\nЧерепаха...\n\nЁж, та птица и мартышка,\nВсе набили одну шишку:\nОни все несчастны сердцем,\nВсе четыре ждут сынишку.\n\nОни все мамаши, да!\nНеужели вам мораль моя\nТак вот близко не видна? \nЛадно, роды в планах на февраль,\n\nА сейчас апрель уже \nНеужели не понятно?\nЭто как на витраже \nВ честь святого Себастьянто.\n\nТри зверька пришли к ребёнку,\nЁжик дал ему слона,\nПтица бурого телёнка,\nА мартышка не дала\n\nСовершенно никого -\nОна жадная была,\nВдруг услышав Самогò,\nВсё-таки лист пня дала.\n\nБурундук был всем доволен:\nСлон давал ему и шерсть,\nА коза и молоко,\nИз листочка свил он крест,\nЧтобы прятаться легко.\n\nПо указке стрекозы\nОн дал имя для козы -\nЗвать её теперь Дундук.\nПриключения, недуг\n\nВсё вот это к ним теперь.\nСлон стал посохом улитки,\nИ стал счастлив каждый зверь.\nСвили все канат из ниток\n\nИ обвили им меня,\nЯ тогда признаться честно,\nНичего не понимал,\nНо знаком я с ними тесно.\n\nВедь и правда так прелестно,\nКогда ты не мыслишь сходу,\nКогда ты находишь место \nДля себя на важных родах."},{"date":"20.04.2020","title":"***","titled":true,"body":"Покусали губы,\nЗаплясали трубы,\n\nТолько лес не пляс.\n\nНадевали колпаки,\nПлыли камнем вдоль реки,\n\nПлыли лодкой наудачу -\nВот уже сложней задача.\n\nВидели хрустальный сон,\nВидели стеклянный пепел,\nПели песни в унисон,\nХоть и выглядит нелепо,\n\nВдруг задумались - \"стена\"...\nКамень - вовсе не стена!\n\nИз туманности в туманность\nПлыли сны без тени в данность,\n\nПлыло небо из границ\nРавнодушных неубийц.\n\nИх вину зальёт вином,\nОбратится их геном,\n\nА когда признались Богу -\nИх цилиндров пальцев много,\n\nЖадных пальцев, словно слёз,\nШли путём аллей и звёзд,\n\nШли как будто в одиночку -\nКак Юпитер было точно,\n\nЗабрались на гор вершины \nИ пощупали морщины,\n\nПовбивали плетью ясность -\nСтало сложно выносить,\nТак, что выжила опасность,\nЧтобы жертв не приносить,\n\nЯ распахиваю веки,\nЯ распахиваю поле,\nЯ не помню жисти вехи,\nЯ лишь знаю: цифры, ноли;\n\nСтол урочен ко затменью,\nКакобычны mine сомненья.\n\nСтрою я воздушных замков,\nВдруг на небе на ночном,\nПрилетает призрак танков,\nМы болтаем ни о чём,\n\nПрилетают хироманты, \nПрилетают иерофанты,\n\nЯ наряжен, в портупею,\nСделал вид, чтоб потупее,\n\nЧтоб казалось - я грешён,\nЧтобы будто отрешён,\n\nНо они не догадались\nИ не стали дальше рыть,\nКак смешно же разгибались!\nНикому не дам остыть!"},{"date":"20.04.2020","title":"***","titled":true,"body":"Бронзовый лев \nВ объятиях солнца \nБродит как летом \nПо городу солнца,\n\nОн не стоит, а лишь тихо идёт,\nПотрогать его захотит идиот,\nПогладить всем людям его предстоит,\nЕго не заметить - он тихо сидит,\n\nСидит на печати -\nСидит на замке,\nОн хочет начать бы,\nНо ключ не в замке.\n\nВ заброшенной его тюрьме\nТаятся тайны древних нас,\nДа даже всей его семье \nГораздо ближе, чем до нас.\n\nНо вот он перегрыз замок,\nТеперь свободны полюса,\nОн выжал из себя что мог,\nИ стали целым\nЧасовые \nПояса."},{"date":"22.04.2020","title":"Любовь","titled":true,"body":"Любовь опаснее занозы,\nНо слаще пальца у виска,\nКАКИЕ ЕЩЁ К ЧЁРТУ РОЗЫ?\nЛюбовь позыбче и песка;\n\nТернистых топей, паутин\nЛюбовь гораздо вяже,\nЛюбовь и дней локомотив \nНесётся из-под стражи \n\nВ коморки тёплые, в дома,\nНо отключили отопленье,\nА без любви совсем уже беда -\nДни ожидания, томленья.\n\nПЛЕВАТЬ на зовы новых губ,\nНа никотин, что тает в венах,\nЛюбовь как многолетний дуб\nНа перекрёстке всех вселенных."},{"date":"22.06.2020","title":"Россия","titled":true,"body":"Слова не значат понарошку,\nОни звучат не понаслышке:\nГорошком, солью и ромашкой\nСедой рабочий притворяется,\nЗа это вождь и обнуляется,\nЗа то и птица обновляется,\nИ как-то порознь стоят\nБаклан, синица и червяк\nИ переглядываются."},{"date":"12.07.2020","title":"***","titled":true,"body":"Дайте неба, дайте тучи,\nЧтоб не мог пробиться лучик,\nДаже маленький кусочек,\nДаже мира лепесточек!\n\nДайте дождь и дайте грозы,\nБуйных вод, морских и пресных,\nУдивительные козы,\nМолоко в стакане тесном\n\nРазлилось на самом дне,\nИз ромашек прорастает \nНеосознанное чудо -\nТрёхголовый синий аист:\n\nТри крыла и три ноги\nИ на всех них сапоги,\nТри виска и три ноздри,\nИ вселенных тоже три:\n\nНаша, их, и дяди Маши \nВот такие пироги..."},{"date":"09.09.2020","title":"Под водой все средства хороши","titled":true,"body":"По голове падлой \nПо макушке тетеревом\nДесять раз плюнуть \nСрезать под корень \nНамекнуть походкой \nРадоваться неудачам \nПодражать поражения \nВ танце с бубном тоже есть свои плюсы\n\nСеверные льды\nОкеаны косаток \nДальневосточные плавания \nЦветочные букеты\nЖёванный пластилин \nПетропавловск на Камчатке\nДань уважения\nЗасунуть голову в песок \nПатрик Варфоломей\nВетка \nЧайник \nГальванометр \nБерёзовый сок по весне очень полезен, он питает весь организм, наполняя его жизнью и чёрствым хлебом, но это только если вы еврей, а если не еврей, вы не любите чипсы с тараканьей эндокринностью под пледом ранним утром, под одеялом и без лодки под забором и без чайника, и без корыта, и без любви, и без любопытства к бестолковым цветочным полянам, несусветным грязевым ваннам и бесконечно-...белоснежным салютам."},{"date":"09.09.2020","title":"Кони","titled":true,"body":"Силиконовые туфли\nГладят валенки забавно,\nКурят траурно на кухне - \nШлёпанцы убились в ванной,\n\nДенег нет, а есть веб-сайт,\nСтраха нет, а есть крыло,\nБыл топор и детский сад,\nНичего со мной жило.\n\nЖало трескается пряно,\nПо губе крадётся жук,\nДует ветерок упрямо,\nИз двери раздался стук.\n\nВдруг всё стало испаряться,\nГений мысли, сердца ритм, \nНеприемлемая цаца,\nПод углом углём сгорим. \n\nЖелобливое корыто,\nЛасточки без ног парят,\nЖаль, у Евы всё прикрыто,\nБестолковый снег творят\n\nТри ягнёнка в абсолюте,\nВ масле, в чистых небесах,\nВ пережёванной каюте\nИ таких же парусах...\n\nГеродоты и мандаты -\nТри монаха собрались\nИ пророческие даты \nИзо рта у них рвались:\n\nБелоглазая кобыла\nБудет бледной в декабре,\n\nРитуальные костюмы,\nШляпы, с перьями и без,\nПсу без лишних оправданий\nБес прям в голову залез,\n\nПоходил он год - другой -\nВидит на краю обрыва\nОчень терпкий перегной\nИ стоит там будто рыба,\n\nИ потом он спрыгнул вниз,\nТам была как жижа лужа,\nТам, где тот вот был карниз,\nТам была такая стужа,\n\nИ, короче, он пропал,\nА на этом карнавал \n\nЗакончился.\n\nИбо розовые кони,\nИбо лёгкий водосток,\nНа лугу и не в загоне,\nКак красив весной росток!\n\nНа лугу пасутся кони:\nДнём как пламенный янтарь,\nПо утру они в загоне,\nВечерами как фонарь."},{"date":"09.09.2020","title":"Жук","titled":true,"body":"Ветер в щели задувает,\nА жучок по ветке полз,\nЖизнь без страха не бывает,\nА жучок тот так и полз;\n\nЛает страшная собака,\nА жучок всё тот ползёт,\nШпаги протыкали Жака,\nЖук как будто бы грызёт;\n\nБаба Миша засыпает,\nКорчится от страха жук,\nПеред тем, как спать пойти,\nОна сыпет средство от жуков."},{"date":"13.09.2020","title":"***","titled":true,"body":"Как мурлыканье некошек \nя могу услышать?"},{"date":"21.09.2020","title":"Волшебник","titled":true,"body":"Туфли из ромашек,\nЛазеры из глаз,\nЗайцы первоклашек,\nРозовый колпак,\n\nСолнечные ветки,\nРазная труха,\nМячик и ракетки,\nЧудо-облака,\n\nГазовая дымка,\nЧёрные слова,\nНа лице улыбка,\nНа плече сова,\n\nМимо дымоходов,\nМимо мягких стен,\nДерево заводов,\nБиржевых систем,\n\nПятки и ракеты,\nГромкие слова,\nЧудеса, секреты,\nРтути полоса,\n\nЛампочка затухла,\nПорвались носки,\nГде-то возле уха\nЗыбкие пески.\n\nЭхо гарнизонов,\nБелый флаг любви,\nГадости бозонов,\n\nПотолок в слюне."},{"date":"02.10.2020","title":"***","titled":true,"body":"Гнёзда навозные,\nРуки бесхозные,\nСознаны, загнаны,\n\nДоски полезные,\nБелки любезные,\nРазного рода дарма,\n\nЖаль за нехваток,\nМамаша без схваток,\nЯблочный нежный бисквит,\n\nЭтики, метики,\nФантики, бантики,\nВеки тяжёлые, ух!\n\nГалочки - петельки,\nНоженьки в саженьке:\nДерево дальше растёт."},{"date":"14.10.2020","title":"Осень","titled":true,"body":"Я видел квадраты над тисовым полем\nИ видел подсолнух на газовой трубке,\nЯ видел Шри-Ланку на улице Мира,\nБессонница кисла в фарфоровой ступке.\n\nХороший подарок - дешёвая куртка,\nУлитка ползёт наугад, но вперёд,\nА честное слово, как пепел окурков,\nСгорело дотла, но уже не умрёт.\n\nГондолы с отелями гадили ласты,\nБодрее желанный потоками веет,\nЗамученный жаждою порванный пластырь,\nЗатылок побритый идеями зреет.\n\nЗастывшие ливни лежат в полудрёме,\nПосуда немытая, вскользь, через пальцы,\nНа вéках остались следы глаукомы,\nЦветы распускаются, бегают зайцы.\n\nИ вообще всё спокойно так..."},{"date":"07.12.2020","title":"Новый год","titled":true,"body":"Слон сбежал из зоопарка, \nВ Палестине грянул гром, \nТонет в чашечке заварка, \nСтарых книг пылиться том, \n \nНос застынет, станет белым, \nЗаскучает Дед Мороз, \n \nПо посёлкам, переулкам \nЗадохнётся паровоз, \n \nПопугаи на качелях \nКурят в новый новый год, \nОбезьяны приключений \nЖдут безоблачных погод, \n \nКилограммовое небо, \nПахнет кариесом жук - \nЭто запаха победы \nКочерги сибирской стук! \n \nКартография дымиться, \nЗаскучает Дед Мороз; \nВсё из тени в свет стремится; \nПлюнет Бог слюнных желёз."},{"date":"07.12.2020","title":"С днём рожденья","titled":true,"body":"Минимальность загибалась, \nИзвивался Сулейман, \n \nТретьей третью, перекатью, \nЗастепною супрематью, \nСупермать обложит катет, \nКатит антиквара гать. \n \nШирпотребное юленье, \nОтфильтрованный тюлень, \nНа кассете с днём рожденья, \nРук, прекрасных тел олень. \n \nЖивописные помои, \nКраны разрезали путь, \nПо утру и в рукомое \nНашли истинности суть. \n \nЗеркала казались мёдом, \nПауки сошли с ума, \nКараванные походы, \nЭхо сознанного сна. \n \nДыроколовые дыры, \nПальцы! Аккуратней будь! \nХаотичные позывы \nЗабавляют. Так, забудь...."},{"date":"08.12.2020","title":"Разведение костров в непредназначенных для этого местах","titled":true,"body":"Растоптано вполголоса \nНевиданной невинностью\nРаспаханная молодость, \nРастрёпанная изморось, \n \nКалиновая хвоя, \nПокачиваясь веточкой, \nТак сложно жить порою, \nЗакрашивая клеточки, \n \nКак родинки на пальчиках, \nКак радужка из зеркала,\nЗачаток мысли датчика\nРеальность исковеркала. \n \nДинамика конверсии\nСплясала танец с бубнами, \nА кот, по нашей версии, \nСкичурился под тумбами. \n \nИ след давно ослеп, простыл,\nИ простынь также запылилась; \nПоследних слов простой посыл: \nНемая девочка влюбилась."},{"date":"24.12.2020","title":"Железная в воздухе","titled":true,"body":"По красивым коловратам,\nИзощрённым колоритам,\nИзвращённые молитвы\nНаблюдением высот. \n\nПо среде распространённой,\nПо пути на юг от нас.\nБезусловных покиданий,\nПолимерных твёрдых масс, \n\nМеталлических листов,\nНапряжений, полюсов,\nКружевных цветных трусов,\nЗаглядений спящих сов, \n\nПробуждённых реактивно,\nНарисованных картинно,\nВездесуще-по-деревьям,\nКардинально-паутинно. \n\nПерекрёсток выше края,\nТам корёжится от солнца\nЦербер-гончая-святая,\nИз-под лап огонь без донца, \n\nА под гривою струится\nПеревёрнутая сущность,\nИ огня того боится,\nИ стремится вызвать тучность; \n\nГалка пёстрая без клюва\nБородою режет сталь,\nДолгожданного полюбит,\nИ отпустит: в даль, всё в даль."},{"date":"24.12.2020","title":"Звериное","titled":true,"body":"Проснуться от испуга,\nПолуночная вьюга,\n(Фарфоровой посудой) \n\nВойной на полюса,\nНавстречу полоса, \n\nПо вечной мерзлоте,\nСпокойны, но не те,\nГорящих в темноте, \n\nПодслушанных случайно,\nЗабытых и отчаянно, \n\nПобитых о бетон,\nНепойманных в притон, \n\nКосмических туристов,\nПритворных акультистов, \n\nЗалаянных до ужаса,\nЗапуганных замужеством,\n\nЧернично-абрикосовых,\nМалиново-кокосовых \n\nЗайчонков, обезьян!"},{"date":"06.02.2021","title":"***","titled":true,"body":"Забыты все следы исходов,\nБорьбы за честь предрешены,\nЗвучит как песня гимн народов\nПод карнавалы тишины."},{"date":"18.02.2021","title":"***","titled":true,"body":"Вы станете бабушкой или дедушкой"},{"date":"12.03.2021","title":"***","titled":true,"body":"Одна маленькая рыбка\nУтонула-захлебнулась"},{"date":"08.04.2021","title":"Незабываемо","titled":true,"body":"Забыть такое невозможно \nШары над полем Пифагора\nШтаны из ткани единиц \nЗабавные червя нагромождения \nПогода сделала ликбез \nА наш любимый Дядя Таня \nПодпрыгнул вышела небес \nНа завтрак тофу и огурчик \nНемое судорожно съело\nИ проблевалось огурцом \nПотом запущенная старость\nПережевала и сглотнула \nИ со слюной и без слюны\nА гладиолус на могилке\nПодкинул общей суеты \nЗашевелились пальцы-пяльцы,\nЗаёрзали тихонько глазки \nДа неужели в них капуста\nТак скажет вам любой прохожий \nА свет оранжевую лампу\nПодтает плавит и стонает\nХагакристос язычески шагает\nЖан Пьер дерилий скажет тост \nЗаявка зябкая трезвонит \nДешёвый выпил я невкусный\nЗашевелились в брюках цацки \nЗалаяли заежевились \nЗаёжились косички да.\nКогда уже они настанут \nЗелёные от копыти своей \nКогда немного будет слышен \nСовсем чутка забавный вкрик\nПодкри́к и за́крик подтобойный\nСлегка чуть-чуть дурацкий стон\nА также крик и плач и смех\nКогда уже он будет виден?...\nВживую...?\nЧто такое со́смех\nЗабавные картиночки собачек\nИ что такое в принципе колядка \nКралья покрученные тазом \nКуличики запаваротом гамма та\nКарал подводный обиходный\nБа Ба Ба ран\nЖевачечка для девочки буржуйки\nДружуй, \nПоешь говна, порастеряшка"},{"date":"05.05.2021","title":"Анекдот о варёном яйце","titled":true,"body":"Шёл дождь, видит - мужик стоит, он остановился, принюхался, а это и не мужик-то вовсе - куколка тряпичная!"},{"date":"07.05.2021","title":"***","titled":true,"body":"Гипнотические речи \nПокрывали одеяло,\nКристаллические плечи -\nСолнце в глазки мне сияло.\n\nПо малиновой тропинке\nСинеглазый пёстрый лучик,\nНарисованной картинке \nИз-под взвеси мрачных тучек\n\nОпоздавший скорый поезд\nПровалился в тишине\nУтопающих по пояс,\nПропадающих во сне.\n\nЗа тревогами пустоты,\nЗа окном нет ничего,\nНенаглядности высоты\nЗакричали. Вы чего?"},{"date":"26.06.2021","title":"***","titled":true,"body":"Замертвелые игрушки \nНа кровать глядят упрямо -\nИз-под мягенькой подушки \nРазрасталось одеяло;\n\nЗамахали черенками \nЧерви, прочие ночные,\nПодземельные, руками\nИсковыривали выю,\n\nЗаплодилось пузо розы,\nЗаиграло на углях,\nТо ли жара капля, доза,\nТо ли ветер в полошмях\n\nНаклонил чужие ветки,\nНапоил святую мать,\nРазложил в углы монетки\nИ зарылся в нефть, в кровать.\n\nТам заёрзали немного,\nА потом захолодел,\nОнемели лица, ноги,\nНу и вся структурность тел \n\nОтходила в междустрочье,\nМеждуречное, лебёдкой,\nГальванических увечий\nИли наказаний плёткой,\n\nПодрельефностно из τоμος - \nИз наружи (в) outside.\nОдин жалкий гладиолус\nРазбудил мой спящий sight."},{"date":"05.07.2021","title":"***","titled":true,"body":"Оживая на треть забытым,\nПробуждаясь туда открытым,\nНаблюдаю за горсткой света\nОбжигающих рук где-то:\n\nОчень сильно горячо:-\n(В)зачаточном лоне, стоне,\nДвери, знаке, развилке\nПопутчиничество.\n\nЗаключая зачем-то,\nРаздвигая монументы,\nПриближая на минуту,\nЭтот невыносимый, неминуемый.\n\nБадьяна ветошь снова зацвела -\nЯркой снова черёмуха расцвела.\nЗапрещают сажать огород на коленях \nУ краснокнижных тюленей:(\n\nСуки. :)\n\nРопщещут как над водой\nРа3пространялася палеозой,\nНа дне под ржей монетки\nПляшут конфетки-марионетки,\n\nЯ их ножичком подковырну,\nИх и сразу в чёрную дыру,\nСразу ноги стали расти!\nКуда же их девать и как мне их спасти?"},{"date":"19.07.2021","title":"Похуй!","titled":true,"body":"Похуй грянут зябки рано,\nПротрясутся над водой \nИ летит на свет упрямо \nПод железную любой. \n\nЗагорятся наутёки,\nЗагудят их бледный цвет,\nСтуки-стукают намёки,\nГеморроя, пальцев нет! \n\nИззаканчивались руки\nИ под веками песок,\nНесусветнейшие муки\nЗагибались из-под ног, \n\nЗагубные пятитрубы,\nПоловинки чёрной бля,\nШеепопочные бубы,\nНу а в сердце тополя. \n\nНе дано с заглавной буквы -  \nПритворись большим ведром:\nИ противный запах брюквы,\nИ любимый наш гондон."},{"date":"20.07.2021","title":"Адрес доставки: город Москва улица просторная дом 43 квартира 78","titled":true,"body":"Деревянные останки\nКатят кругом коловрат,\nВсевозможные остатки,\nВетер в поле громковат. \n\nМноговаттные трейнспоты\nЗаключённых в банке мёда\nИ рукою в речке ноты\nВырываются из брода. \n\nЗабродили черепами,\nЧерепахи дали свет,\nГастроскопные спирали\nИ в наушниках завет. \n\nЗастарался, поиссохся,\nШорох жýка дал error -\nНаступил случайно, сука,\nНа моральныя террор, \n\nОн всю мебель заклинает -\nОжила и стала жрать!\n-Кто такие?\n-Бог их знает!\nВсё, не стали убивать."},{"date":"22.07.2021","title":"Кому чё - кому ничё,","titled":false,"body":"Кому чё - кому ничё,\nКому хуй через плечо,\nКому сахар, кому пыль,\nКому звёзды, кому быль,\nКому крылья, кому порох,\nКому деньги, кому твòрог."},{"date":"02.08.2021","title":"\"Замечательно\", - сказал командир корабля \"Жопа на восток\". \"Нам пизда\", - подумал я про себя и лёгким движением руки скинул на пол свою треугольную шляпу. Прорастила она свои корни в шхуну, аки межмирное древо распустилось во фрактальности бытий, распустилось цветом всем абсолютно, но завидуя мне тем, что не может ни барабанить, ни в компик поиграть там чего или же на уроке географии выкрикнуть \"хуй\". Но мне его всё равно жалко, но жалость та не жалобливая, а, скорее, продуманная до гвоздей, заделанная и залатанная в дырокольные вещие сны примагниченным спадом стада в 8:35, завывающим о жисти и тварях, благороженных богородицей и выебанных, как тряпичная кукла, выброшенная на мороз русский бля -45°С. \"Конечно, ужас несчастный\", - подумал я. \"Свхисхтать всхех на вхерх\", - закричал капитан Смоллетт. \"Нам пизда\", - подумал я.","titled":false,"body":"\"Замечательно\", - сказал командир корабля \"Жопа на восток\". \"Нам пизда\", - подумал я про себя и лёгким движением руки скинул на пол свою треугол
