ьную шляпу. Прорастила она свои корни в шхуну, аки межмирное древо распустилось во фрактальности бытий, распустилось цветом всем абсолютно, но завидуя мне тем, что не может ни барабанить, ни в компик поиграть там чего или же на уроке географии выкрикнуть \"хуй\". Но мне его всё равно жалко, но жалость та не жалобливая, а, скорее, продуманная до гвоздей, заделанная и залатанная в дырокольные вещие сны примагниченным спадом стада в 8:35, завывающим о жисти и тварях, благороженных богородицей и выебанных, как тряпичная кукла, выброшенная на мороз русский бля -45°С. \"Конечно, ужас несчастный\", - подумал я. \"Свхисхтать всхех на вхерх\", - закричал капитан Смоллетт. \"Нам пизда\", - подумал я. \nНа следующий день нахожу себя в Женеве с бутылочкой собственной мочи. Мне её приказали заполнить доверьху, заколоть пару свиней и бросить(ся) в канаву. Но я не живодёр или суицидник, поэтому пошли они нахуй или ещё дальше, а там на часах я увидел сдохшую сохшую кошь, а также время: 5:27. Ну хоть три минуты поспать бы ещё дали-додали бы мне хлеба, я не могу вырваться из этого тела, оторвите его как отрывает тело муха от липкой бумаги, запишите на нём чернилами под кожу страшные анекдоты и проколите дыры в ладонях и ступнях, нарежьте как ёжика вы нарезали твари, я вам всем ещё спою, а вашу хуйню заберите с собой. \nЯ тебя очень сильно люблю"},{"date":"03.08.2021","title":"Возвращаясь с остановки","titled":false,"body":"Возвращаясь с остановки\nНа меня глядит в окно\nИз-за шторы красны бровки \nИ в руках веретено \n\nЗапихнула в чайник дядьку\nЗадохнулась\n.\n.\n.\nКак на розовую миску\nНабирается защёлок \nНабирается щепоток\nА также щепочек \nПалочек\nБаночек \nЖёрдочек \nБомбочек \nЦельнометаллических пуль 45 калибра \nШрапнелей болванок ядерных бомб\nШерстяного одеяла \nМягкого стука из-под земли \nТвёрдых шагов младенца\nПросто поцелуев \nЗаёрзанные руки, поднимающие ноги\nВеки опущенные, понимающие мысли\nПроходящие вдоль невинности невиданности \nЖан \nЗвук\nТопот \nРопот \nПот \nМатери руки\nГадины, суки,\nВечности пуки \nИ просто какашки \nРазные Машки и кошки и Дашки \nИ даже зелёная мышь \n\nА я нарисовал недавно красивую плюнул волосы положил \nА меня по ним и восстановят в будущем\nДа в будущем и не такие технологии \nПрогресс как никак \nИ ёбанного постмодернизма там не будет\nИ ваще будет чики пуки \nПяки бяки\nЖмяки стуки\nУх сука много как-то вышло"},{"date":"07.08.2021","title":"Космос","titled":true,"body":"Ушёл в неизвестном направлении \nИз избытка -\nИзбушка стоит \nВошёл\nТам наблёвано кошкой\nПринюхался \nМеня слимонило, скорчило, скрючило\nУпал на деревянный пол из прогнивших дощечек \nНеужели я вот так умру?\nНет, я должен жить, должен\nЗадыхаюсь уже \nНе вздохнуть \nВсё немеет \nНе могу пошевелиться \nРезкий пробирающий пространственный единственный самый живой числовой-форменный-идейный вдох \nЯ живой \n\nПопил водички\nВстал рано утром \nОказалось нет хвоста \nА я точно помню что был\nЗнаковые переплёты бьющих фонтаном и морду радиоактивные суки \nМы вас любим\nИ ваще слушай сюда\nПуля тебя покинет \nКожа отойдёт \nТы не спрячешься \nБудешь валяться как я на прогнивших дощечках \nГей ты, Русь, матушка,\nПроебали мы тебя \nНо среди и повсюду лéса\nЯ единственно хожу\nНет, не просрали\nОбрели мир,\nЗацепили и полетели в κόσμος!"},{"date":"09.08.2021","title":"Записка","titled":true,"body":"В общем смысле драматургии шаболд затупляется лента тиранической палеозойности мокрой кожи, прободающей за всеверхих и посю∃, загибающих осознанное неосознанное гальванически бросил на помоечку, единица рвётся, у неё из живота прорывается ещё одна она, замагничивая границы грамматики цифр и блудя в зависимости от ситуации, проевшей новое образование, образуя это само образование, которое в нашей стране и в мире уже катится в жопу, я на месте. Круто ты загибаешь пальчики \nА я на учёте стою \nСука сядь \nОткрываю дневник там по красному пишут бля расчехляю ножик 🔪 и сразу в путь-дорожку, проарматуренные гниды свисают; курят окурки, выдавливая из носа слизь времени, опоясывающего по пояс нас, заползая по спине и щекотя манящим прямоугольником с выходом в ничто, разово пугающим при встрече, но совсем бессмысленным, для кого-то родным, но не оставляет он(и) следов, как этот кот(,) на бумаге - просто слизняк, выскользнул, но остался жив-здоров, упал на веточку, зацепился, встал, ошалел, убежал, зализывал ранки, стал бродячим, завёл семью, детей, потом работа, дом, вот уже старость, а я что. Не так всё было \nНу упал он с окна а шо тут ещё та?!\nНу вскочил, ну убежал, ну жёпку свою порвал, ну зализывал, но домой всё-таки пришёл и гладила его дальше наша с тобой жёнушка, наша хорошая, любящая и любимая, ковыляли и ковыряли мы, любили мы, а вы любили? Мы вот да."},{"date":"10.08.2021","title":"9.2","titled":true,"body":"В окончании массивов,\nГоризонтов наклонений,\nПерекошенных красиво,\nВсех цветочных точек зрений, \n\nВ заповедной и заветной,\nЗаедая всухомятку,\nЗатесался безответный:\nПосмотреть бы на девятку: \n\nТам с закрытым ртом и дверью,\nЗа калиткой огурцов,\nРовный след чужого зверя\nИ кривая жесть концов. \n\nЗаворочились тихонько - \nЭто пальцы в молоке,\nЗубы стукают легонько ‐\nЗвёзды плачут на руке."},{"date":"10.08.2021","title":"9.1","titled":true,"body":"В окончании массивов,\nГоризонтов наклонений,\nПерекошенных красиво,\nВсех цветочных точек зрений, \n\nВ заповедной и заветной,\nЗаедая всухомятку,\nЗатесался безответный:\nПосмотреть бы на девятку: \n\nТам с закрытым ртом и дверью,\nЗа калиткой огурцов,\nРовный след чужого зверя\nИ кривая жесть концов. \n\nЗаворочились тихонько - \nЭто пальцы в молоке,\nЗубы стукают легонько ‐\nЗвёзды какают в руке."},{"date":"13.08.2021","title":"Ижица пыжится","titled":false,"body":"Ижица пыжится\nРобкою саженцой -\nКладбище, полное бля,\nГрадус основан -\nЗримый фонарик -\nНаши движения рук. \n\nСнов ускользающе,\nГорло пронзающе,\nВеткой обломано,\nСловом заковано -\nЖидкий кишечник любви;\nГлазки заплёваны;\nРучкой записаны\nВещие вёсны и сны."},{"date":"15.08.2021","title":"Голод","titled":true,"body":"Как ебанёт так сразу в пяньку,\nА вялька жопила козу,\nЖурчало растопило баньку,\nЗараза съела стрекозу,\nСемёрка наша пролилася,\nКапуста наша испеклася,\nЗабулочные щёчки чмок 💋 \nИ гастро-дуодено-хрыч 🤠\nЗабился кирпичом малышЬ,\nЗаползла зáворотник мышь,\nЗалаяла собака тяф,\nЗапутались в словах\nИх сбросили в кучу:\nИ слово пох и нах👺:\nТак собиралась туча☁️:\nЗамуча брызгами своими\nЯ открываю окно:\nЗа окном окно:\nЗа окном я вижу:\nТемно (тебя забрали под кровать *они*)\nЗабавно.\nКолит бля в левом, да и в правом😵 \nКакие надо там пить травы?\nФалафель выйдет вкусный😋:\nДело тут в приправе:\nУмами ýмы умножали усыпали у, суки,\nЗахлопотали брюки;\nРыгатиной блевать 🤮 —\nСебя не уважать.\nЗдарова мать!\nПоляну, млять!\nМне быстро накрывай!\nАй.. ну прости, мамочка, я тебя люблю, не обижайся - я шучу, и это такая форма искусства."},{"date":"16.08.2021","title":"Читай это внимательно","titled":true,"body":"Где-то жил один мужик со своею женой, они гадали на картах и по не смывшемуся с первого раза говна в унитазе.\nИх вечер проходил занятно, вдруг ниоткуда выскочил зайчик и это всё иллюзия, заяц понимал сам, что неинтересен и придуман, интересно тут другое: мужик встал и сказал: \"А я вот реален, ты, чмоня!\". Сам ты чмоня! и ваще, не ообзывайся, я могу тебя просто стереть. \"Но я живой\" - Заливай кому-нибудь другому, я и так добрый. \"Да правда, я злюсь, что не могу тебя потрогать, погладить, позлиться, только по-настоящему, не текстом\" - ёп твоё шиза да? Не, это метамодерн, детки. Вот встанет он, оживёт, и что вы скажете то? Только максимум яблочко на могилку положите - ну вас, даже мусорите много, не глупые же, да и всё наше, а на нашем и строится и разрушается, делайте только, прошу.\n.\n.\n2 дня спустя:\n-Ваш кондиционер налажен.\n-Спасибо, красавчик😘!\n-Эй, я не из этих, я трапик, но люблю девушек, извини. \n-Ну бля а есть тут ваще пидоры или нету? Ставь лайк, посмотрим, сколько нас!"},{"date":"18.08.2021","title":"Научитесь","titled":true,"body":"Научитесь плавать, \nЛетать научитесь, \nНаучитесь звёзды собирать \nИ падать научитесь!"},{"date":"18.08.2021","title":"Кто тут главный?","titled":true,"body":"Только с одной грудью наперевес\nДа глядькины бляки зажать\nЗатронуть чурвивую задницей лес\nОтныне и гадить \nГладить тебя кошку мою пердя\nЖри картошку\nПинай забубя \nДома стоят водя и дя через речку идя\nЧуркой чур дальше не нужно себя называть \nЗамедленного падения и поднятия болт дня\nЗарвался подорвался, на нас глядя \nПойдя на вечернюю, я, капризничать сильненько стал \nСтал я как два разных чернильника слаб и глух\nА потом вдруг откуда ни возьмись \nЗаплясаля ну и я запляс \nИ вот уже я котёнка спас\nА зовут нас Иван Гамаз \nЧервяк Глонасс и жопа класс\nЯ жуткий газ \nТебя пережёв, а ты и не заметил\nПокеда, дятел"},{"date":"31.08.2021","title":"34й","titled":true,"body":"Заведи на меня и молчи:\nНе кричи, а за пазухой снежек\nНе молчи, наши слились глаза \n\nВыглянул, вытянул - игольчато\nВышел - снова повсюду\nЗа поворотом опять она \nЯ не удивляться стал \nНа решётке сидит амбал \nЯ к нему подошёл \nЧто как ты там, оборвал?\nОб ребят свою тяпку помял \nЯ не понял и швё поменял\nМеня наебали и жили\nА я без этих ваших документов не могу \nМеня даже на работу не берут \nА денежку надо очень сильно \nКушать хочу \nМоя доченька тоже хочет, но без документов ваших не могу, \nЗделайте пажалуста дакумента\nЯ вас атсасу \nВас вашему отцу \nСука так плачет тот, который документы просит просто пиздец \nНа, бери свои документы \nСпасибо но теперь \n. Заебало хватит хуйню писать"},{"date":"01.09.2021","title":"Глазки","titled":true,"body":"В сети заблудилась истома Туретта,\nЗа жёрдочкой спрятался жук,\nВо рту у лягушки ляжит сигарета,\nВ ушанке заблудия рук, \n\nНа небе горит чорной точкой завета,\nЗа ветками яблоки жрёт,\nИ ходит, и бродит - кусает он мета \nИ гадкою гадиной мрёт. \n\nОна опустилась к траве незаметно,\nЗаплавали глазки в водичке червя -\nВерёвка обтянута мятой планетой\nИзвывернул торус, трусы теребя. \n\nЗалазили пяльки и гальки вокзалов,\nЗаёжился ёжик в прозрачной стене -\nИ столько минуемых лиц показала\nЭрóсная жижа, брыкаясь во сне."},{"date":"03.09.2021","title":"***","titled":true,"body":"Явление птицы на небе морском - \nЛетит Богородица, вертит хвостом,\nЗа нею бежит безоглядно\nИ тащится вспять белый жив,\nЗа камнем на небе он прячется,\nМясистых явлений он кичится.\n\nВсё так, как обычно -\nВсё заново, твари.\nНу хватит - затычкой \nОн всё прекратил,\nИ умер Гваттари,\nРизома с ним вместе умирала,\nНожичком подковырнул ты её,\nНегодяй - кто-то скажет,\nЯ же скажу - так и надо,\nТолько возьми мою руку и поцелуй её,\nЯ тебя в лоб поцелую, живую, \n\nСоприкоснётся касание.. ..\nВспомнилось знание \n\nО том, как я листиком жёлтым,\nКрасной дорожкой\nСебя опроверг.\nВышли в меня после этого\nГнев и структура, \nВсе гадины, дуры,\nА также кристаллический оттенок прободаемого,\nЖадного, вечного, включаемого,\nЕго пока не надо трогать,\nА лишь наблюдать."},{"date":"07.09.2021","title":"***","titled":true,"body":"Чёрный силуэт\nИ вот он исчезает"},{"date":"15.09.2021","title":"Постфиксация - наш девиз","titled":false,"body":"Постфиксация - наш девиз"},{"date":"20.09.2021","title":"Как - подснежник из кóсти","titled":false,"body":"Как - подснежник из кóсти \nИз-под зуба разрастался \nСкоро не станет прости \nНа...на.....на веточке \nКлёв большой, рожа святая \nБОГО МАТЕРИ\nЧЁРТА ОТЦА\nМоих любимых \n\nКит восстал из рая и встал \nна четвереньки \nон стал каря моря \n\nА я сегодня \nнашёл монетку \nна обратной стороне \nмоей задней сучности \nзаезженной заеды червя\nзаписался куда-то там\nсвою руку по ставил\nвспять мою пятерню \nмоей же квази"},{"date":"27.09.2021","title":"27.09.0000","titled":true,"body":"Наказание смягчилось -\nРассыпался пепел в прах -\nНичего не получилось -\nКрасный лист на сапогах,\n\nЗакончалось давье криком\nИз-под шортов прогляди\nТихо-язвенное трипом\nНа кусточке впереди\n\nПо кусочкам сочной гальки,\nЧто меж пальчиков ступней,\nРасцвелася в белой майке\nИ завяла снова с ней\n\nСкоромайская кобыла\nПоплыла и наш отец\nТоже было с нею плыла:\nСнова радостный конец."},{"date":"03.10.2021","title":"Листья зелёные вкруг уходили","titled":false,"body":"Листья зелёные вкруг уходили\nЯ их глядел - между ними его глаз\nУлыбается, да плывёт далеко \nЯ его бородой лазаю в окурке \nА он даже не тычет в лицо мне \n\nВереницы мухоморов \nИ сдохших издохших мух\nВ два ряда \n\nИстомно бродить по лесу \nИ кричать - звать на помощь \nХоть и не страшно \n\nГде-то грациозно плавает лебедь(свн)\nДа, винни из меня так себе\nОни не в ту степь-сторону-гляделки играли\nКомья чего-то там и снег не за горами\n\nТолько я не выхожу у двери ночью шум, утром нет\nУтром, на следующее утро начнётся я действительно этого хочу\nЛитургич. сон а его закапывают и не литургический а вполне обычный сон просто решили пошутить или как это называется, я бы от такого немного обделался, но пока мои штаны на месте, а жопа чиста как белый пряник на пасху и куличавое кончалово, я так и буду вам впираться в моз(ь)г-И"},{"date":"08.10.2021","title":"Звёздочка мельтешит","titled":false,"body":"Звёздочка мельтешит \nНа меня смотрит \nМать лупит \n\nВсё вокруг становится живым\nОт торжества мысли \nОт тождества рождественных дождей \n\nОт грязных немытых с утра рук\nОт разных стран, форм и идей\nИдёт ко мне расползается расплывается \nРадуется корчится смеётся, тужится, рыгает, рыдает что с неба вода льётся ±одинаково, что завтра будет, что никогда не будет ничего:\n\nЯ лицом повернулся, расступился варежкой-клеткой-точкой-тире, кожу свою, а моя такая, а наша она ещё полнее, она ого-го, я вам говорю обязательно надо пеленать, каво- не важно, важно чтобы стоять на своём и сидеть на на.... \n\nГвозди стенку избивали\nМоль прикинулась живой\nЯ от тех, кто ртом зевали \nПонял: страшно жить зимой\n\nСтрах, который раньше умер\nТот, которой чёрный негр\nТот, который свиристелью\nЗастилает мне постель \n\nТот, кто любит так трудиться\nОбожает цифру семь\nЗамыкается как ситце,\nВорожащий мира тень \n\nПроникающий под цедру\nПод пружинки в голове\nЗамыкающий всех птичек\n\nВдруг за стенкой перемычек \nКосоглазое живое \nНаслаждалось быть любимым\n\nТак и было за ветрами \nСтолько заскорузлых рук\nСтолько пальчиков красивых \nСтолько сдохших в липкой мух\n\nОт дождей, пропавших с ним\nМуравьёв и разных сказок\nЛедяных и кислых мин\nТак стоически знакомых\nЗабываемых говнин\nНагнетающих и плавишь\nЖидким сердцем об асфальт\nДва смеющихся квадрата\nПревращают в гной базальт \nПревращают жопу в арфу\n\nЗанимательные с хреном\nЗагубящие без хрена\nИ внимательные телом\nОбнаружат артефакт \n\nКак бы ёжиком едины \nОтпускающих беги\nТриста раз непобедимы \nРовно триста тридцать три\n\nДвадцать восемь и без точки\nТо бишь int в родном числе\nЗацветающих цветочком \nЯ построил дом во сне"},{"date":"12.10.2021","title":"теперь уже старая, когда просыпаешься одним чудесным днём и осознаёшь что твои вакуоли не такие эластичные и упругие а скорее полувялые но вода засохла а ея пустоты клеям намазали связующее звено цепи за кристаллом потолка за скатертью крупных грязевых частиц под ногтями матери роженицы где на том самом месте вросло дерево в подкожные иглы почвенных квасцов, в два ряда, ароматизируя гнойперегной пальчиков мальчиков, зёрнышек съеденных, по баобабам бабки сидят и сталью, стальным прутком искоса на поперёк всего сущего тёмного, против света стали её опального крика замурованности решётки даже клетки, из которой один выход -> жидкая плазма которая разорвёт мои представления, окажет ущерб нашествию, распустит гражданский состав и накажет, даже того, кто виноват, ребёнка в угол поставит, даст просраться журавлям. Поздно, щекотя потными ладошками шелест травы, тёк ручей, а также всё так же падали листья","titled":false,"body":"теперь уже старая, когда просыпаешься одним чудесным днём и осознаёшь что твои вакуоли не такие эластичные и упругие а скорее полувялые но вода засохла а ея пустоты клеям намазали связующее звено цепи за кристаллом потолка за скатертью крупных грязевых частиц под ногтями матери роженицы где на том самом месте вросло дерево в подкожные иглы почвенных квасцов, в два ряда, ароматизируя гнойперегной пальчиков мальчиков, зёрнышек съеденных, по баобабам бабки сидят и сталью, стальным прутком искоса на поперёк всего сущего тёмного, против света стали её опального крика замурованности решётки даже клетки, из которой один выход -> жидкая плазма которая разорвёт мои представления, окажет ущерб нашествию, распустит гражданский состав и накажет, даже того, кто виноват, ребёнка в угол поставит, даст просраться журавлям. Поздно, щекотя потными ладошками шелест травы, тёк ручей, а также всё так же падали листья"},{"date":"29.10.2021","title":"ты так ждёшь монастырёв","titled":false,"body":"ты так ждёшь монастырёв\nпятитысячелистник \nсолнце встало куполом"},{"date":"10.11.2021","title":"Ск.","titled":true,"body":"Седеет скатерть на реснице,\nПод деревяшкой дохлый жук,\nПожухли вялые в теплице -\nУже давно красивый стух, \n\nЗаглохли вёдра, кто-то знает\nО перезрелых красных глаз\nВспотело в зеркало влезает\nИ замерзает как алмаз, \n\nХиреет хобот мрачной птицы,\nА ветки жисти как штыри.\nЗарыться б в землю, залипиться,\nЗабыть о всём и пузыри... \n\nДелёз заплакал от (моих) стихов\nИ нервно в будке ковыряет,\nЗащёлкнулся металл висков\nЖивотный глупый и не знает \n\nО том, что в вёдрах сердце зреет -\nИз них растёт кустом рябины\nБураны перед богом млеют\nИ веют воздух, но без силы, \n\nИз полудрёма каплей вспышки\nОкутал розовую ногу,\nА в потолке бежали мышки,\nА я подумал, что там воды \n\nК концу ^люблю^ не умирает,\nИ от коллизии сухой,\nПод телогрейку затекает\nЗасохший шёпот и покой."},{"date":"11.11.2021","title":"Кого ещё интересует:","titled":true,"body":"Залеплен стягом рваных дыр\nБардовых веток книжных вод\nЖуя из чернозёма сыр\nНа шорох ветки - хоровод \n\nЗапáх кессонную сардельку \nИ сильный творческий шакал\nЗвенящий дым из глазок мельком\nЕюнодуоденосвищ \n\nКрасивой галькой солнце жрёт\nИ пальчик с кровью на бумажке\nЭкранный бледною скуёт \nИз саркофага в промокашке \n\nПрипой задержанности крыл.\nЖиви, любимая Француза,\nХарчовий дом, звенящий дым,\nОкурок предрассвета."},{"date":"11.11.2021","title":"***","titled":true,"body":"То ли глина расписная \nТо ли дом сгорел дотла \nТо ли буква прописная\nЗакричит петух сутра \n\nНа чермённую черно\nУбаюкивая грозы\nЖенстви старое окно\nПодоконники под розы \n\nКто утих в слепом ведре \nКто напахивался чернью\nЗаскулит в святом ядре \nКожа матом по поверью \n\nЗонд корёжит кривость дыр\nЗаискала ручка \"пусто\"\nКто-то прячет в сумке мир\nКто-то кислую капусту"},{"date":"14.11.2021","title":"***","titled":true,"body":"Когда я умер,\nНе было никого,\nКто бы это опроверг,\nНо когда я воскрес,\nВсе усомнились."},{"date":"29.11.2021","title":"***","titled":true,"body":"Я пришла к тебе на встречу,\nПринесла цветы и зонт,\nБог взвалил на твои плечи \nШеи целый горизонт, \n\nПод ногтями город зреет \nКерамических причуд,\nПод подошвой землю греет \nКрови тёплой от простуд, \n\nИз пупка по старой схеме\nИзрастался белый мех,\nЗакрывая путь системе\nСамых справедливо- всех \n\nНо потом в глазах сверкало -\nСтало быть, предрешено:\nКто само собою стало, \nКто ест мясо, кто пшено."},{"date":"30.11.2021","title":"Заметки после неврологии","titled":true,"body":"Выбиты окошки \nВсё вокруг чёрным черно"},{"date":"16.12.2021","title":"Ось","titled":true,"body":"Заслоняя тень луною \nОт орбиты зимних тел,\nЕдинения с тобою\nОчень долго я хотел. \n\nЧетвергуя пол седьмого\nНа коленях видно вдаль,\nЖуравлиную волною\nИ магический миндаль, \n\nГрациозно шла кобылка,\nУ коровки бегал хвост,\nК вам приехала посылка -\nНовогодний, значит, тост: \n\nТы, забрызгивая тканью,\nНаизнанку убегай\nОт детей, от их незнанья,\nПоздно в мой любимый май. \n\nЧерных семечек душистых\nПод гербарием фанер,\nЗаклинаний мех пушистый\nБлагороднейших манер, \n\nСколько длин и расстояний,\nСколько вскользь забытых слов,\nПодплатьёв солнцестояний\nИ обычных самых снов."},{"date":"01.01.2022","title":"Подвывих ручья обнимает","titled":false,"body":"Подвывих ручья обнимает \nГреет изнутри керосин \nПринимает изнутри из себя \nСнимает и переписывает на vhs кассету \nМоею окантовки телесной красной полупустой \nА заполняют demi-пустоты пена на корабле \nПаутины, коксовая печь и дратва \nОт оленя \nВ наследство \nИ так и сочится \nМалиновое на вкус, немного горчит,\nМоё любимое \n\nА через время и будет а оно и так ∃"},{"date":"28.01.2022","title":"Зреят в поле кипятки","titled":false,"body":"Зреят в поле кипятки \nМальчики с усами \nИх пятнющие портки \nМайками, трусами \n\nВсе на вахту собрались\nДяды будут белы\nМежду пальцев чорна рысь\nХмелестебель зрелый \n\nНападают на авоську\nПтица жарена летит\nИ ребёнок просит соску\nЧарка трещиной кряхтит \n\nЗа щякою две жевачки\nПод полом ночует крот\nКто-то спит на деревяшке\nПрижимаясь грудью. Вот."},{"date":"21.02.2022","title":"Жить #4","titled":true,"body":"Вставить в церкви просто так\nСвечку восковую\nПоглядеть на небо в такт \nНежным поцелуям \n\nЗа пригорком на лужайке\nПрячутся в траве\nИх поймать не трудно зайке\nВедь их ровно две \n\nСтранно искоса проглянул \nЛандыш закавказский\nРаньше просто б он завянул\nА теперь как в сказке \n\nСтали серой волоса \nИз-под шкуры лета\nВ небе словно полоса\nА в мозгу котлета \n\nНапиваясь светлым соком\nИ крича незлостно\nЕдинясь с родным потоком\nНезаметно, просто..."},{"date":"21.02.2022","title":"Дундук и Бурундук. Живое слово","titled":true,"body":"Два слова \nТемень спала \n\nЗа солнцем солнце встало\nПошли дундук и бурундук\nЗа кошкою, что спала \n\nСпасала живность, дом белел \nИз стенок долго вырвалась\nКровавье бога сонных тел \n\nОни вошли чуть-чуть немного\nИ сразу началось:\nКто, сука, срал с порога? \n\nБывает так, что иногда\nЗмеёю чорною живой \nБелеет солнышко тогда \n\nНичё, ну насрано в прохожке \nИ кошка в ужасе подходит \nЩас вы есть будете всё ложкой \n\nВы для чего сюда насрали?\nНе срали мы, завещан сумрак\nГрибные руки наши спали \n\nКак ты, когда сморщинишь \nЖаровня горья из земли \nДовольны глазки клинишь\n\nКотёнок нам рукой махнул\nИ мы убрались вместе \nГовно без запаха и вкуса \n\nА может это лишь земля \nКоричневого цвета \nМеждународного кремля \n\nДавила ночь лягушка сна\nПодушка заячного свiта \nПоймите, это их и нас планета \n\nДва друга снова в едине \nКартошка перезрела \nПолзёт жучок не по тебе \n\nИзбёгши слизи белой глотки\nБелоголового кита \nНа девственности лодке \n\nПоплыл дундук с бурундуком \nВ страну далёкою как гран\nИ заплывая за буйком \n\nОни увидели там храм \nСтоящий посреди мощей \nНатёртый салом, стоя там \n\nНе понимаешь, где реальность \nОни размякли как листы \nСлоилось тело на астральность \n\nОни гребли ещё ещё \nИ нагребли себе так много \nИх прободающий слущён \n\nОни на берег вышли \nУвидели родную хатку\nИ плача плачами всевышне\n\nЗашли домой и вышли\nТеперь их в ветре обвивал\nЛишь тот, кто был у белых скал... \n\nНо так оно не вышло - \n\nЗа чёрной гайкой мох горел \nСкрутилось в юшку лето\nОб этом скоро песни пел \n\nПокойный нынче ₺€₮Ø฿\nА было это года два назад \nСлова сливались в мета \n\nИ раскрываясь из земли \nМеня преследуя заветно \nСо мной в одну кровать легли \n\nИ было много света \nИ яркочерменный глоток\nНемного онемевшей к лету \n\nКоторый свален с валенковых вод \nНа спален черевичных нот \nИз пасти глоточной пыли \n\nИ плыли они дальше \nУвидели, как океанский кот \nПодплыл и начал\n\nЗаярый сонный паралич\nИз кошки той сочился \nС водой и солью словно bleach \n\nОн встал на воду и завыл \nИз стройной тверди клетка \nМеж притяжений встал как плыл \n\nНо тут дундук и бурундук \nЗабыли кто есть кто \nОдин валялся где-то вкруг \n\nДругой как будто потерялся\nНашли себя вдвоём домой \nИ кто-то там смеялся \n\nНа небе... нет, на ветке белка\nСмеётся \nКак витражи из стёкол мелких \n\nДрузья приблизились к ней, но\nВсё стало плыть как будто \nОкутало их странным сном \n\nПроснулись в лодке снова \nПоплыли дальше побыстрей \nДержа в руках живое слово \n\nПриплыли к берегу Байкала \nОпять заснули, но проснулись \nИ оказались на звезде Адара\n\nОни настали - обратились \nВ слепую чистую поточность \nМочалкой вечности помылись \n\nПотом опять к себе домой \nДовольные от слёзок \nПокой покой покой покой \n\nНевечный неверный \nТакой родной \nВселенной"},{"date":"21.02.2022","title":"Всё застыло","titled":true,"body":"Всё застыло как ледышка \nОбернулось простынёю \nКто-то тихо-тихо дышит \nКто скребётся за стеною \n\nОбернувшейся кнаружи \nНаизнанку кверх ногами \nЭто просто синей лужи\nМотылёк с рогами \n\nПосмотри на серебро \nВ отраженье это \nВсё застыло ведь оно \nЖдёт в ответ ответа \n\nВсё как будто в пелене \nПеленает мама \nВсё понятно вдруг тебе \nНо она всё знала \n\nО тебе и чёрных пятнах\nНа руках как гематомы\nЛеденцов противных мятных\nНевротической скотоме \n\nИх ничтожности, зверье \nВсё застыло в листве\nЗастало сыростью и нашей \nЗолотой истрёпанной водой\nНад горлом голый металл\nПод столом жмурки\nНо полу осколки зеркала \nЗа веной вянут/расцветают \nЖивот как будто не болит \nИз страха и сочувствия \nТеперьче как ломоть\nТебе не жалко их \nА мне их не жалко\nНичего страшного ничего плохого\nТолько втянутые лучи, их туман \n\nПод глазками \nИ кроватью \nОдно \nИ \nТо\nЖе"},{"date":"21.02.2022","title":"Звонкий стук","titled":false,"body":"Звонкий стук \nБелая душа \nЭхо из полей \nМоре не спеша \nХолод и мороз\nВера малыша \nШутка но всерьёз\nМышки знают нас\n\nНа зубах песок \nКамнем по голове \nЯ люблю тебя \nЯ люблю тебя\n\nРадость на глазах \nВетер в голове \nЛишь деталь в пазах \nСолнце не в огне \nБегло загадай \nДважды два плюс шесть \nТихо покивай\nСчастье на душе\n\nНа зубах песок \nКамнем по голове \nЯ люблю тебя \nЯ люблю тебя\n\nКошка наяву \nСлюни в молоке \nКаждый день зову\nГлина на тебе \nСердце из ведра \nКто-то б три ноги чистотелом","titled":false,"body":"натри ноги чистотелом"},{"date":"20.12.2023","title":"колебается трясётся","titled":false,"body":"колебается трясётся\nждёт чего-то | изорвётся\nпостоянные толчки\n\nветки тянутся и гнутся \nглазки колят и дерутся\nизрываются зрачки\n\nв тихой влаге с корешками\nрвутся ноги все мешками\nподрываются из вен\n\nветры ткани рвут и стонут\nтам где дети уток тонут\nмежду палочек и пней\n\nкто-то разорвал меня\nя убил его шмеля\nнам покланялась земля\n\nтает тихих звуков ясля \nпосле каждого трухля\nи розовое вниз\n\nесли падает личинка\nпод диванчик или шкафчик \nэто наш родной подвальчик\n\nпод кормой и дохлой сойкой \nв перегнившей синей сливе\nзаикаться и дрожать\n\nдачка спелый огородик\nпод землёй и корнях-пакетах\nпрыгают мёртвые зайчики\n\nпод губами и сливовый компот\nотдирается часть кожи\nрвётся от одной мысли\n\nприближается и языки \nпожирают и жуют\nснова яркий салют больно\n\nпод крышей опять пусто\nбыстрые ели опадают\nстрашно под крышами когда снег тает\n\nмаленький кричит\nне ведись это специально\nон разрывает душу клочки\n\nобрывки взглядов\nосколки глаголов \nпод домом три человека\n\nпо дороге и по аллее\nравенство птиц на букву к\nдревесные метяжи\n\nсторонние наблюдатели\nстрогие преследователи\nкоженные обложечки \n\nразные тугости и отрывы\nнадрыв и растягивать\nтихо петь как колобок\n\nв нужное время играть как барабан\nкто-то совсем один\nнадо\n\nголосовые хлопья и ранники\nпледья над коробом\nкто-то бьётся\n\nкто-то рвётся\nя лёд\nя мысленно сжигаю его\n\nего обращается\nрастворяется во мне\nодно и то же\n\nраспускается на четвёртое мая\nлисточек ' лепесточек по крови\nпо небу плывёт ручеём смотри"},{"date":"20.12.2023","title":"носороги разбежались","titled":false,"body":"носороги разбежались \nвыпадали зубы зубров\nглотки выпали у кур\nс расписного помидора\nполилась густая жижа\nпод асфальтом пролилась\nи укуталась в ячейки \nиз яичников стрижа\n\nпод малиновой живицей\nпогнутой ижицей\nмячик спустился на третий этаж\nнежно зевает\nкаждый узнает\nчто на земле есть и бывают пожары и жевать из лужи кобальт\nпролиферация синильных щей\nповылезал кощей\nблестит его лицо как на восток лицом\nстранным сонным подлецом\nмоим задроченным отцом\nзаядлым порохом и глиной\nнамазом, солью и малиной\nмалина пролилась на лужи\nиз лужи вырос каземат\nиз старых порванных ботинок\nузвар заёбаный кумкват\nоблился птичий заголовок\nу света нету под подушкой\nя загадал на день рожденья\nахуенную лужу и заговор против того чтобы стать козленочком и старую ветку обглоданную младенцем и муравьями кислый под ртом подмечая \nхочешь со мной выпить чая\nиз лужи в ботинках\nс обрезанной стелькой\nиз керамических капель\nиз героиновых вафель\nсмешной погребок\nгрибов на ногах так много\nи кушать их тоже так вкусно\nа стрелка как кролик упрыгал 🐇\nи стены как жёвыный плинтус\nи я как плинтус в пластине\nи пластик пластмассы весь синий\nи здорово чая\n\nза стенами полазали мухи\nу них всех вельветовы брюки\nс подложками\nспорят с кошками\nлают всеми собаками\nскобки не ставят и матами\nгромко ругаются\nрыгают и просто питаются\nмоим трезвым супом и глиной под пальцами\nи маленькие личинки их тоже под плинтусом\nтоже жуют под койкой и коитусом\nвела палатка и штора так же белая\nкнопки и булавки как на груди укололи в сердце но попало в рёбра и осторожно покрасили гасиво\nвесело \nнаши подрясило \nтак же трясется и бултыхается\nте же слова и на бетоне сохнет ко*\n\nот вас остаётся пепел в глаза летит и осыпается я его развожу с водой и получаю глину грязь на руках и от вас из-под моих ногтей сыпется и мухи это съедают жадно как пьяные мухи и теперь я жую мух и превращаю их в отголоски и их никто уже не слышал и я с ними не виделся их не было их нет их не будет я в ярком красном свете\nпереходя туда я точно знаю что что-то забыл и я точно знаю что время не существует и не существует как шарики или медленные\n\nна граните лежат пояса\nстопы покрыты куркумином\nжернова смазались сами\nзавертелась огромная мельница\nмельник стоит ахуевший\nего кот тоже в ахуе\n\nвремя обозначаю я\nвремя назначаю я\nя являюсь я существую\n\nкорнем по голове\nжабой по подзатыльнику\nшлепай ресницами - дуй на мельницу\nкруги на воде каймят\nдоски под водой не гниют\nкороткие спички все достаются нам"},{"date":"20.12.2023","title":"С улицы повеял холод.","titled":true,"body":"Мы молчали, не могли.\nПо спине посыпались угли.\n\nв уголках сориночки у глаза\nжук смеётся и растёт\n\nВ впадине коленей гнутых\nпарус, загорелась маска\n\nпряжа растянулась и убёгла\nв свёкле новенький арбуз\n\nлёжа на спине гармошкой\nсвязь излилась на воздухе"},{"date":"20.12.2023","title":"лежать","titled":false,"body":"лежать \nпо земле\n\nна гладкой \n\nпо воде\n\nна ряби\n\nпо картону\nЖАБРЫ\n\nНОЖНИЦЫ ПО МЕТАЛЛУ\n\nКУСОЧКИ В ТОМАТЕ\nЛОПНУЛ ШАРИК\nТИШИНА НА ОЗЕРЕ { ПОД ТРАВОЙ СВЕРЧОК\n\nКОЛЕСОМ РУКИ И НОГИ\n\nКАКТУС. Я НЕ ДУМАЛ ЧТО ОН НАСТОЛЬКО КАЛЮЧИЙ\n\nЯ ЛЮБЛЮ ЛЕГО\n\nДВАДЦАТЬ ТРИ\n\nОКРОШКА ПРОТИВНАЯ\n\nКРЫША ПРОДАВЛИВАЕТСЯ\n\nЗАЙЧИКИ\n\nКОШЕЧКИ\n\nВЕГАН ПРЕСТУПЛЕНИЕ\n\nВЕГАМЕТА"},{"date":"20.12.2023","title":"пела звонкую ягоду","titled":false,"body":"пела звонкую ягоду\nела опарышей стучала два раза\nстучали в дверь 🚪\nпод холодильником мёртвая мышка\nпод подоконником странная тень или свечение\n\nрассеивание происходит по воли её маленькой принцессы, находящейся в бутылке или кучи слизи и мозговой жидкости\nне принюхивайся\n\nприглядывайся по углам ищи тень или темень там темнее всего\n\nпод пауками студёный мороз\nя знаю кто ты и я сделаю всё что в моих силах\n\nмои силы растут когда покидают меня ты покидаешь камни в стоячую воду и целенаправленно утонешь под слоем воздушного пространства наоборот, ты этого сам хочешь\n\nж̶а̶л̶ь̶\n\nберцовая кость лошади\n\nдуплет живое облако и семя\n\nэхолот на мёртвом озере\nэхолот в мёртвом море\n\nчеловек пожелал и это сбылось\n\nкожа не зажила и огонь оставил шрам\n\nдождь даёт облегчение\n\nпочувствуй лёгкость и покой\n\nщадащий душ из коры\n\nмел 4","title":"Кто-то висит","titled":false,"body":"Кто-то висит\nКто-то смотрит на нас \nПрямо сейчас \nИз-под иголок травы\nЧто-то знакомо\nГде-то в зелени там\nШмели гудят\nЛистья летят \nКто-то задумался\nКто-то порадовался\nЧто-то кисло \nЧто-то пристально\nПтица летит\nТихо дышит \nВ темноте\nДыхание слышно так\nЧто-то забилось\nЗастучало само\nВ глазах потемнело\nЭто нормально \nВ ушах зазвенело\nЭто нормально всё хорошо\nЧто-то страшно\nЧто-то боязно мне как всегда\nЧто-то вижу\nКто-то пришёл и опять \nЧто-то слышу\nЧто-то чувствую тёплое напротив меня\nОчень близко\nОчень ярко теперь\nЧёткий образ\nЯ собираюсь его обвести \nОн смеётся \nЕму щекотно"},{"date":"11.04.2025","title":"серебрянные","titled":false,"body":"серебрянные \nшелестят над синевой \nтополя листья"},{"date":"26.05.2025","title":"ящерица","titled":false,"body":"ящерица\nеё лапы"},{"date":"01.06.2025","title":"Тигр высунул язык","titled":false,"body":"Тигр высунул язык\nЛезет лобызаться\nХлеб порезал и поник\nХочется кусаться!"},{"date":"16.06.2025","title":"вот было раньше такое","titled":false,"body":"вот было раньше такое\nклопы фиолетовые такие, хотя, наверное, больше синие, так вот, надавишь на них - а из них вытекает. где сейчас таких взять?"},{"date":"16.06.2025","title":"сведённый отрезок правого колеса ягод поднутрений желтушно☆ягодливый","titled":true,"body":"в свёрнутую прядь забрались жуки синие\nподлёт за тихим дощатым _стилом\nживая ягода спустилась, испустилась влага\nценная влага заклинания песчаного воздуха\n\nпряные пальцы суются в карманы за ниткой.\nза чорным тянущимся твёрдым разлито\nприсед за стенкой за глазом свежие листья\n\nтащатся глупо на выдохе тёплые зубы"},{"date":"16.06.2025","title":"Глядела на солнце каждый день.","titled":true,"body":"Прилив точно заберёт мои вещи. Маленькая галька - на деле ракушки, и в них скоро стёкла, на будущий год - и там то темно, то красиво. Притягиваются верно, из воды, скопления пользы для сна и старения. В гремучую жижу затягивает накопленное. На секунду выбрасывает мусор и снова затягивает. Отлетает во все стороны влажная пена и частички живого. Мы целуемся. Иногда. Он не знает. \n\nПод тягучее сожжённое скользкое небо заползает явления наблюдения и моя сетчатка. Разрывается прочно стены липких накоплений. Чёткий символ. Наверное ровный. День. Его страшные странные воздействия губительны и ценны. Свет заполняет пространство. Я так же плотно разрываю липкие наколения. Я от него скрываюсь. Он знает.\n\nМаленькая галька 17 лет назад. Благостная опора. Сбор красивых камней. Чёткий символ впечатался в память - скотомой в сетчатку.\n\nГлядела на солнце каждый день."},{"date":"16.06.2025","title":"Пряник сказки мило чешет","titled":false,"body":"Пряник сказки мило чешет\nПару сводных свояков\nСвёкр золовку потешет\nДеверь выпил молоков\n\n---\n\nМасло падало в ладони\nКони ветки снегири\nЖалоб не было и корни\nГусто в сердце проросли"},{"date":"05.07.2025","title":"что такое благо","titled":false,"body":"что такое благо\nпить сухую влагу\nесть сырую рыбу\nтечь напором дыр\n\nсвета нам не надо\nобдала прохлада\nшире растянулась\nлазерная мышь\n\nсемечки и гречки\nстарые словечки\nперемёрзла кожа\nдикие кусты\n\nсамая слепая\nвидит по дороге\nпалые от алых\nваленок цветных\n\nколят между рёбер\nили глаз почешет \nили рот помажет\nпромелькнёт святое\n\nкопоть между чешек \nчашек снов гранитных\nлижет питекантроп\nсерый хвост у мышки\n\nв день солёной скорби\nвнешние услуги \nперепутал сабли\nпаровоз и плут\n\nкнопки цифры пяльца\nмедные ботинки\nжестяные пальцы\nсветят в темноте"},{"date":"10.07.2025","title":"пухлые листья","titled":false,"body":"пухлые листья\nтёмные тёмные\nне перепечённые\n\nза дыханием \nмоим"},{"date":"10.07.2025","title":"вдуваясь текучей фразой","titled":false,"body":"вдуваясь текучей фразой\nим \"нужно всего и разом\"\nон умер вчера два раза\n\nего страшно отпели \nкак красный клубок\nего уносили тихонько\n                 вбок\n\nон Заледенял\nи Оттаял\nпод громкими норами \nв пышном песке\n\nего дослужатели пели\nпро ноги его и кипели\n\nон не будет лежать\nв тени листьев берёз\nили тени слонового тополя\n\nв бабушке ползает\nмоль по сосудам \nи ищет работу\n\nк падению\nбыло готово\n\nв семь лет\nкаждый год\nполулунный\nплывёт\n\nи кассету\nсладкую \nдарит\n\nв лёд\nидёт\nвсё\n\nи\nоттуда\n\nсжимая порванный кусок красной ткани\nзубами\nвозникая и заслуживая \nне видел (не смотрел) не слышал и ничего никогда не говорил\n\nпростое\n\nвечнозелёная камфора\nвеник полыни\nперехлёстывай реки и петли \nи петельки на моей голове\n\nсмять\n\nсемечко вязло тебя в новый год\nпод лютый и тонну мороза\nот холода тёплые руки\nот мела колючие звуки\n\nстихает\n\nвесёлый под ло̀ктем\nчертящий доло̀том \nдыша позоло̀том\nсверкающий жук\n\nмлеет\n\nреет вездеходной паранойей\nтрепыхает чёрной смолой\nмой лучший друг\n\nнезаслуженно\n\nтлеет лучина - щепка\nс новым морозом и новой простынкой\n\nвыдыхает \n\nбелая роща и пыль и овраг\n\nмеденеет\n\n\nприм: \nон умер вчера два раза\none for tomorrow one just for today"},{"date":"24.07.2025","title":"ни хуя в железной бочке","titled":false,"body":"ни хуя в железной бочке"},{"date":"25.07.2025","title":"покинутые ворота","titled":false,"body":"покинутые ворота\nлуга на жидком масле\nтянутся вдоль рота\nмятликовой массой\n\nхрен и сурьма\nмёд наливной набивной\nжито с малиной и тьма\nжирные сухой дело запахом\n\nна пробивной мороси\nна мразе морской \nна чудо юде с жировиками\n\nклёцки набухли \nпена стремглав\nразвязывает\nвстающих \n\nс паукав\n\nс терема в темечко \nс яблони в яблочко\nс нитки да около\nлапти мои велики\n\nс чудо юдом на палубе\nпересыхают ватой смелые выцветшие\nвымпел покажет\nкривую усрачку\n\nв смачную точку\nсрочную качку \nногтей неприкрытых \nзимой в водокачку\n\nс нелепо потухших\nпрекрасных стемнело\nпо их позолотам \nтопталися мелом\n\nза вечную плёнку\nи кодлу котёнка\nза падлу и свечку\nза мамину речку\n\nи прыги с подскоками\nтень на затылке\nот рыжих коленей\nпосыпались вилки \n\nи тени грохочут\nстепное корыто\nспокойно упало\nпелёнкой покрыто\n\n... стяги бляхи \nдублёная кожа\nсвисая смекаю\nстреляю тоже\n\nконтра желудка\nконтур котёнка\nзелёная жижа\nи вкусная фомка\n\nюжнее залито хребет и рука\nнаверное крепко зажата рука\nплиточно точно седьмою рукой\nгладко и с точностью свежести тронул рукой"},{"date":"07.08.2025","title":"пальчики петельки","titled":false,"body":"пальчики петельки\nмаленьким бантиком\nелозя канатом облупленным\n\nдо̀ворот с елями гущами\nпро̀летной кучей и тучами\n\nвещи окучены руки закручены\nкручи уступлены волосы ступлены\nбесы исступленны лесы преступлены\nкости затуплены мылом покусанным \nсмело потоплено валом истоптано\nпёсово хрючево - туша измучена\nкожа натянута - дёргает занавес\n\nстылые яблоки пёстрые до̀роги\nпадали в валенок: велено - валено\nко̀лено белено\n\nкрасным просветом\nзапертым светом\nдолго ползущим\nтелом несущим\n\nтяготно-сливочно\nсолнечно-заечно"},{"date":"06.09.2025","title":"жать сладкую дверь","titled":false,"body":"жать сладкую дверь \nслоёной стрекочащей щепкой\nвыгни пёструю банку рваную острую\n\nналедь стоячая \nнити висячие\nгляди пропащие \nвещи цветнущие\n\nкла̀ди упрямые \nпереворачили\nмедью и колом\nи острым терновым\nизблѐдным уколом\nпотопом затоном \n\nзавалом уверенно\nпрямо у двери там\nчёрные лебеди\n\nклешни с арбузами\nс синими пузами\nлюбят и корчатся\nв стенах ворочатся\n\nпалые капельки\nрытые камушки\nпадали на асфальт\n\nгрохотом клёпок\nтреском надорванным\nплачет в медовом настое из снурых трав - полынь там, пустырник и семь килограмм зверобоя\nсладкое зарево\nза̀лило \nвпитано\n\nсныли подсунули \nкаждое дерево\nхочет узнать \nсладкое вежливо\nвлагу и нежное \nтёплое жаркое\nострое сладкое\nкислое горькое\n\nсливы избитые\nноры прорытые\nгрешные мальчики\nжалкие перчики\nсухлые вялые\nпряные свежие\nлёжа и стержни\nлетали над прежней\nземлёю \nмятежной\nприбрежной\nлюбимой\n\nзапрись колобок ты в кладовку сырую\nтам ты найдёшь оберег и вторую\nкислую мину свою наболдажную \nкрасномалинову заживо\n\nповлёкло тускло между солнечных дорог самую хмурую босоногую кровную палую лиственницу под подорожником брёвна избытка селена и кроме заливы ничё кроме ветреной красной под яблоней поля и снурых трав степных горьких и кроме глашатаях сусликов нет за исключением жаворонок жарптичных\nтаких неприличных \nнепойманных в сумку \nсхватили за руку\nиз плаванья мления\nпопали камения\nв рот и песок\nи очень приятно в желудке"},{"date":"06.09.2025","title":"заморозки выскребло сведённым подзащитником","titled":false,"body":"заморозки выскребло сведённым подзащитником\nкопьё немытое дало обдало по голове\nзвенящая порча прошла\nснимались оковы и скулы ушли\nнамазано на фонарях \nтяжёлой рукой ведь не я\nпрочитал на окурке седьмую строку\nо том что всё хорошо у орла золотого \nорало и звон под рукой и под колом\nзвено под рукою и гладкая кома \nсилком он пошёл под рукой под немой \nза̀ледь обсохла и на̀ледь руки обветшала отпрыснула\nвидимый мир затянулся под пояс\nпод дорогой темно под осиной темно\nвверх натянуто смотрит\nком и под палкой пятно на тину похоже\nпод разными световыми лучами\nпотомок поток и под сливой\nмелькают синонимом вялые пальцы \nна стол накрывает отчаянный гость\nпусть ветка пусть ветер засохнет \nзахочет узнать \nкак говорить слово"},{"date":"07.01.2026","title":"еле дыша̀ща","titled":false,"body":"еле дыша̀ща\nрастёт трава на камне\nбесцветен стебель"},{"date":"20.01.2026","title":"в камне зелёном лыжня обеззвучилась","titled":false,"body":"в камне зелёном лыжня обеззвучилась\nв гладком и мокром слоновом камне\nв полоску продольную белую меловую ровную\nсместился центр железного здания\nтвёрдо завкопанного наблюдаемого\nзвероподобно отчаянно распластанного \nсферой по темечку круглое зарево\nмёртвое здание - смятое пуговкой\nмышка под плинтусом дюже напугана\nплесень под плинтусом тесно под плинтусом\n\nжалкое зрелище белые танки в пятке рогатки\nжалкие деревья дающие антиплоды\nантисемена усеяны в белозём корнями в небо\nустали и нестойко выползают наружу\nтам я их собираю и развешиваю на стену\nприложив к ней ухо еле различимый смех\nи на лице нет радости а только дом травы\nчёрной смоляной душистой солодки \nна морщинистой руке моей старой сухой\nи утро над пеплом моим вездечерепным\n\nнад моим вздохом пролетело 11 уток\nэто утро запомнилось вещим озером\nчуть родным и чуть более чистое дно\nв нём полторы сотни ракушек и звуки \nсведённых конечностей сладкие муки\nа порох на гладком краю пробегает\nсиними лесками трясущийся белый уж\nи глаз его синий от лесок и высоко\nи стал он как шаткого представления\nпоследствий лишённый сделанный шаг"},{"date":"20.01.2026","title":"движение - смерть","titled":false,"body":"движение - смерть"},{"date":"31.01.2026","title":"сухой запылённый","titled":false,"body":"сухой запылённый\nестественно водянистый\nчистый незамутнённый\nне проверял и не верю \n\nбез меня сочетаются клинья пожарной весны\nраскрываются здесь и сейчас бредни отдельной лисы \nиз пробеднённой по тонкому льду полосы\nне на нас [ни на кого] надвигается солнце\n\nдальше дымящейся двери \nя дальше стою\nза полем хлопко̀вым \nгде тополь не видно \n\nя там где тебя я нигде не увижу\nдаже на чёткой крахмальной картинке\nи волосы твои морской пеной \nне вольются в беспочвенность \nмоих глаз \n\nхоть я видел их в детстве...\nтак много раз...\nно не помню\nне вижу\n\nты видел январь и ты был таков\nпод са̀нями разной консистенции\nрезной самописный по гальке журавль\nтихо смеялся в лицо тебе летом\n\nи не было это\nи я не был там\nи я никогда не почувствую почву\nи никогда я не мял и не вымну травы\n\nи жура̀вельный тот крик не услышу"},{"date":"17.02.2026","title":"от глода до тала","titled":false,"body":"от глода до тала\nнаглядная хтала\nохватывала\nпемезы св<л>ои целовала\n\nлицы намазаны\nстёкшим с топаза\nэрции ёжевшей\nмякоть нарвала \n\nпо верхней сухой серой линии трезво\nпо мелкой дощечке где щёки стянули\nкирпичную зыбкую пару дерюжную\nкожу натужную - газа из лужи\n\nне пепельной маски\nнет поро̀ся тиснений\n\nкривых окаянных текстилей киселей\nсуфлёристо-сушливых нет карасей\nи под ладошкой нет ветра зелёного\nесть только стойкий сыпучий поло̀з\n\nв изгибе тягучем \nна пробке из луба \n\nиз чётких аморфных телят поурезан\nсапфировый стыдный эякулят\nи твёрдой опорой железной древесной\nмой праздник по жёлтым врут\n\nа на мне трезвонит первая ласточка\nпо моём глиняном но̀су раковины\nспичечно-серно гуляет удар\nиз слизи и грязи мертвеет \nего наполняет неумело\nшвыряет направо\nи душит руками\nналево летит\nсудно его\nтак уже\nдалеко\n\nвблизи\nи окно\nпромах\nскучно\nхворост\nна хвост положили лисе\nспать будет крепко \n\nне спит только жалкое древко\nв решётчатой ко̀сти сухих андертальцев\nявлённое сверху причастное лишь копьё \nи север неотчуждённый замороченный"},{"date":"25.04.2026","title":"где ползёт змея","titled":false,"body":"где ползёт змея\nгде полоз и уж\nна меня из-под луж\n\nналетают налево клонятся\nиз-под соли пещерной\nради меня слоятся\n\nпо осиной заре\nпо листкам что в ведре\nпо кайме окаянного луба\n\nпо зарифным лазурям\nна разных пружинах\nпетрификаты раздуем\n\nсложим РЕЗАНЫЙ оригофалк\nи петух неуклюжий\nи свёрнуто ухо у окуня"},{"date":"24.05.2026","title":"жемчужные грозди сирени","titled":false,"body":"жемчужные грозди сирени\nзасохли пятна на ткани\nзелёные шапки в капкане \n\nцыплята всё так же в уздечке\nтам рядом где скачет овечка\nсвободный бодающий козлик\n\nбардак - лежит всё на месте\n\nуспеть бы на выдох негромко\nприлипший ко мне колокольчик\nпотише гремите погромче\n\nи мёда и щей побольше\nпоглаже свиней и почище\nзверёные недра вулкана\n\nа шапка всё так же в капканах\n\nзелёная яркая свечка\nпоярче светить и дымиться\nзелёная ил океана\n\nсведённые створки канала \nсильнее плотнее держаться\nпод звуки града-тумана\n\nзелёная пыль океана\n\nнадежда на плоское тело\nсуслатая мера падѐжа\nсвита̀я звериная ласка \n\nнадёжно держать от падений\nнеправда неправда неправ const LS = 'vegameta.fav.v1';

const strip = s => s.normalize('NFD').replace(/[\u0300-\u0336]/g,'').replace(/ё/g,'е').toLowerCase();
TEXTS.forEach((t,i)=>{
  t.i = i;
  const [d,m,y] = t.date.split('.');
  t.y = +y; t.m = +m; t.dd = +d;
  t.t = new Date(+y, +m-1, +d).getTime();
  t.hay = strip(t.title + '\n' + t.body);
});

let fav = new Set();
try{ fav = new Set(JSON.parse(localStorage.getItem(LS)||'[]')); }catch(e){}
const saveFav = ()=>{ try{ localStorage.setItem(LS, JSON.stringify([...fav])); }catch(e){} };

const S = { q:'', year:null, month:null, favOnly:false, cur:null };
let view = [];

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- spine ---------- */
const T0 = new Date(2019,0,1).getTime();
const T1 = new Date(2026,11,31).getTime();
const pos = t => (t - T0) / (T1 - T0);

function drawSpine(){
  const svg = $('spineSvg');
  const active = !!(S.q.trim() || S.year || S.favOnly);
  const ids = new Set(view.map(t=>t.i));
  let s = '';
  if (S.year){
    const a = pos(new Date(S.year, S.month?S.month-1:0, 1).getTime());
    const b = pos(new Date(S.month?S.year:S.year+1, S.month?S.month:0, 1).getTime());
    s += `<rect class="spine-band" x="${(a*100).toFixed(3)}%" y="0" width="${((b-a)*100).toFixed(3)}%" height="100%"/>`;
  }
  for (const t of TEXTS){
    const x = (pos(t.t)*100).toFixed(3) + '%';
    const on = active && ids.has(t.i);
    const cur = S.cur === t.i;
    const off = active && !ids.has(t.i);
    s += `<line class="tick${cur?' cur':on?' on':off?' off':''}" x1="${x}" y1="${cur?2:8}" x2="${x}" y2="${cur?50:44}"/>`;
  }
  svg.innerHTML = s;
}

function spineDate(clientX){
  const r = $('spine').getBoundingClientRect();
  const f = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  return new Date(T0 + f * (T1 - T0));
}
$('spine').addEventListener('mousemove', e=>{
  const d = spineDate(e.clientX);
  $('readout').textContent = String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
});
$('spine').addEventListener('mouseleave', ()=>{ $('readout').textContent = ''; });
$('spine').addEventListener('click', e=>{
  const d = spineDate(e.clientX);
  const y = d.getFullYear(), m = d.getMonth()+1;
  if (S.year===y && S.month===m){ S.year=null; S.month=null; }
  else { S.year=y; S.month=m; }
  render();
});

/* ---------- years ---------- */
const YEARS = [...new Set(TEXTS.map(t=>t.y))].sort();
$('years').innerHTML = YEARS.map(y=>{
  const n = TEXTS.filter(t=>t.y===y).length;
  return `<button class="yr" data-y="${y}" aria-pressed="false">${y}<span class="yr-n">${n}</span></button>`;
}).join('');
$('years').addEventListener('click', e=>{
  const b = e.target.closest('.yr'); if(!b) return;
  const y = +b.dataset.y;
  if (S.year===y && !S.month){ S.year=null; } else { S.year=y; }
  S.month = null;
  render();
});

/* ---------- filtering ---------- */
function filter(){
  const q = strip(S.q.trim());
  return TEXTS.filter(t=>{
    if (S.favOnly && !fav.has(t.i)) return false;
    if (S.year && t.y !== S.year) return false;
    if (S.month && t.m !== S.month) return false;
    if (q && !t.hay.includes(q)) return false;
    return true;
  });
}

function hl(text, q){
  const e = esc(text);
  if(!q) return e;
  const h = strip(e); const i = h.indexOf(q);
  if(i<0) return e;
  return e.slice(0,i) + '<mark>' + e.slice(i,i+q.length) + '</mark>' + e.slice(i+q.length);
}

function snippet(t, q){
  const h = strip(t.body); const i = h.indexOf(q);
  if (i < 0) return '';
  const a = Math.max(0, i - 24), b = Math.min(t.body.length, i + q.length + 40);
  const raw = (a>0?'…':'') + t.body.slice(a,b).replace(/\s+/g,' ').trim() + (b<t.body.length?'…':'');
  const e = esc(raw); const hs = strip(e); const j = hs.indexOf(q);
  if (j < 0) return e;
  return e.slice(0,j) + '<mark>' + e.slice(j,j+q.length) + '</mark>' + e.slice(j+q.length);
}

function renderList(){
  const q = strip(S.q.trim());
  const ul = $('list');
  if (!view.length){
    ul.innerHTML = `<li class="empty">Ничего не найдено.<br><button id="resetIn">сбросить фильтры</button></li>`;
    const r = $('resetIn'); if(r) r.onclick = reset;
    return;
  }
  ul.innerHTML = view.map(t=>{
    const cur = S.cur === t.i;
    const un = !t.titled || /^\*+$/.test(t.title);
    const label = un && /^\*+$/.test(t.title) ? '· · ·' : t.title;
    const sn = q && !strip(label).includes(q) ? snippet(t,q) : '';
    return `<li><button class="li${fav.has(t.i)?' faved':''}" data-i="${t.i}" aria-current="${cur}">
      <span class="li-d">${t.date.slice(0,5)}.${String(t.y).slice(2)}</span>
      <span class="li-main">
        <span class="li-t${un?' untitled':''}">${hl(label,q)}</span>
        ${sn?`<span class="li-x">${sn}</span>`:''}
      </span>
      <span class="li-f">✚</span></button></li>`;
  }).join('');
}

function renderReader(){
  const el = $('reader');
  if (S.cur === null){
    el.innerHTML = `<div class="hint">
      <b>278 текстов, 2019–2026.</b><br>
      Полоса сверху — все тексты по датам. Клик по ней — месяц, клик по году — год.<br>
      Поиск идёт по названиям и по телу текстов; ударения и ё не мешают.<br>
      <b>✚</b> — отметить в избранное. Отметки хранятся в этом браузере.<br>
      <kbd>↑</kbd> <kbd>↓</kbd> листать · <kbd>/</kbd> поиск · <kbd>f</kbd> отметить · <kbd>r</kbd> наугад
    </div>`;
    return;
  }
  const t = TEXTS[S.cur];
  const pos_ = view.findIndex(x=>x.i===t.i);
  const un = !t.titled || /^\*+$/.test(t.title);
  const label = un && /^\*+$/.test(t.title) ? '· · ·' : t.title;
  el.innerHTML = `<article class="rd">
    <button class="rd-back" id="backBtn">← к списку</button>
    <div class="rd-meta"><span>${t.date}</span><span>№ ${t.i+1}</span></div>
    <h2 class="rd-h${un?' untitled':''}">${esc(label)}</h2>
    <div class="rd-body">${esc(un && !/^\*+$/.test(t.title) ? t.title + '\n' + t.body : t.body)}</div>
    <div class="rd-foot">
      <button class="fav" id="favT" aria-pressed="${fav.has(t.i)}">
        <span class="fav-i">✚</span><span>${fav.has(t.i)?'в избранном':'в избранное'}</span>
      </button>
      <span class="nav">
        <button id="prevB" ${pos_<=0?'disabled':''}>← пред</button>
        <button id="nextB" ${pos_<0||pos_>=view.length-1?'disabled':''}>след →</button>
      </span>
    </div>
  </article>`;
  el.scrollTop = 0;
  $('favT').onclick = ()=>toggleFav(t.i);
  const b = $('backBtn'); if(b) b.onclick = ()=>{ $('app').dataset.view='list'; };
  $('prevB').onclick = ()=>step(-1);
  $('nextB').onclick = ()=>step(1);
}

function step(d){
  const p = view.findIndex(x=>x.i===S.cur);
  const n = p + d;
  if (n>=0 && n<view.length) open(view[n].i);
}

function toggleFav(i){
  fav.has(i) ? fav.delete(i) : fav.add(i);
  saveFav(); render();
}

function open(i){
  S.cur = i;
  location.hash = 'n' + (i+1);
  $('app').dataset.view = 'read';
  render();
}

$('list').addEventListener('click', e=>{
  const b = e.target.closest('.li'); if(!b) return;
  open(+b.dataset.i);
});

function render(){
  view = filter();
  $('shown').textContent = view.length;
  $('favN').textContent = fav.size ? '(' + fav.size + ')' : '';
  $('favBtn').setAttribute('aria-pressed', S.favOnly);
  [...$('years').children].forEach(b=>b.setAttribute('aria-pressed', +b.dataset.y===S.year));
  renderList(); renderReader(); drawSpine();
  const a = document.querySelector('.li[aria-current="true"]');
  if (a) a.scrollIntoView({block:'nearest'});
}

function reset(){ S.q=''; S.year=null; S.month=null; S.favOnly=false; $('q').value=''; render(); }

$('q').addEventListener('input', e=>{ S.q = e.target.value; render(); });
$('favBtn').onclick = ()=>{ S.favOnly = !S.favOnly; render(); };
$('clearBtn').onclick = reset;
$('randBtn').onclick = ()=>{
  const p = view.length ? view : TEXTS;
  open(p[Math.floor(Math.random()*p.length)].i);
};

document.addEventListener('keydown', e=>{
  if (e.target.tagName === 'INPUT'){ if(e.key==='Escape') e.target.blur(); return; }
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='/'){ e.preventDefault(); $('q').focus(); }
  else if (e.key==='ArrowDown'||e.key==='j'){ e.preventDefault(); S.cur===null? (view[0]&&open(view[0].i)) : step(1); }
  else if (e.key==='ArrowUp'||e.key==='k'){ e.preventDefault(); step(-1); }
  else if ((e.key==='f'||e.key==='а') && S.cur!==null){ toggleFav(S.cur); }
  else if (e.key==='r'||e.key==='к'){ $('randBtn').click(); }
  else if (e.key==='Escape'){ $('app').dataset.view='list'; }
});

const m = /^#n(\d+)$/.exec(location.hash);
if (m){ const i = +m[1]-1; if (TEXTS[i]){ S.cur=i; $('app').dataset.view='read'; } }
render();
</script>
</body>
</html>
