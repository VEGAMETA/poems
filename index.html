<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вегамета — тексты 2019–2026</title>
<meta name="description" content="Архив текстов Вегаметы, 2019–2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=PT+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEDE7;
  --paper-2:#E4E6DE;
  --rule:#D2D5C9;
  --ink:#23222E;
  --ink-soft:#6C6B7A;
  --ink-faint:#9A99A6;
  --accent:#4A3F8C;
  --mark:#B33A3A;
  --mono:"PT Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Literata",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- masthead ---------- */
.top{
  border-bottom:1px solid var(--rule);
  padding:18px 20px 0;
}
.top-row{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
}
.wordmark{
  font-family:var(--mono);
  font-size:15px;
  letter-spacing:.34em;
  text-transform:uppercase;
  margin:0;
  font-weight:400;
}
.count{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-soft);
  letter-spacing:.06em;
}
.count b{font-weight:400;color:var(--ink)}

/* ---------- spine ---------- */
.spine-wrap{margin:14px 0 0;user-select:none}
.spine{
  position:relative;
  height:52px;
  cursor:crosshair;
  touch-action:pan-y;
}
.spine svg{display:block;width:100%;height:100%;overflow:visible}
.tick{stroke:var(--ink);stroke-width:1.15;opacity:.28}
.tick.on{opacity:.95;stroke:var(--accent);stroke-width:1.6}
.tick.off{opacity:.1}
.tick.cur{stroke:var(--mark);opacity:1;stroke-width:2.2}
.spine-band{fill:var(--accent);opacity:.09}
.spine-hair{stroke:var(--ink-faint);stroke-width:1;stroke-dasharray:2 3}
.years{
  display:flex;
  border-top:1px solid var(--rule);
}
.yr{
  flex:1 1 0;
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:.08em;
  color:var(--ink-faint);
  padding:6px 0 9px;
  text-align:left;
  border-right:1px solid var(--rule);
  transition:color .12s;
}
.yr:last-child{border-right:none}
.yr:hover{color:var(--ink)}
.yr[aria-pressed="true"]{color:var(--accent);font-weight:400}
.yr[aria-pressed="true"] .yr-n{color:var(--accent)}
.yr-n{display:block;color:var(--ink-faint);font-size:9.5px;margin-top:2px}
.readout{
  font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);
  height:14px;letter-spacing:.06em;
}

/* ---------- layout ---------- */
.app{
  display:grid;
  grid-template-columns:minmax(260px,340px) 1fr;
  height:calc(100dvh - 155px);
  min-height:420px;
}
.pane{overflow-y:auto;-webkit-overflow-scrolling:touch}
.index{border-right:1px solid var(--rule);background:var(--paper-2)}

/* ---------- controls ---------- */
.controls{
  position:sticky;top:0;z-index:3;
  background:var(--paper-2);
  border-bottom:1px solid var(--rule);
  padding:12px 14px 10px;
}
.search{
  width:100%;
  font-family:var(--mono);font-size:12.5px;
  background:var(--paper);
  border:1px solid var(--rule);
  color:var(--ink);
  padding:8px 10px;
  border-radius:0;
}
.search::placeholder{color:var(--ink-faint)}
.search:focus{outline:none;border-color:var(--accent)}
.filters{display:flex;gap:14px;align-items:center;margin-top:9px;flex-wrap:wrap}
.chip{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  color:var(--ink-faint);border-bottom:1px solid transparent;padding-bottom:1px;
}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.chip.mark[aria-pressed="true"]{color:var(--mark);border-bottom-color:var(--mark)}

/* ---------- list ---------- */
.list{list-style:none;margin:0;padding:0 0 40px}
.li{
  display:flex;gap:10px;align-items:flex-start;
  width:100%;text-align:left;
  padding:8px 14px;
  border-bottom:1px solid var(--rule);
  line-height:1.35;
}
.li:hover{background:var(--paper)}
.li[aria-current="true"]{background:var(--paper);box-shadow:inset 3px 0 0 var(--mark)}
.li-d{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);flex:0 0 auto;letter-spacing:.02em;padding-top:3px}
.li[aria-current="true"] .li-d{color:var(--ink-soft)}
.li-main{flex:1 1 auto;min-width:0}
.li-t{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-x{
  font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);
  display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.li-t.untitled{color:var(--ink-soft);font-style:italic}
.li-f{flex:0 0 auto;color:var(--mark);font-size:11px;opacity:0;padding-top:3px}
.li.faved .li-f{opacity:1}
.li mark{background:rgba(74,63,140,.18);color:inherit}
.empty{padding:28px 16px;font-family:var(--mono);font-size:12px;color:var(--ink-soft);line-height:1.7}
.empty button{color:var(--accent);border-bottom:1px solid var(--accent)}

/* ---------- reader ---------- */
.reader{padding:0}
.rd{max-width:36rem;margin:0 auto;padding:44px 28px 96px}
.rd-back{display:none}
.rd-meta{
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);
  letter-spacing:.08em;
  border-bottom:1px solid var(--rule);
  padding-bottom:7px;margin-bottom:22px;
}
.rd-h{
  font-size:23px;font-weight:600;line-height:1.28;
  margin:0 0 20px;letter-spacing:-.01em;
}
.rd-h.untitled{color:var(--ink-soft);font-weight:400;font-style:italic;font-size:19px}
.rd-body{
  white-space:pre-wrap;
  overflow-wrap:break-word;
  font-size:17.5px;
  line-height:1.5;
}
.rd-foot{
  margin-top:38px;padding-top:14px;border-top:1px solid var(--rule);
  display:flex;gap:18px;align-items:center;flex-wrap:wrap;
  font-family:var(--mono);font-size:11px;letter-spacing:.05em;
}
.fav{color:var(--ink-faint);display:flex;align-items:center;gap:6px}
.fav:hover{color:var(--mark)}
.fav[aria-pressed="true"]{color:var(--mark)}
.fav-i{font-size:13px;line-height:1}
.nav{margin-left:auto;display:flex;gap:14px}
.nav button{color:var(--ink-faint)}
.nav button:hover{color:var(--accent)}
.nav button[disabled]{opacity:.3;cursor:default}
.nav button[disabled]:hover{color:var(--ink-faint)}
.hint{
  padding:80px 28px;max-width:34rem;margin:0 auto;
  font-family:var(--mono);font-size:12px;line-height:2;color:var(--ink-soft);
}
.hint b{color:var(--ink);font-weight:400}
kbd{
  font-family:var(--mono);font-size:10.5px;
  border:1px solid var(--rule);background:var(--paper-2);
  padding:1px 5px;
}

@media (max-width:760px){
  body{font-size:16px}
  .app{grid-template-columns:1fr;height:auto;min-height:0}
  .index{border-right:none;border-bottom:1px solid var(--rule)}
  .pane{overflow:visible}
  .app[data-view="read"] .index{display:none}
  .app[data-view="list"] .reader{display:none}
  .controls{position:sticky;top:0}
  .rd{padding:16px 18px 72px}
  .rd-back{
    display:inline-block;font-family:var(--mono);font-size:11px;
    color:var(--accent);letter-spacing:.06em;margin-bottom:20px;
  }
  .spine{height:44px}
  .wordmark{font-size:13px;letter-spacing:.28em}
  .yr{font-size:9.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <h1 class="wordmark">Вегамета</h1>
    <div class="count"><b id="shown">—</b> из <b>278</b> · 2019–2026</div>
  </div>
  <div class="spine-wrap">
    <div class="spine" id="spine"><svg id="spineSvg" preserveAspectRatio="none" aria-hidden="true"></svg></div>
    <div class="readout" id="readout"></div>
    <div class="years" id="years"></div>
  </div>
</header>

<main class="app" id="app" data-view="list">
  <div class="pane index">
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="поиск по тексту и названию" autocomplete="off" spellcheck="false" aria-label="Поиск">
      <div class="filters">
        <button class="chip mark" id="favBtn" aria-pressed="false">избранное <span id="favN"></span></button>
        <button class="chip" id="randBtn">наугад</button>
        <button class="chip" id="clearBtn">сбросить</button>
      </div>
    </div>
    <ul class="list" id="list"></ul>
  </div>
  <div class="pane reader" id="reader"></div>
</main>

<script>
const TEXTS = [{"date":"04.01.2019","title":"4 января 2019","titled":true,"body":"Мечты, они такие...\nСквозь пальцы\nС тыльной стороны\nЛадони\nПрилипнули\nЯ их в рот тяну,\nА мама говорит,\nНе кушай песок.\nИ бьёт\nПо рукам\nПо-материнешески\nНежно\n\nДругие же \nПодходят \nКо мне \nНевежды\n\nТянут свои конечности\nГоворят, мол нет\nИ вытирают мне рот \nСалфеткой \n\nМне 7 миллиардов лет.\nШелестит листва,\nШепчет, шепчет,\nПриговаривает:\nТвоя кровь моя кровь\nТвоя кровь \nМоя вода \nМы да ты со мной..."},{"date":"26.04.2019","title":"Нет участи печальнее на свете,","titled":false,"body":"Нет участи печальнее на свете,\nЧем грязное дерьмо на туалете!\nПоганое желудочное пойло \nИ звонкий утренний понос\nИзвольте выдать на поднос\nПраматери из дома\nГде слышны крики, стоны\nИ прочая немая хуета \n\nПомойная уродская свиная рожа\nТаращится — это прохожий\nИдёт на выборы - больной\nИ утку под него положат\nИ будет срать он весь горой\nНа унитаз, на контрабас,\nНа утку и стеклянный глаз \nНемого семилетнего мальчишки\n\nБаклан летит - не разобьётся\nА люди трезвые - в крови \nЖелтеют бледные их лица\nОни подохнут, а кишки\nРазвесят на сушилке птицы\nИ в робкие хрустящие мешки\nПоложат их из дома вон \nИ слышится повсюду колокольный звон"},{"date":"09.07.2019","title":"Деторождение","titled":true,"body":"Парашютный звон обвивал Степана \nСловно ватные шарики катались на него\nКубарем по заснеженным равнинам\nИ пропадали, а появлялись в небесах\nТам Боги ими вытирали свои безгрешные очки\n\nТомились в спячке скороварки \nВ духовке мокла канитель \nСнежок с чудесным настроеньем \nВсё уплывал на небеса, к Богам.\nК полубогам шли толпы горностаев.\n\nЗвенела речка и ручей\nИ стая добрая грачей\nШестые сутки напролёт \nЗакладывал он кирпичи \nСмилуйся, не огорчи\nСудьбы бездумный огуречик\nНе пожалей ты нам словечек \nДля выраженья тяжких дум, \nКогда сидел же слон\nСтоящий, как заслон\nЕго вдруг осенило\nКак осина!! \nЗалило керосином!!!\nИ вот в исходе дня лежит гармошка \nИ плачет понемножку\nСтрую свою струя \nА на обложке \nСостарившиеся мошки\nПлетут корзину для шмеля \nОн им указ даёт \n\"Чтоб было как на эшафот, \nЧтоб зеркало блестело \nЗерном позора не хрустело\"\nИ вот мои любимые штанцы \nИ рисовали этот праздник \nКак пчёлы, осы, огурцы \nИ Петька наш проказник \nВсё рвали там какие-то бумажки\nА букашки \nШли на пир горой, \nЦвела сирень, \nИ Бах играл\nНа эстокаде, не на взводе,\nНа звуках бешеной швеи\nИ на кассетных на коробках.\nТакая вот была тоска\nИ кисловатая была треска\nК обеду поданная в завтрак\nСнимает свой грязнющий фартук \nИ смеётся, тут и там \nИ раздаётся басом \"Мандельштам!!\"\nА я сижу на красной сетке\nИ вижу много-много лета\nИ разных сказочных креветок\nОни как пышные кокетки\nЗаканчивают мой рассказ\nПро то, про это, \nПро то как дикий дикобраз...\nА впрочем,\nКак можно говорить об этом ночью."},{"date":"09.07.2019","title":"***","titled":false,"body":"***"},{"date":"09.07.2019","title":"***","titled":true,"body":"Щавельные триумфы и запойные маслины\nДыроколовый привет тебе покрасив жёлтым спину\nНадышись животными шарами, шуточной малиной\nМаршируем под лугами и портретами Беллини \n\nВсё безвкусные капусты и заезженные темы\nЩекотливые мыслишки об окутывающих нас стенах \nДавай будем плакать вместе, слёзы льются как любовь\nА слёзки табуреточек всё текут как воск или суп дубов\n\nПройдя по магазинам, я увидел нечто\nЭто было на стойке в отделе с огурцами\nНу я подошёл, поздоровался, думал, всё наперекосяк, но меня успокоили \nПотом я решился подойти к продавщице и потянулся за спичками или батарейками и упал в пропасть\nЯ долго кричал пока не закончился воздух в лёгких \nА когда он закончился я начал просыпаться, но то не сон был, а правда, чистая правда, завертелся я как морской Конёк и уже думал отбросить коньки эти, но вдруг стал как конь и подоить лошадь не могу теперь я, страшно и стыдно, а на подвале из сложенных шестерёнок купается в безответственности мой прах или дым сигарет, которым укутался я в одеяло и продолжил спать, не осознавая, что это не сон, но был твёрдо уверен в этом. Увидел я маршируют люди, прищурился, а это и не люди вовсе, всё те же муравьи в своих картузах играют в дурака, кто прав не знаю, наверное, Бог, но это ничего, мы же не сможем так долго, не протянем, поэтому канат перетянем, навалимся силою, перетянем, не переживай, а что стало с кассиршей слушай дальше. \nОна ошалела и вылила на меня свой неношеный сюртук со словами:\nТебе чего негде погреться? Иди! \nА сама ушла, ну я дальше падать начал, а когда пришла назад я вроде как успокоился, зажал между рук небольшую металлическую трубку и побежал прочь, всё так же падая и спотыкаясь, как бы это грубо не звучало, но на деле я никуда не уходил, я всё так же падал, а кассирша тут не причём, она просто муравей, как звёздное небо, как первые лучи солнца, ничтожна и способна на деторождение\n\nИстория полностью правдивая, я ничего не выдумывал, все в этой истории пострадали, а также это всё художественный вымысел, но всё-таки правда!"},{"date":"09.07.2019","title":"***","titled":true,"body":"Опять у меня с волосами полная гименопластика, сложные метаморфозы обдувания растительной сущи, всевидящее желобовидное приучастие, натянутое на линейку дня, морифальные дисперсионные волны длинной частоты и неизвестной глубины Чувашии и южной Осетии, анализаторы рыбных дренажей, забавные сумасшествия и платочки, гороховые неодноразовые чехлы на помидоры, неуклюжие баллончики с сухой шириной и беспросветными ганглиями неузнаваемых шестов и адвокатов, катящихся под мензурные лотринатные границы Глеба и Степана, окружённые полной незабывчимостью, миндальные шуршания придавших веянью еремеев гломиллы, маятниковые сравнения и душевные переживания. \n\nПереживания за душу. \n\nШторы размером с апельсин, шершавые возмездия полноправных, жестокие огурцы ожидания и затравки смелых огуречиков, злые и смешные головоногие, прячущие своё бытиё, за скатертью, ведущей в неземное существование трилобитных траурных затейливых дощечек, триумфальные салюты и невинные трепещущие закаты на кровавых берегах звонкой тревожной пыли, мстительные и сокрушимые династия могил, шепчущих древесные колокола и прочие вкусные радости нежизни, говорящие пегасы и многие другие обитатели подтрамвайных путей, жёлтые словно грабли жнеца одуванчики...\n\nНеспелые и не созревшие, но распустившиеся одуванчики."},{"date":"09.07.2019","title":"***","titled":true,"body":"В огороде\nНаш Семён \nСемён\nСемён Степанович \nСтепанович Семён \nТретью смену долбит\nДолбит молотком\nДа по наковалищу\nСвой топор\nНаш топор\nНаш, свой, как Родина\nА она одна, одна\nДа....\n\nА ещё вот на днях\nБуквально вот в полночь \nВ пол третьего ночи\nНа охоту собрались\n\nДа там у нас есть ещё \nОдна баба\nБабёнка\nМаргарита \nМы на неё не глядим\nНе смотрим, но когда видим,\nВсегда она одежду\nСтирает\n\nА когда стемнеет идёт в сарай\nСырой сарай\nВино есть, сыра нет,\nХлеб есть\nОна нам \nДаст воду\nДаст нам воду \nНет, не пить\nНе пить, а смотреть\nСмотреть, смотреть"},{"date":"09.07.2019","title":"Аполлон","titled":true,"body":"Аполлон был не самым любимым в семье, но после того, как он сбежал из дома, вся его жизнь пошла наперекосяк, и стал он в конечном итоге уличным певцом.\nЗабавно, ведь слуха у него нет, да и гитару, найденную на мусорке без одной струны, настроить не мог он.\nНо играл каждый день и страдал, как страдают все люди из-за неудач, но всё же и не так плохо было ему. Он просил других людей помочь настроить ему гитару, но кто подойдёт к такому, мягко говоря, неопрятному человеку с хриплым голосом в свои 31. И видел он много женщин, и влюблялся, а потом это вроде как проходило. Но дело не в этом. Сутра к нему подошли двое и потащили за угол. Ему вкололи что-то в вену и дальше всё как во сне. Проснулся он на кухне в доме с заколоченными досками окнами, через них так и пробивался тёплый утренний или вечерний свет, (не понятно было). Очнулся он за столом, напротив был магнитофон, ну он вытащил батарейки оттуда и начал размышлять: \"а зачем мне эти батарейки?\". В конечном итоге он решил, что две батарейки, работающие в синергии значит единство, дуализм во всём и что только работая сообща можно добиться высоких результатов. Но эти мысли не имели никакой реализации для Аполлона, поэтому они были бесполезны. Пооткрывал он ящики в поисках еды. Нашёл твёрдые макароны и болт с очень странной резьбой. Болт выкинул, а макароны оставил. Теперь бы ему только сварить их... нет кастрюль, сколько бы он не искал. Встал и начал ходить по комнатам. В доме оказалась черепашка, ну он перевернул её, но подумал, что животных убивать очень мерзко, да и ножа у него нет, начал искать дальше с черепашкой в руках. Зашёл в ванную, увидел ванну, и уже думал принять душ, как вспомнил про черепаху. Он поместил её в ванную, а из её рта вылилась какая-то жёлтая жидкость, и маленький ключик. Подобрал он ключ и пошёл дальше, подумав, что не особо хочет он есть или мыться. Отворил ключом входную дверь и вышел, пошёл куда глаза глядят, дошёл до прежнего места своего и понял, что уже вечер, но нашёл свою гитару и запел как не пел никогда."},{"date":"09.07.2019","title":"***","titled":true,"body":"Сергей Алексеевич\nСергей Алексеевич \nА кто такой этот ваш Сергей Алексеевич \nНепонятно"},{"date":"09.07.2019","title":"Охотник","titled":true,"body":"Лежу на кровати в темноте. Чувствую согнутой в колене ногой что-то металлическое. Почувствовав опасность резко убираю ногу к себе. Капкан! Он захлопнулся. Что это? На меня охотятся? Я что зверь какой? А может я охотник? На каких зверей тогда? А что, если я охочусь не на животных, а на человека или других существ с осознанностью себя? За это же наказание? Статья? Но больше, наверное, наказание перед богом, это же грех? А что, если я поставил капкан в дом медведю и забыл про это? Если он сейчас придет и скажет басом: \"КТО СПАЛ НА МОЕЙ КРОВАТИ?\"? А потом уляжется на неё? Вот тут-то я его схвачу!!!! Я резко спрятался под кровать. Забыл установить капкан.\nЧто ж, забудем про медведя в таком случае, навыдумывал я себе всякого! Какой же из меня охотник?! Точно не охотник я! Хотя и охотник... я охочусь сам на себя? Что я сделаю с собой, когда поймаю себя? Зажарю? Съем? Как та змея, пожирающая сама себя? Что означает этот символ? Саморазрушение? Или всё намного глубже? Возможно, это символ вечности, то есть я вечен? Может это замкнутость? Я замкнут получается? Возможно, это цикличность или движение, значит я не занимаюсь саморазрушение, ибо это противоречит самой природе. Ну хватит глупых размышлений. Устал я. И улёгся на ту же кровать, а потом и заснул минут через 7 или 9."},{"date":"09.07.2019","title":"***","titled":true,"body":"Ни всласть, а в усласть"},{"date":"09.07.2019","title":"Приключения Дундука и бурундука","titled":true,"body":"Недавно было дело:\nДундук и бурундук-\nДва друга собрались.\n\nОдин из них ржавеет,\nДругой нахмурил нос.\nКому какая роль- нетронутой вопрос.\n\nДундук пришёл к сестре дундучке,\nА бурундук к своей знакомой - щучке,\nОна дала им направленье:\n\nИдти на север, к трём морям\nПришли они, и видят там:\nШалаш на дереве висит.\n\nСпустился к ним не друг - \nСпустился к ним Фундук!\nС охапкой розовых подруг -\n\nНемых отважных пчёл.\nЗвеня жужжалками, они,\nПошли топтать ногами пол,\n\nПостроилась из льда дорога.\nДундук спустился понемногу,\nА бурундук остался сверху,\nПонаблюдать за тем орехом.\n\nНе заподозрив обостренья,\nГерой решил не брать соленья, \nА направляться дальше, к другу,\n\nДогнал его и понемногу\nПодтаивать начала дорога,\nА впереди - пустырь.\n\nСмотри, тут тишь, да гладь,\nСмотри, на небо глядь!\nТам в далеке нырнула птица!\n\nДрузья, растопырив лица,\nСмотрели, как та синица\nПарила в небесах.\n\nСпустилась, наконец, и начала:\n-Я ваш гонец..\n-не нужно нам гонца!\n-и так я без конца?..(-пожаловалась им синица.)\n-да замолчи, тупая птица!\n\nИ птица улетела,\nИ весть с собою унесла,\nА впереди, да без конца..\n\nДорога шла своим путём.\nА небо так же голубое\nСветилось солнцем, как костёр.\n\nНашли герои наши санки,\nЗабрались вчетвером,\nИх двое же там оказалось,\nВели они и одновременно катались.\n\nСпустились к краю света.\nДундук и бурундук признались:\nСвета!\n\nОни узнали в образе вот этом\nСвою подругу, верную супругу\nИ вроде как вдову.\n\nЗашли они в водý\nИ оказались так в аду,\nСмертельный грех их ждал.\n\nДундук убил Бурундука!!\n\nНо не за просто так,\nОт глупости своей.\nСхватил верёвки от саней \nИ обмотал надёжно друга,\nЧтоб не свалился он в котёл,\n\nА там везде шалила лава,\nНа третьем на кругу.\nКто их туда тянул?\n\nНаверно, чёрт за ногу...\nНе брал соленья друг!\nИ не жевал фундук! \n\nПустил их чёрт, а дальше \nПриехали к Наташе,\nЗаехали к Андрею,\nИ дальше в путь, на Бакалею!!\n\nПриехали они к Луке,\nЛука пожарил лук, ведь жарко там вокруг,\nИ начал угощать.\n\nДундук не принял угощенья.\nСказал: \"хватило нам соленья!\".\nИ покачавши головой, он сел на санки.\n\nПоехали, а бурундук гундит\nИ мямлит чёрте что,\nКак будто видит - дед его горит.\n\nСошли герои на восьмом кругу.\nВот ужасы творятся,\nГлядит дундук на бурундука тот начал задыхаться.\n\nНе понял сразу друг, как поживает бурундук,\nИ развязал его.\nСпустились они ниже и видят:\n\nМост кинут через ад\nВ эдем и райский сад.\nПоплыли на санях и убежали на конях,\n\nСкакали 75 дней.\nПришли к одной косой улитке.\nТа им сказала:\n\n\"Что я вам,\nКакая шоколадна плитка? \nИдите лесом, шершуны!\"\n\nВот это нас с ним поразило.\nИ я, как настоящий бурундук,\nКуснул её за пухлость губ.\n\nТа закричала: \n\"Помогите!!!\"\nДундук помчался за сестрой.\n\nПока она пришла,\nУлитка та сказала мне:\n\"Ты должен быть уверен в том,\n\nЧто всякий раз, когда ты слышишь звон,\nГлухой как отпечаток,\nВернуться на гору с детьми, \n\nПроведать старую Лилит,\nНадеть моё сапфировое платье\nИ прокричать:\n\n\"Калигумати!\"\n\nТы понял, глупый червь?\"\n-Я не червяк, я бурундук,\nУслышал я про твой недуг.\n\nЯ справлюсь с этим получением.\n-Ты бурундук? Я думала, что ты паук! Ха-ха\nГлухая сваха отвращенья.\n\nПришла сестра бурундука.\nТа женщина в кровавом платье, одним лишь взмахом небольшим\nНамазала на рот улитки то соленье.\n\nТеперь она горит в аду,\nКипит и плавится, ах, эта седина...\nБелёсая, но вовсе не плохая.\n\nКоптят герои наши \nВ воде из-под фонтана кашу\nСедьмые сутки напролёт.\n\nОпять та птица им орёт: \n-послушайте ж меня!\nСестра бурундука мертва!\n\n(Примечание автора:)\nНаврал я вам о том, что бурундук \nЗадушен был бы дундуком,\nЕго ждала другая участь.\n(Конец примечания)\n\nПод флагом жёлтым, аки царь,\nСнизошёл к ним сверху псарь.\nСпустил собак и барабак,\n\nПошёл на них горою,\nНо наши верные герои,\nВсю волю взяв в кулак,\n\nУдарили его по коже,\nНе ожидая, что вся кожа будет в дрожи.\nОт страха отойдя,\nПопятились они назад, затылками на псов глядя.\n\nДундук сказал: \"опять я говорю: \"что ж нас позвали, я пойду\"\", -\nА бурундук ему кивает: \"отнюдь, мне мало рая\".\n\nПошли они потом и выше, дошли до первых до ворот.\nИм шепчет царь болот\nСвоей ухмылкой липкой:\n\n-Ну что же, добрались?\nКакие молодцы вы!\n-Да мы вот только по пути, к тебе зашли, привыкли.\n\n-Кого вы ищете, кого на этот раз?\nНамокли уши у друзей\nЗелёной скользкой тиной.\n\nНе обещав ни капли мёда,\nПошли они уже к порогу,\nА там их встретил Бармалей.\n\nНамазов пальцы глиной, проснулись через дверную щель внизу\nИ убежали прочь.\nТак, не смогли они царю помочь.\n\nБежали ночь, бежали день,\nБежали ночь, и прибежали в тень\nОт дерева - Fraxinus.\n\nКогда настало утро, пошли они опять на север, через храм,\nВернулись к трём морям.\n-ты погоди, \nопять нам заново брести? - \nДундук неспешно замечает\n-Молчал бы ты, а то на всём пути \nВсегда на север выбирал идти.\n\n-Ну хорошо, - герои помирились,\nА там зашли они и к Фундуку,\nТот принял их с соленьями и мёдом, \n\nИ пчёлы стали чай варить\nДля новых чужеземцев,\nИз гнёзд стал бить ключом\nТех гроз чья жизнь была мечом.\n\nПерекусив и пообедав..\n\nПообещали, что в другом походе \nИх взор направлен будет вроде \nНа всяких там юродивых,\n\nИ не пойдут они уж больше\nНа север к трём морям,\nНи на восток в те дебри и пустыни.\n\nНа юг, наверное, пойдут, \nТам холодно и нету брюк\nНа западе всё хуже, \nНо там и двери уже!\n\nОстались возле дома.\nДундук и бурундук,\nУ ясеня уселись трое.\n\nСтать ждали,\nЖдали стать,\nЖдать стали в общем, стали ждать.\n\nПождали, может, 3 часа, \nА там увидели себя,\nВсё разъяснили и сказали: \n\nВы псарю лучше дайте колбасы,\nА той улитки подари часы.\nЧтоб знала, что придётся ей\nПолзти через преграды из шмелей \nИ прочих черенков.\n\nКундук настырный говорит друзьям:\n-Мы поняли, но ты скажи, нам к трём морям?\n-Да, вон туда, на запад вам,\nУвидите вы пышный стан,\nА там рукой подать до чужеродных стран- \n\nИ разделились. На нуль делить нельзя!\nПримерта же плохая!\nРукой махнули господа,\nДа и уселись у костра.\n\nВсе песни пели они хором,\nПотом запели вдруг минором\nИ басом небольшим,\nА дальше будто рёв машин,\n\nБольших невиданных созданий,\nИ больше всех переживаний\nПропели вдруг они.\nПогасли в доме все огни,\n\nВокруг всё начало смеркаться.\nЛегли они в кровать и начали брыкаться.\nКогда же стало тихо,\nУвидели луны округлой лико.\n\nИ пожелали доброй ночи всем,\nА там...\nЛуна спустилась к ним, да и уселась рядом.\nИ начала глядеть на них своим немым и добрым бледным взглядом."},{"date":"21.07.2019","title":"Четвёртая (дочь)","titled":true,"body":"Бам с двухстволки солью в зад!\nИннокентий очень рад,\nС хлебом с солью провожают,\nВот в чём соль - она рожает,\n\nТужится изо всех сил,\nЖдёт, чтоб муж газон скосил.\nИннокентий очень рад,\nПосадил малину в сад.\n\nБьёт лопатой по лбу он,\nРаздаётся тихий звон,\nРаздаётся тихий стон,\nПриукрасил боли он.\n\nРодила ему жена\nНи то сына, ни то льва,\nНи то старого котёнка,\nНи то пёстрого цыплёнка.\n\nНету глаз у петушка.\nПоднатужилась она,\nВышел следующий потомок,\nВесь совсем уж не ребёнок.\n\nТретье чудо вышло следом,\nОбозначился он дедом.\nВместе начали плясать\nИ не громко подпевать:\n\n\"Мы все дружная семья:\nСын, отец, да братец, я\"\nИннокентий очень рад\nТри ребёнка - сразу в ад.\n\nПоплясал и начал петь:\n\"Ой, а сын мой любит плеть,\nТретий сын не любит грома,\nА второй уж сын коровы.\n\nТретий сын как из воды,\nВышел весь и ест плоды.\nМладший весь уже одет\"\nНачинает петь нам дед:\n\n\"А второй он самый младший,\nУ второго почерк страшный - \nБудет жить у короля \nБудет медленный как я.\"\n\nСловно жёлтая росинка,\nБудто яркая картинка,\nВсе собрались за столом:\nЯ, отец и сын с котом.\n\nПочивали рано утром,\nНочевали будто в день\nИ пришли на перестрелку.\nСели в место, там, где тень,\n\nТень от дерева большого,\nГде цветы и трàвы пахнут,\nГде на розовых качелях\nСохнут медные цепочки,\n\nТам сидят четыре дочки,\nСтавят запятые, точки...\nВ целом радуется глаз.\nОн блестит, блюдя намаз.\n\nОн намазал горе спичкой,\nОблизнул и всё он сжёг,\nСловно глупые лисички.\nВсё бесстыдник подожёг,\n\nПол как лава, весь горит,\nСтены - сточная канава,\nНизкий карлик жизнь молит,\nНи малину, хоть крыжовник\n\nИли кислую капусту,\nВсё одно, чтоб было пусто,\nЧтобы ярко дом горел,\nЧтоб нос ночью не сопел,\n\nЧтобы на ночь сказку спел\nПро трёх братьях и отце,\nПро того, кто был в конце,\nКто был тот немой пират \n\nПревратил всю землю в ад\nИ поджёг тот дом из спичек,\nОн сгорел, а карлик сник,\nУвидал он божий лик.\n\nВ этом кроется мораль - \nКому соль, кому медаль.\nВсё пропел и сел в тени,\nСлёзы по щеке текли.\n\nКто не слушал мой рассказ -\nБудет слушать сотню раз,\nБудет спотыкаться ночью,\nСтанет сам четвёртой дочью."},{"date":"01.08.2019","title":"Дождь пошёл","titled":true,"body":"Зеркало.\nЗыркали\nЗорко.\nЗаперли.\n\nЧерез час признались - (дождь пошёл)\nНе любят тушёные овощи.\nСкинули лишню плесень -\nПошли кататься по пастбищу.\n\nНакрыл настил,\nНосил настил\nНастил из сена!\nУпёрся в стену.\nИз сена крест свил \nДочек своих покрестил\n\nТравил шутки и муравьёв,\nК ночи заперся в скворечнике.\nСкворечник в виде сердца,\nА сердце в виде печени или селезёнки.\n\nКак светало,\nКогда Светило уже совсем светило,\nПереложил 4 уголька в левый кармашек\nИ дальше, спать.\nЖуть.\nСиняя стать,\nДа морская гладь \nКуда ни глядь\nЛишь бы кровать,\nНе любят сиять,\nЛюбят лежать,\nЛюбят сидеть,\nЛюбят кипеть,\nЛюбят рис и журавлей.\n\nДедушка мороз,\nКрасный твой нос,\nТы до щук не дорос,\nЦеловал нас в засос!?\nЦеловал зверей и брызгал слюной.\nТы не уж то какой-то больной?\nНо ты ведь большой,\nСловно парень с косой,\nСловно навзничь упал,\nДедушка мороз.\n\nСтихи должны быть такие, чтобы если их и кинуть в окно, то стекло должно разбиваться? \nИли, если захочется, в лицо всем плеваться?\nВ конце концов надо ж ими восторгаться!\nНе ругаться!\n\nПри жизни не выделяться..\nЕсли надо будет - при смерти споют,\nНе надо будет - промолчат\nВ тряпочку или как в немом кино.\n\nЧесать шерсть всегда в одном направлении,\nНикогда не брать и не кушать соленья,\nПростить в себе самурая,\nСкулить мол мало рая,\n\nНаплевать на звёзды,\nЭто же не плевки.\nВылавливать сетями,\nЗабыть про поплавки!\n\nТянуться к свету,\nСкрипеть, но не давать совету.\nНикогда не прощать ни одну Свету\nТревожиться от последнего месяца лета.\n\nНикого не любить.\nЛюбить - полюбить сеньор(у/а)\nБыть льдом под ногами майор(у/а)\nОтдаться земному простору\n\nТратить греховные пропуски,\nСжигать все номера\nЗабывать про нонсенсные отпуски\nГудят не провода!\n\nГудит вся вода,\nИ воздух, и ветер,\nИ стаю пернатых заметят,\nСольются тела.\n\nНальются фужеры,\nСедьмые споют небеса,\nОтдадут честь все офицеры\nЗашептают везде голоса\n\n(На одном языке \nНа понятном всем языке)\n\nТревога звенит,\nЛьётся смола,\nЛёд горит -\nГорит вся вода,\nГорят провода,\nВсё теперь пелена.\n\nВьются в печени клубки,\nНа улице трутся голубки,\nНа розовом, здоровом языке,\nНа языке птиц, общаются так.\n\nВыговорить не могу,\nПрижимаюсь к потолку,\nКрутится на языке, как в печени клубок\nНемыслимое на языке, крылья сразу вбок.\n\nНа понятном всем языке...\nУбаюкают деточек:\n\n\"Мы дадим вам салфеточек,\nМы дадим вам конфеточек,\nНе дадим вам тропиночек,\nИ прочих понятных крупиночек.\"\n\nТолько одних лишь картиночек,\nКрасных и розовых лильечек,\nБез фильтров и линз,\nВлез в лес, да вниз.\n\nВлез через окно,\nНа запад окно -\nНа север стена,\nБьётся о стену - ...дурной горох видимо\n\nНе развивай рот,\nБудь слеп как крот,\nБудь кастрирован как кот,\nСтой, всё должно наоборот!\nПринять свой новый оборот,\nВстретятся двое у ворот,\nБудут писать стихи и песни,\nБудут всё делать вместе.\n\nВ единое целое сплелись пауки,\nРасшатались мои сапоги,\nВстала Га на каблуки.\nКричат они все: \"помоги!\"\n\nТапками бить бесполезно -\nСвойства системе вредят,\nТраур желтеет как бездна,\nОт этого ноги гудят.\n\nГудят не провода,\nГудит в душе вода,\nГудят всюду голоса,\nГудят ноги и небеса."},{"date":"10.08.2019","title":"Обо всём понемножку","titled":true,"body":"Я люблю нарушать\nТретий закон Ньютона,\nЯ готов отдать за слона золота тонну.\n\nСлоны скоро вымрут,\nСловно старая мымра,\nСловно половая тряпка\nИли ржавая тяпка.\n\nНа солнце, в грязи,\nВ подвале, в тени,\nНа восьмых небесах\nДень ночью запàх.\n\nТри колокола\nКошка вылокола,\nДа с собою поволокла,\nХоть режьте проволоку.\n\nГляди на гербарий,\nПовис в немоте,\nКакой-то церкарий,\nБредёт в темноте.\nБредёт с топором,\nИ воды ведром.\nТвердит сказки,\nОпрокинув салазки,\nСтроит ласково глазки\nЧуть что - притворяется каской,\nПокрытой рыжей краской.\nСнимает он маску,\nСтановится пресным,\nСтановится тесно,\nКак грецкий орех,\nКак новый грех\nВетром распят\nГусениц в ряд - \nСтрой из опят,\nЛюблю я парад!\n\nКривые глядят на меня сапоги,\nШуршат под деревьями дней колпаки,\nВ окопе прячется Евдоким,\nГоворит, мол вокруг мудаки.\n\nШьём, по паре каждой твари,\nПьём, чтоб не пусто было в баре,\nДавим вошь,\nРемонтируем брошь,\nКриво смеёмся,\nОт всего на свете прёмся,\nДруг о друга трёмся,\nЛьёмся, льёмся!\n\nНе люблю слонов,\nЛюблю пироги\nИли мои сапоги,\nИли навозных жуков,\nИли стервозных быков,\nНо не злющих клыков,\nКлыки, как и деревья\nОтбрасывают тень,\nА я в этой тèни будто день \nБудто сам я женьшень,\nМожет стать сапогом?\nИли розовым слоном?\nМожет малою медведицей?\nЗвёзды вроде, как и светятся,\nВроде, как и видятся,\nНо никак не трудятся,\n\nНе пахают, не поют,\nТолько свет свой льют,\nЗадыхаются и пьют,\nПьют настойку имбиря\nУ великого царя\nУ глашатго, зверя.\nРядом с приоткрытой дверью\nГде-то в сумраке и днём\nЗвёзды кажутся пьяньём,\nЗвёзды кажутся зверьём,\nВедь..\nМедведь\nВсё та же плеть \nТе же мускулы, вторая треть.\nВ принципе плевать,\nНельзя использовать сеть,\nВыржавела медь,\nВыкатился глаз,\nЦветочный показ,\nНовый окрас\nПринял каркас,\nНовый денёк \nУвидел зверёк.\nСтал на ноги шут,\nТакой он Плут,\nГоворит всем \"put\",\n\"Положи на место кнут\"\n\nРавная тоска, \nКислая треска..\nПотрескалась,\nПоистёклась,\nМаслом намоклась\nТрещины сохлись,\nТрещины рвàлись,\nМялись...\n\nБрели двое по скалам,\nЗалезли в пещеру,\nНашли там химеру,\nНашли там утюг\nИ Великий Устюг.\nТри четверти хлеба,\nМои сапоги,\nИ целую кучу холодной пурги.\nИ вроде пурген\nДавал им Вазген\nИ Гришку с четвёртого,\nГальку с восьмого..\n\nА может быть \nДевятиэтажки \nСделаны по подобию ада? \nДевять кругов - девять этажей.\n\nГде тогда рай?\nМежду острых ножей,\nГде-то в глине пажей,\nУ дверей, коллажей,\nУ колючих и милых ежей.\n\nРай внутри, словно дырки у сыра,\nТам, где рожают опять Бога сына."},{"date":"15.08.2019","title":"Старость Дундука и бурундука","titled":true,"body":"Сидят они теперь,\nОт старости гниют,\nТрясут чехлы свои\nИ вина пьют.\n(И рассуждают)\n\n-А ты, Дундук,\nБыть сыном хочешь чьим?\n-Бычьим,\nА ты, мой друг?\n-А я..\nХочу быть птицей,\nНе той совсем синицей, \nА розовой жар птицей\nИ жарить шашлычки,\nГотовить кабачки,\nСтекло переплавлять в очки,\nГлядеть себе в зрачки,\nДуши некое отраженье..\n\nВот если был бы ты быком,\nИли, как минимум, коровой,\nВсю жизнь стоял бы столбняком,\nНе зная ну хоть песни новой.\nВсю жизнь в полях,\nЗабыть о морях,\nЖевать траву,\nНе знать о извержениях вулкана,\nПод предводительством полкана\nИ чёрной собачонки \nЖевать траву, она уже в печёнках,\nДостанет уж тебя.\nА вечером погнал бы в стойло,\nНу ты скажи,\nОно того бы стоило? \nВедь лучше как стрижи,\nВедь крылья как ножи,\nОни порежут воздух,\nОттуда брызнет кровь\nИ где-то жук-навозник \nПрикатит нам любовь,\nПрикатит нам коней,\nЗверей, людей и лошадей,\nПрикатит одуванчик, \nСлепой как пятилетний мальчик,\nСлепой как не нарочно порезанный вдруг пальчик...\n\nО чём я?\n\nАх, метель...\nПошли скорей домой, а то олень \nПридёт опять и станет мять \nНас как мешки, которые хотят сиять.\nПошли, не дело тут стоять.\nА чтобы не было ему так грустно,\nМы сделаем ему сюрприз,\nИсполним мы царя каприз,\nОставим на крыльце капусту,\nЧтоб мял он наше подаянье.\n\nВдруг прискакал олень,\nРаздвинул ноги, \nПрищурился немного,\nПринюхался из-за незнанья,\nИ стало тлеть его сознанье.\n\nИ первая оленя треть\nВдруг превратилась в кожаную плеть \nИ стала плеть плевать\nНа чистую кровать,\nНа всех, на четырёх детей,\nНа бога сыновей, \nНа Маргариту и на Стёпу,\nНельзя такому вот растёпе \nПлевать на всех, тут ведь не тир,\nНе богохульный пир\nТут рай земной, \nТут не улиточий трактир.\nТут люди зрелые, \nХотя и не особо смелые,\nНо всё же люди, \nНельзя их так пугать!\nИ перестала плеть плевать.\n\nВторая треть оленя \nВдруг стала силой - ленью\nИ стала всех пугать,\nВсе повалились на кровать,\nДруг друга перестали узнавать,\nИ в целом бытие осознавать.\nОбплёвано всё плесенью и плетью,\nЧто делать нам вот с этим благочестьем?\nСил нет,\nНет страсти, нет желаний,\nЛишь горстка жизни подаяний\nВ виде капусты или той плети,\nНо не рыбацкой сети,\nВ ней рыбки по незнанью,\nПо общему признанью,\nИз-за подводного царя.\nИ ни какого-нибудь там Посейдона,\nА лишь из-за рыбёшки с дона,\nВедь царь не должен быть влюблённым,\nЦарь должен сам быть подчинённым,\nНу или на крайней случай не учёный,\nА всякий там простак\nИль от народа холостяк,\nКак в век двадцатый или же четвёртый,\nНо не люблю я про политику молоть,\nМне просто лень, чтоб встать и прополоть\nВсе грядки с овощами,\nВ конце я дам им завещанье, \nРазъедутся с моими драгоценными вещами,\nА потом...\nНет, не встретится сегодня мне с котом -\nЯ опоздал,\nСовсем не этого я ждал.\nНо это ведь олень! \nА от чего тогда мне лень? \nВедь надо взять себя в кулак,\nИ как ударить им в пятак..\n\nЯ сделал так.\n\nЛень перестала,\nНо третья треть настала,\nТеперь всё тёмно стало,\nНе вижу ни черта, \nХоть и стоит то рядом,\nНе уловить его одним лишь взглядом.\n\nТеперь нужно другое мне оружье.\nСмотреть не нужно, нужно видеть,\nГде пробегает мышь,\nГде мне старуха крикнет \"кыш\",\nНадену я тогда камыш,\nПрикроюсь листьями его\nИ станет мне светлее от того.\n\nКак только крикнула старуха \"кыш\",\nПоймал за руку я ланды`ш,\nОн говорит: \"я лишь\nМалыш,\nНе трогай ты меня, услышь..\nОлень пристал ко мне, подлец.\nНе знал он, что я жнец,\nНе стал я ждать, как вы тогда\nИ стала у оленя борода,\nУспел он высунуть копыто\nИз моего пшеничного корыта,\nКоторым я запасся, чтоб зимой \nБыл я как свой,\nЧтоб торговать им,\nЧтобы жить,\nИначе нам, жнецам придётся стыть \nОт холода или от зноя.\nЯ не хочу, чтоб знала душенька моя покоя,\nЯ не хочу, чтобы горели руки\nИли мои престаренькие брюки\nТелесного оттенка...\"\nОпять, горох об стенку!\nМне слушать надоело!\nКак по доске ты белой мелом\nВсё чертишь чёрта, да черту\nИ весь уже в поту, \nЗамолкни, ландыш, ты достал!\nДостал из брюк я свой мангал,\nРазжёг костёр,\nУвидел мёртвых трёх моих сестёр\nИ испугался,\nНо потом собрался,\nНемного слёз набрался,\nОтвёз сестриц на место,\nЗатем месить я начал тесто,\nНе для пирожков,\nА для оленя и его дружков.\nТри дня месил, \nУ ландышà муку просил\nИ тесто приготовил.\nТеперь он спешился с коня,\nГлядит сейчас он на меня..\nХоть я его не замечаю, \nНо чувствую я привкус чая,\nЗелёного, прямо из кружки,\nВедь у оленя есть подружка,\nКоторая льёт привсем подряд, дурнушка,\nНе понимает, что там яд.\nОлень теперь почти распят,\nОлень теперь как горсточка котят,\nОлень как призрак,\nОн как клён, \nКак тень, как пантеон,\nЛежит теперь он при смерти\nКак крот,\nУпавший навзничь в грот,\nМолит теперь о смерти,\nО смерти он мечтает,\nНо жнец его совсем не замечает.\nЕго заметил я, \nТеперь я вижу как змея,\nКак ночью кот.\nПриблизился к оленю я,\nВоткнул в него копьё,\nИз раны вытек воздух\nИ ожерелье не моё,\nА видимо той старенькой улитки.\nНамазал тестом рану я,\nИ перестал он злиться на меня.\nВстал на ноги и поскакал к скворцу,\nСказать, что ждут его и приглашают ко дворцу.\nСкворец не осознал немного,\nНе ждал такую он подмогу\nПод ногой \nЕго кривой.\nУшёл олень и к вечеру вернулся мне домой? \nА посылал его на смерть, \nОн видимо опять ступил на земляную твердь,\nТеперь он вечно будет жить,\nА я представлен сýду.\nВедь чести нет ни в нём,\nНи в том, что дело было днём,\nНи, ваша честь, что был вообще я пьян.\nИ я прошу, ну дайте мне хоть шанс\nЯ не пойду на карнавал-с\nНе буду я под ухом петь,\nНу накажите, ладно, ну хоть плеть,\nМолю, не нужно от меня ещё одну вам треть.\n\nПришёл енот и говорит: \n\"Суд вынес приговор.\nСтрижу 5 лет за то, что воздух он порезал,\nСкворцу же смерть, ведь ею он не брезгал.\"\n\nСкворец впервые за сто с лишним лет,\nКак будто пережарил он омлет,\nИспытывал ужасный страх,\nКак будто неизбежен крах.\n\nТревожный сумрак,\nНочь его последня.\nОн думал ночью\nО своей внебрачной доче \nТеперь всё на своих местах,\nТеперь осталось лишь ему \nПринять свою лиловую судьбу.\n\nИ наконец пришёл вдруг Бог,\nЗасунул в рот скворцу горох,\nТот возмужался, встал, засох,\nОн облажался, лёг и сдох.\n\nНет повести прекрасней и чудесней,\nЧем злопыхатель, умертвлённый песней,\nКоторую исполнил Бог, \nЗасунув в рот ему горох.\nГорох как грех, \nКак нелегальный мех,\nКак шкура зверя дорогого,\nКлючей как связка кладового.\n\nГороховое семя \nДыру вниз прорвало,\nА там дыра, всё заросло.\nСпустился, а внутри\nВсе три\nКривые статуи и мальчик тот слепой.\nНу! Гей! запой, \nЗашелести, топни ногой,\nПусть выпадет девятка,\nПойдём играть тогда мы в прятки\nПрополем наконец мы грядки,\nНапишем завещанье,\nВ 12 соберём собранье,\nВзовём всех к пониманью.\nНе будем осуждать деянья \nСтрижа и соловья,\nА будем на своём стоять,\nИ песни наши напевать,\nВсё те же, старые,\nКак будто радостью пропах\nПиджак мой, превратившись в прах. \nИ стали вместе мы в горах\nПеть, пить, коптить\nИ радоваться жизнью\nПод звон сирен сирен\nТревожный, но густой,\nКак будто в сумраке совсем пустой,\nКак будто трезвый огуречик\nНе пожалел свого сердечка,\nКуснул и бросился он в речку,\nПотом зажёг там свечку, \nНашёл листок.. и ручку,\nИ написал: \"такая вот те штучка,\nТакая вот те печка,\nСтоишь, лежишь, и вот сама готова гречка,\nОвсянка, манка и пельмень\nИ чуток для костра его кремень\"\nХотя кремень тот был из магазина,\nОн бросил камень в ту же воду \nИ стал он командиром взвода,\nПристал к помойнику,\nА там лежат покойники,\nГниют себе, гниют, \nА ты поди, создай уют, \nЧтоб было весело и сухо,\nЧтоб не звенело в ухе,\nЧтоб всякие там незнакомцы\nХодили, не могли найти оконце.\nЯ не могу, я плавать не умею, \nВ воде я весь зверею,\nВ воде я пёс, в воде я словно Плут\nСлепой, как серебряный прут,\nЯ гнусь как вторник, как гроза,\nЗабыв совсем про тормоза,\nГоню на красный свет, а там лоза,\nЯ пробираюсь через виноград \nХоть тут дави вино, теперь я рад,\nНо поздно насмехаться, \nСовсем уж начало смеркаться,\nЯ взял коня и с Дундуком\nОбратно прискакал в свой дом,\nПовесил шторы и крюки,\nНо крюк повесил я суки\nТех веток\nСтарых и сухих.\nЖивые гнутся, им легко,\nУ них есть жёлтое трико,\nНе любят быть они рабами\nОни глупы, чтобы стать нами,\nОни не любят тихий час, \nИ громко всюду ведь сейчас,\nНо лично я,\nСчитаю, что коня \nНет лучше ничего,\nВсю жизнь свою коря\nВ душè бросаю якоря,\nИ страсть свою давно пленя,\nЯ сам весь обращаюсь в плен и пепел,\nВ зелёный страх, \nВо мрак\nВ неведомый и узкий грохот -\nСвоих коленей старых хохот.\nИ ты, друг мой, где же ты был? \nДундук, скажи, что пил?\nЧто ел? Что видел? \nМоже кто там тебя обидел?\nИли за что-то ненавидел?\n-Не бурундук,\nЗачем переживать, мой друг,\nЯ сам не знаю, может вдруг\nПойду я снова, вновь и вкруг.\nЯ видел девушку одну,\nИ даже прямо здесь, вон ту,\nСмотри, она и впрямь тут наяву,\nВсё смотрит вглубь она зрачков коту,\nНе то, что птице твоей жалкой \nКхе *кашлянул*, то есть жаркой.\nПрости, я что-то поперхнулся,\nВоды я что ли захлебнулся,\nИли за хлебом я немного потянулся,\nНо встал без хлеба и очнулся,\nПопятился назад.\nСовсем устар, глаза уж не глядят.\nПойдём умрём! Любимый друг,\nСгорел чтобы вокруг\nВесь дом и огород,\nТе кустики, что у ворот\n-Не рано? \nДавай ещё хотя бы ночь? \nА там, глядишь, да выйдем прочь \nНу так кàк? \n-Ну хорошо, хитрец, казак,\nТы прям какой-нибудь, резак\nС собою захвати, \nПорежем мы ещё ножи,\nПорежем доски и желанья.\nДля будующих сыновей.\n\nОпять же, пишет это бурундук, \nБумаги все кладёт в сундук,\nЯ лишь цитирую.\nНу ладно... я немножечко утрирую,\nНо я же честен с вами, \nНу да соврал разок, \nНо ложь для интереса,\nОна как сила Геркулеса\nНе знаешь никогда\nОткуда и когда беда,\nНо в этом прелесть вся в итоге.\nНаврал я вам? Нет, ни в едином слоге!\n\nНу вот, опять не знаю, чем закончить\nУж хватит мне сегодня стрòчить \nОставлю вам записку \nВ ошейнике у киски\nОна зависима от виски\nНо также не откажется от мелкой крыски\nПора кончать, \nА свет лампадки тусклой\nМешает мне писать,\nМешает мне мечтать\nИ клонит в сон, на необплёванну кровать,\nТуда, где неба гладь...\nКороче, я уж спать.\nИ ... если хочешь, могу тебе я рассказать,\nЧто ты, мой самый лучший друг\nИ ждёт тебя из-за меня Дундук,\nВзгляни ты за окошко, \nОн там стоит, махает понемножку,\nС тобой он хочет попрощаться -\nК себе уж надо возвращаться\nИ старость нам встречать,\nИначе нам печать\nПоставят, и печаль \nНе будет больше с нами.\nВ общем, желаю вам успехов, \nЧтоб не было в штанах прорехов \nИ всяких там орехов \nПо типу фундука.\nИ ни ирисок, и не маков,\nИ ни тем боле прочих шлаков.\nЖелаю радости, любви!\nИ рву я кривизну стихов дуги.\n(Всё это было в завещанье,\nТакое вот у них прощанье)."},{"date":"23.08.2019","title":"Песня про большого робота, стреляющего лазером и телепортирующего через четырёхмерное пространство","titled":true,"body":"Вчера я сочинил вдруг песню.\nВсё стёр, \nА вот на этом месте\nЯ записал сестёр\nМоих наивных разговор.\n\nСегодня нам по пирогу \nСготовят. Новый стал в роду, \nА радуги дугу\nСгибают словно провод\nИ гнут так-с тысяч сто годов,\nДля этого не нужен повод,\nВедь неразумен довод\nТот, что завтра будет снова голод,\nКак в прежние года,\nВедь раньше больше были голода.\n\nВот например:\nПлывут по морю моли\nИ ищут в нём хоть горстку соли.\nЕё навалом в мёртвом море,\nВ живом найдёшь лишь горе.\n\nИли такое:\nИссохнет скоро поле\nИ надо бы дождя,\nТеперь придётся звать вождя,\nЧтобы исполнял опять свой танец,\nЧтобы хоть тучки глянец\nПорадовал бы пресной нас водой.\nНа поле том взойдут цветы.\nИх запах заражён,\nИ будет всякий поражён,\nКто нюхать их посмеет.\n\nЯ встретил завтра Аполлонов,\nОни все были не людьми - \nБогами были, а в груди \nУ них был старый перстень,\nОни его хранили ради песен,\nЧтоб петь и не было ни плетен\nНи кустов, \nНи восклицания костров,\nВедь на тот остов\nПрикреплен ключ мостов\nВсех разводных,\nВесёлых, трезвых, молодых,\nИ в общем всех, кто кучерявый,\nКто бледный, а кто вялый.\n\nЛегко сказать зачем ты спишь:\nТы хочешь, чтобы завтра мышь\nВсё слушала тебя, ведь ты её малыш \nНи ел, ни пил, не абрикос -\nМатрос\nПортового ты городишка.\nОпять налить тебе винишко?\nНет, это уже слишком.\nЯ понял, что ты хочешь, друг,\nТы ведь не в поиске супруг,\nА заработать хочешь ты недуг,\nЧтоб на работу не ходить, \nЧтоб жизнь всю в счастье проводить.\nНегодный шут, \nВозьму я кнут \nИ отхлыстаю среду\nЗа то, что он моему деду\nНе разрешил быть тут к обеду.\nИди, дружище, обниму,\nНе уж то правду наяву\nИ не приснилось, щас заплачу \nОт в принципе отсутствия удачи.\nИтак, всё решено\nДавай ключи, куплю я решето\nОпять готовить макароны,\nЗато хоть не лизать поддоны\nПодносы и тарелки,\nДля сердца это мелко.\nИ вроде белая как пенкой\nВдруг начала расти коленка,\nСовсем уж стала как карандаш.\nЭй, врач, какое мне лекарство дашь?\nОт гриппа, СПИДа или кори\nЯ уж загнулся весь от боли,\nЗапнулся, поперхнулся,\nИ выкашлял поводья -\nЧертòвое отродье!\nЭх, теперь мне легче, я здоров.\nЭй, трое, вы, несите мне даров.\nТак-с что принесли?\nКакие-то соления? \nИз фундука варение? \nЧем мне лечить колени?\nТревоги, сумки, пароход,\nКоторый дул бы паром в рот.\nТеперь я понял, вы глупцы,\nГлупее вы овцы,\nВы знаете, кто мои отцы?\nОни играют на гитаре\nИ снова чередуют пары.\nЯ не внимаю ваши речи, \nВзвалили на свои вы плечи \nТакую дребедень,\nА я всего лишь болен, моя тень\nВсё ноет и гудит,\nИ сердце у меня в груди\nТвердит \nКак будто сам себе вердикт \nЯ вынес, как пожар,\nЯ погрузился в лезвие ножа,\nЯ стал как шествие пажа\nИли другого извращенца.\n\nКопайте яму, там есть кости,\nВ неделю чтоб было по 2 горсти,\nЧтоб процветало производство трости\nВ людя́х чтоб было меньше злости.\n\nЗаводы начали расти,\nИ стали больше золота нести,\nА золото переплавляли в стружку.\nИ из ребра ему вдруг захотелось и подружку.\n\nИ пусть та кость была на свете не одна,\nОдиннадцать их было, это выяснил солдат.\nИ создавать они подружек стали,\nВ итоге их 11 и сталось.\n\nТогда они вдруг стали все на четвереньки\nИ убежали, рвя свои коленки,\nТакая участь их, ну что ж,\nНа образ смелых спелых жён он мало чем похож.\nОн будто сжён.\n\nИ выбрались-то наконец они из леса,\nИ протянули им листок из новой пьесы.\nТеперьче эти псы всё будут нам плясать.\nЯ рад, но слово \"огорчение\"\nИмеет 3 родных значения.\nОдно - тюрьма,\nДругое - воля,\nА третье - радость от полей раздолья.\nИ неродные есть значенья \nВот например: \"соленья\" \nКогда взобрались на оленя,\nЯ уж ускакал в том направлении,\nГде радость, где светло от огорчения,\nЯ сразу смазал карту будня,\nПлеснувши краску из стакана,\nЯ обозначил краской судно,\nОно плывёт по океану.\nОно таращится, меня зовёт.\n\nВ сущности, бумажные и обычные деревянные корабли — это одно и тоже: и то и то делается из дерева, а оно растёт,\n\nНе как на дрожжах, \nНо как мой пинджак,\nКак флага стяг,\nВедь я пока что холостяк,\nМеня не проведёт и весь костяк \nВсех хитрых подлецов,\nЧто предали отцов\nИ над могилами что танцевали мертвецов.\n\nКак же я \nНи стою, но стоя \nНа улице и возле фонаря,\nНадев мой синенький наряд,\nПеребираю всех подряд \nЗверят.\n\nМне говорят: \n\"Кончай уже, а то мы сами тебя кончим,\nТы спать нам не даёшь уже какие ночи!\nТы призрак, ты кошмар,\nТы пустота, воздушный шар!\"\n\nОт слов чуть отойдя назад,\nЯ сел и продолжал,\nИ хоть немного, но успел, сказал\nИ вроде всё вам рассказал.\nЧего-то не хватает...\nУх, я устал, меня чего-то вдруг мотает.\nЯ полетел, всем до свидания, \nКогда закончатся моей души метания -\nЯ напишу."},{"date":"23.08.2019","title":"Рваные облака","titled":true,"body":"Рваные облака\nКак морю молока.\nКакая же корова\nДует облака?\n\nКакую же корову доят как быка,\nЗакованного абы как,\nНе как на поле Пастернак,\nНо как любителя клоак,\n\nКак в старомодных кабаках\nНа стаметровых каблуках,\nДержа фужер вина в руках?\nОн обратился в медный прах,\n\nОн обратил в вино корову,\nКота, енота, барсука,\nИх жиром он натёр бока\nИ выпил тот вина бокал.\n\nИ стал он матерью своей,\nВыращивал он сыновей,\nВыращивал он свёклу и свиней,\nТащил и связку золотых ключей.\n\nПорвал он связку на плече,\nСказал он самому себе: \"вот давечè..\nНе то, что нонече, \nДàвеча в травы меча...\"\n\nПогнул, прогнул полынь не в чёт,\nГлядит, вокруг река течёт\nИ солнце яркое печёт,\nНо надо к вторнику отчёт.\n\nСлизняком совсем был наш Иисус \nНо он как наш герой, вина он любит вкус,\nИзлечит и змеи укус,\nА также может он летать как куст,\n\nИли как ястреб, как струна,\nКолеблется, а её волна\nВсё пляшет, словно голова,\nТакая в всяком случае молва,\n\nНе я придумал это всё,\nОпять та мать себя пасёт,\nЕщё и плод себя несёт,\nКак словно будто поперёк\n\nОн лопнул стёкол пузырёк,\nПолилась кровь и требуха,\nТеперь готова нам уха,\nОна как ухо, как янтарь,\n\nКак муха, или спортивный инвентарь.\nИ начинает голова болеть,\nНе надо снова петь,\nПожалуйста, я не люблю терпеть.\n\nА я как поводырь, как лом,\nЯ сделаю - и поделом. \nОпять надел противогаз? \nГаз не подействовал, играет джаз?\n\nЯ удивлён, вы как матрос,\nВы как матрас,\nЯ спал недавича у Вас\nИ вот такой я сочинил рассказ,\n\nПро то, как пару раз\nТравил я муравьёв,\nКогда я был здоров,\nБыл я как бык, который из начала сказа.\n\nВот те и проказа,\nВот тебе салазы,\nЕзжай куда прикажет лес,\nВселён в тебя какой-то бес,\n\nЛучше б отсюда ты улез \nИ отступил, \nТы нам не мил,\nТы траву с нами не косил,\n\nНет в тебе заячьих ужасных страшных сил,\nНо.. если б ты вдруг попросил,\nЯ сделал тебе одолжение \nИ засчитал Иисусу поражение,\n\nОн не мед брат,\nОн уж и староват\nИ испоганен он как солнце\nЛампочкой в 100 ватт.\n\nВыстрою двоих маслят я в ряд.\nНа первый и второй их рассчитаю,\nНа стол накрою, цепь поставлю,\nА на цепи Щеночка положу,\n\nСкажу: \"ты гордый сланец, \nТы - непобедимый старец\nИ сколько в тебе требухи -\nНе быть тебе глухим. \n\nТебя все будут помнить вот таким,\nНесносным, словно серафим,\nНе будь ты эдаким, большим,\nВ тебе бы не было б морщин.\"\n\nВу ле ву\nКушег авек муа?\nИссохшую труху \nВо мне хранят века.\n\nЕё разжечь - мне хватит и искры',\nНо поддержать огонь и не сжигать мосты - \nЭто не просто,\nВедь нужно веточки кидать, \nПотом дрова, не просто так стоять.\nВсе угольки перебирать, убрать оттуда \nИ чтобы было безопасно, \nЧтоб я не сжёг ещё хотя б одно\nГустое дерево, тогда пробьётся дно.\nНам этого не суждено,\nПо крайней мере, не сегодня, \nВозьму-ка я поводья\nИ к речке прискачу во время половодья,\nОна меня обдаст, мне хвороста отдаст,\nСырой не стоит поджигать, он сам как пенопласт.\nОпять я весь намок, какое разочарование.\nНе смог и ниточку в иголочку продеть в сознанье.\nНо облака всё так же рваные, что ж за такое наказанье? \n\nВсё, решено, я отлучаюсь, \nОпять я вам стихами тут прощаюсь.\nНо это должен быть как вроде диалог.\nВсё, рушится мой потолок, \nА муза улетела спать в сапог.\nСпокойной ночи. Бог."},{"date":"23.08.2019","title":"Звёздное небо в одиночестве зимой","titled":true,"body":"Кацусика Хакусай\nИскусал весь мой бонсай,\nПокусился на него \nИ опять разлил вино,\nОн не смыслит в договорах,\nКому деньги - кому порох.\nХоть и безразлично мне,\nВидел снова я во сне\n\nЖивописный авангард\nТюрится, попал под град,\nОжидать не смог он это,\nЧто попал он под перо поэта.\n\nУх я сейчас такое про него вам расскажу,\nВы точно упадёте, я слова свои держу.\nНалил он в кружку слово \"пьяный\"\nИ пробормотал, но без единого изъяна\nОдно чудовищное слово, размером с обезьяну:\n\"Три сотни две, теперь обед, я сыт, я суп,\nЯ пёс, я плут, \nПлутон, Платон, земли я пуп\"\nВот так он и сказал, а я тем временем вскипел,\nМеня налили, я остыл и снова заскрипел,\nОпять и снова, всыпь да вспять\nОпять хотеть Христа распять? \nМне скучно всё, я не готов тут находится боле,\nЗнакомо это мне до боли,\nДо дрожи.\nМы остановились, похоже,\nО чём мы говорили? \nНе о вельможах?\nО моржах?\nО тех секретных этажах\nТринадцатиэтажек, \nКоторым не хватает ножек.\nЯ вам гороховая каша,\nЕшьте, пейте, только знайте,\nЯ не дамся вашей знати,\nЯ намочу собою платье\nИ выйду я из замка - знайте.\nТрубка мне звонит опять,\nВозьмёшь - и время вспять\nПойти идёт, ну а потом\nЯ ведь могу и сапогом\nДремать, шагать бегом,\nПо берегам,\nПо всяким там тайгам,\nТерять сто грамм\nИ в принципе жалеть\nО том, что выбрал я не самолёт, \nНикто меня хоть и не ждёт,\nА чтобы ждал, я должен быть у скал,\nОни все в шерсти, как поля,\nЗасеянные в тополях.\nКому нужна моя?\nКому, кому нужна кая?\nКому нужна лая?\nКому нужна ная?\nКому нужна шая?\nКому нужна жая?\nЯ не разум.\nТри.\nЛимонад без косточек.\nЗелёнка, йод.\nШпоры.\nЖёлтый стручок.\nСтрекоза без очков,\nЯ с горой кабачков,\nОни все в колпачках,\nА я в очках.\nЯ в сумке, я в бегах, я весь, весь я' весь, я!\nМеня ничто ни в раз таят...\nТак, получается не dance, \nПолучается, что декаденс,\nА это глупо, это резко, \nВедь надо плавно, чтоб без треска,\nНо чтоб все плакали как лейка \nКак чайник, ящик, помидоры,\nИ будто бы открыт сундук Пандоры,\nНадеюсь, лошадь у меня при шпорах, \nОни настанут нам опорой.\nО лошадях по многу говорить же можно,\nОни ведь хилые и с толстой кожей.\nИ в общем, чёрт с ним, я готов!\nОтдайте мне мой первозданный вид,\nМоя душа, и вся, и всё ещё горит,\nНе жарьте вы на ней шашлык, \nИначе у вас выбор: штык и клык,\nЯ дам вам что-либо одно,\nЯ разобью о вас окно\nИ суну в рот осколки, то стекло,\nПока ещё не истекло...\n\nВсё кончено! она исчезла!\nЕё нигде нет! я пропал!\nНаверное, я давно не трезвый...\nНо видно, я себя весь исчерпал...\n\nИдейность жизни и души -\nЮность есть - иди, греши,\nЯ призываю всех грешить, \nЯ разрешаю всех пугать, \nЗавидовать, и много жрать,\nПрелюбодействовать и сколько хочешь спать,\nЯ разрешаю, я душа,\nВо мне вселенной шар,\nВсё трансцендентное уж тут,\nВо мне, а на руке наложен жгут.\nЗабыть про что угодно,\nТворить свою погоду,\nПоить свою корову\nМолоком от коз\nИ прочих синеньких стрекоз.\n\nУже не то я говорю, я очень сильно уж расстроен \nПрости меня, читатель, \nНо я сегодня не внимателен\nК деталям или мелочам, \nЯ слаб сегодня, мне бы чай.\nИ чтобы кто-то рядом был и был бы май -\nВот рай, в себе всю суть таящий.\nА в даль, на одиночество смотрящий\nЯ.. забыл вкус жизни, чая настоящий.\nПлевать ли мне? Я не такой и слабый,\nНо жаловаться хочется всегда,\nТакие вот дела...\nА скоро холода..\nЗима уж скоро, я замёрзну,\nНадеюсь, хоть не простужусь,\nА то так хочется мне звёзды\nВсё наблюдать,\nИ наблюдать,\nИ... на...блю...дать........"},{"date":"25.08.2019","title":"Сходил в гости","titled":true,"body":"Я потянул за верёвочку, но дверь не открылась, верёвка порвалась, хотя и вставить обратно её можно..."},{"date":"29.08.2019","title":"Песок у пляжа горячий","titled":true,"body":"Мы звонко слёзами кричали\nВ моё отсутствие печали,\nВ шкафу висят изъеденные молью шали.\n\nВ воде лежат невода,\nВ неводах вдова,\nВдова под водой,\n\nУтопить печаль тоской\nХотела, грустно ей порой,\nПорой ей холодно одной,\n\nА муж её не мёртв совсем,\nОн ходит-бродит в окружении трёх стен \nИ говорит, что мир его тесèн.\n\nОдна стена закрыла потолок,\nВторую он и перепрыгнуть не возмог,\nА третья держит нить моток.\n\nОн взял ту нить, продел в иглу\nИ шить он шаль стал на полу,\nНо половодье проникло сквозь дыру.\n\nОн стал карабкаться на стены,\nШаль муж надел и вот взлетел он,\nЛетал по комнате, внизу плескалась пена\n\nИ море было цветом серо\nИ сыро было, муж был смелым\nИ начал засыпать он между делом.\n\nПроснулся - видит пред собой\nЖену, идёт и тащит тот комок с тоской,\nОн подошёл к ней, приобнял, и говорит: \"постой,\n\nВедь вспомни, нам нужно всем умыться утренней росой\"\n\n-Не нужно так ведь горевать,\nЯ здесь, я рядом, видишь я не вата,\nПойдём домой же, дорогая Злата.\n\nПошли они домой.\n\nОни уж были счастливы теперь\nИ сердце целым стало, стало словно дверь,\nИ открывается всё больше, когда весенняя слышна капель.\n\nВот, сказочке конец,\nМой дорогой юнец,\nПоплакать хочется мне, но я не рыба - я живец.\n\nМне плакать сложно,\nХоть слаще слёзы тех, кто помоложе,\nНо всё же.. \n\nНа конец, наконец,\nВсё это слушать может лишь жилец,\nВсё, стоп! Конец!"},{"date":"15.09.2019","title":"Привет, читатель!","titled":true,"body":"Совсем не знает резвая\nСтихия\nО том, зачем\nСтихи я\nВсё пишу,\nС собой перо с листом ношу.\n\nКому я это всё преподношу? \nХочу заметить, что себе.\nИначе просто так толпе\nНе нужно всяких оправданий:\nЗачем, и как и почему.\nЕщё один раз причиню\nКому-то что-то, чтобы стало\nВсё меньше, меньше, мало,\nЧтоб было всё навалом,\nСгребать чтоб это самосвалом\nИ всем чем можно остальным.\n\nНо сколько слов, \nИ сколько строф\nЕщё придумать можно,\nЧтоб основ\nВсё было больше с каждым разом\nПисать не вооружённым глазом,\nСмотреть на пол, на потолок,\nНа руку, нитей шёлковых моток,\nЧтоб прясть ещё, чтобы сказали: \"молоток!\"\nНо нужно ли оно, вот это одобренье? \nВозможно, кто-то чует в этом удобренье,\nИ дальше пишет, и живёт\nДуши вино всё больше льёт.\nКому-то пальцы или сон,\nЧтоб жизнь играла в унисон, \nМеня же тянет к чувствам,\nНо проявить их стало сложно\nВедь текстом мало можно, \nНо если кто-то плачет\nПо глупости, от счастья ли начал,\nЯ рад, ведь чувства много в жизни значат,\nНо только лишь такие.\nКороче, это вот стишок тому,\nКому совсем вдруг одиноко\nИ ну совсем достали тексты Блока.\nВедь это стиль такой общения,\nКогда мои вы сообщения \nГлядите так,\nВозможно даже с отвращением,\nДа даже перечитываю я когда такое \nНет в сердце с этим мне покоя.\nНо сочинять всё это стоит,\nЗанятно это и вообще...\nВедь так общаться можно с каждым,\nНо только если творчества есть жажда.\nКак говорится, жизнь - искусство,\nИ может, я пишу безвкусно,\nНо главное, что нравится писать,\nКак будто вся душа решила встать,\nДа плюнуть под ноги всему\nВедь нет предела наяву,\nДуша плюёт не ядом,\nДуша пленяет всех лишь взглядом \nИз зеркал глаз\nИ чудный декаданс\nОтступит, чтобы ренессанс \nНастал и провенанс\nВсего дурного в нас \nПогас,\nЧтоб розовый пегас\nОтдал нам чудо-газ...\nНо хватит на сегодня лишний глас,\nНа этом завершённым я считаю свой рассказ."},{"date":"15.09.2019","title":"Горошинка","titled":true,"body":"Незаметная горошинка\nЗахотела стать большой, как вишенка.\n\nГорошинка росла, тянулась вширь,\nНо рамки тела - зелёный маленький пузырь.\n\nУтух огонь в её глазах,\nУж скоро обратится в прах.\n\nНо вот пришёл художник без кистей,\nСъел вишню, всю, и даже не оставил он костей,\n\nГорошинка та всё страдает из-за роста:\nБудь маленьким и соблюдай все ГОСТы!\n\nВот так она и соскочила с места,\nБыть съеденным не хочется, ведь хочется ей быть невестой!\n\nОна и за муж собралась!\nЧтобы вырасти духовно.\n\nТеперь она не просто маленький горошек,\nТеперь она летит, пугает всех в округе кошек,\n\nЛетит крича,\nО том, что нужно крепкого плеча,\n\nЕй нужен муж,\nЧтоб был кудрявый и без луж.\n\nЛетевши, по пути увидела постель,\nПод ней лежала старая Нинель,\n\nТа ей сказала: \"летать ты будешь если,\nЛежать ты станешь, может быть, под креслом\"\n\nГорошинка и дальше полетела, она искала жениха,\nЛюбить его за то, что просто существует.\n\nИные спорят с ней, а третьи просто пьют,\nНе знают прелестeй корàбельных кают,\n\nНе путешествовали, на крыльях не летали,\nБоятся, мол, что это всё летально.\n\nНо как же, хочется любви\nИ воли ей не занимать, хоть сколько отруби,\n\nВсё бòльшую будет отрастать надежда,\nКак будто в ней гигантский вырос стержень.\n\nНо сколько не точи, не хватит тебе мòчи\nВсе стружки обратить чтоб в клочья.\n\nИтак, её история не с самым худшим из концов,\nНашла себе и мужа, попутно воскрешая мертвецов. \n\nКороче, очень интересный был рассказ,\nНо я его забыл, такое было и не раз.\n\nУшли, точнее, улетели все они в закат \nМораль тут сами понимайте - уж я совсем стал староват."},{"date":"15.09.2019","title":"Человек это звучит гордо","titled":true,"body":"Человек приручил дождь - \nОн пользуется душем;\nЧеловек приручил огонь -\nЗажигалка всегда под его рукой.\nМоя зажигалка бумажная, она быстро сгорит.\nЧеловек приручил собаку -\nТеперь она лучший друг человеку;\n\nЧеловек приручил человека.\n\nЧеловек плачет эмбрионами,\nМаленькие человечки вытекают из его глаз,\nСтруится песок в песочных часах,\nА вкусное песочное печенье остывает.\nДюны из песка песочного печенья, \nБудто это и есть пустыня Сахара.\nВ ней тепло и много сахара.\n\nВот и всё."},{"date":"20.09.2019","title":"Такова жизнь","titled":true,"body":"Жизнь таковая - c'est la vie,\nНо, к счастью, это только aujourd'hui,\nСегодня, то есть такова,\nА завтра, может быть, рукав\nЗасучит и жираф,\nПойдёт на встречу горных трав\nИ будет там он гол и прав.\nПридёт он с рюкзаком, \nИгрушками набитым будет он битком,\nСгребали их совком,\nТрепали их, рвали,\nНасиловали, жгли,\nКультурно, в общем, время проводили.\n\nИ вот на утро молочай\nПозвал глухого палача,\nКоторый взмахом топора \nГлаву обрежет, словно дерева дрова\nИ перестанет всё, и будет всё как с гусь вода,\nКак пустота.\nА в пустоте бывает ну хоть что-то иногда,\nВот, например, коробочка из стали \nКогда увидели - приглядываться мы стали -\nЛежит она теперь у нас,\nПалач махнёт - расколется на раз...\nИтак, внутри пещера, в ней костёр.\nТеперь всё вдруг понятно - дьявол-то хитёр!!\nПример собой он показал нам всем,\nТеперь не страшно будет насовсем,\nТеперь собою второпях трубят\nВсе трубы, а губами говорят про ад - \nТам жаркий климат, там песок,\nВоды нет - только водосток,\nА если чёрту потянуть за волосок,\nПосметь, сорвать тот колосок,\nТогда гудеть все станут как один единый голосок\nИ звон, что криком обращён ко мне,\nОкажется лишь сном очередным во сне,\nА всё, что было после сна,\nЗаставит заново орать уста,\nНе спать уж целых лет до ста.\n\nПоходит век - и новый человек \nЗаснёт, и красота его заиндевевших век\nКоснёт чудесную природу,\nПроснётся, станет ясная погода,\nОстанется одна игральных карт колода,\nНа завтрак - каша и огонь,\nВедь так питаются те, желает кто погонь,\nКто смог на деда покуситься, сгрызть его ладонь,\nТому ведь приговор един.\nДед ведь дожил уж до седин,\nХоть и изрядно ты его опередил.\n\nЯ встал, ушёл и небо всё упало,\nТеперь туман и сумрак наяву.\nЯ вижу, существую, хохочу\nНа деле, ведь в душе я ничего и не хочу!\nИ прислоняю грудь к плечу,\nЯ жмусь, как птица, скоро полечу\nВсе раны, шрамы залечу,\nВспотеют красные тогда мои ладошки,\nПодкашиваться станут ножки,\nИ в голове заместо мозга мошки,\nОни стремятся на фейерверк,\nСтремятся все наверх,\nВсё к звёздам... к чайникам... горам...\n\nСладки при одиночестве полей просторы,\nПолей души или гречихи,\nА это ведь одно и то же, \nДа, верно, слышу ваши чихи,\nБудьте ж здоровы, \nБудьте ж вы вечны, непокорны,\nНе жуйте вы поп корны, \nИ лезьте во все животны норы -\nА вдруг там мир или тетрадь,\nОткроешь - будет сложно всё читать,\nЧернил пречёрных земляной тоской \nПокрыты.\nЕсть дом, а двери, окна зàбиты доской.\nИ в доме том из ночи в ночь \nПроходит ритуалы во всю мочь.\nОни кричат, они не могут в раз застыть,\nОни немного плачут, могут ж так простыть!\nОни порвали цепи из нарциссов, \nТеперь цветы свободны, будто голова у лысых.\nА слон, жираф тот то есть,\nВосстанет тигром и расскажет вам всю эту повесть."},{"date":"20.09.2019","title":"Моя радуга","titled":true,"body":"Красный\nКупил фломастер,\nТомат сорвал я спелый,\nГорит как розы - не успел.\n\nС оранжевым всё проще,\nОн как святые мощи,\nМощённая дорожка кирпичом,\nА солнце здесь и не при чём.\n\nА Жёлтый как лимон,\nОн кислый, \nОн кудрявый, \nСветлый, словно мысли.\n\nЗелень листвы,\nПолив все кусты,\nЗмеи строят мосты,\nЗелёные глаза сторожат посты.\n\nГолубовата - \nТо и дождик моросит,\nНе то, что небо небылицы попроси́т,\nГолубые глаза слезой оросит.\n\nСинее море, оно не цвета, что нежнее,\nВедь есть из жизни то занятий всех важнее,\nТо, о чём все постоянно всё жалеют,\nИсписывать чернилами листки, которые со временем желтеют.\n\nФиалковый закат чудовищно мне рад\nОн улыбается так, будто я ему-то брат.\nЯ не пущу эмоций - соберу в мешок,\nИзрежу зла лиловый корешок."},{"date":"30.09.2019","title":"Жить","titled":true,"body":"Жить — это тебе не мешки ворочать"},{"date":"30.09.2019","title":"Да","titled":true,"body":"Нет ничего мельче\nРыбьей немой речи\nСамой мелкой рыбки в речке,\nВ речке тухнут спички\nИ огня в глазах навалом,\nНо наживка как капканом \nСхлопнет, цапнет и на смèрть\nИли можно легче - в сеть,\nБез наживки на крючок,\nСловно бабочка в сачок,\nВ двух местах сверхзвуковой скачок\nНа чёт-нечет - перечёт,\nПересчёт, насчёт счетов\nКак у рыцаря щитов,\nКак у рыбки той щитков\nЩёткой, тяпкой, тряпкой,\nДевушка не хочет мяткой,\nЛевым, правым подмигни,\nИ давай сжигать огни,\nСена этих всё стоги.\nИголок пòлны сапоги\nИ всё туманности и зги,\nОкружности, мозги,\nМозгать не можем - надо рвать,\nЖать жàтву, клятву дать\nО том, что \nСобачонка как святая\nИ светом литая-литàя,\nПо комнате моей летая,\nНастала здесь вся такова.\nЗернистая подкова,\nПод ковой кова - куй и будь куём,\nВам снова почтальон -\nПисьмо\nО том, что \nХвороста нам не хватает, \nПридите, распишитесь, лёд тогда растает\nИ солнышко взойдёт.\nСветлисить солнцу надоело, \nНадо èму\nРешить его дилемму\nО том, что \nПлощадь круга равная трём сотням черновым \nНа практике лишь сорок с небольшим,\nА там до глупости не далеко,\nВедь так-то разом навалившись, \nВсё позабудется - и так всё кажется излишним,\nЗабудется как сон, \nКак первый, человечий, твой самый жизни крик и стон\nО том, что..."},{"date":"02.10.2019","title":"***","titled":true,"body":"Слышно стало тихий стон.\n\nСтрашновато и комфортно,\nГрязновато, сыро, плотно.\n\nВдруг раздался крик и лязг,\nЭто скрипнула земля,\nПод землёй ползёт змея.\n\nЗмейка ядом не укусит - \nЗмейка ядом не укусит,\nЗмейка шахнет, ахнет,\nЗмейка стонет, страхом пахнет.\n\nИз последнего вагона вдруг посыпался горох,\nБабы собрал`и чертополох,\nБабы стали на две нòги,\nБабы стали как треноги,\nБаб не видно - в`идны стали всюду рòги.\n\nИ теперь всё стало красно,\nВсё в шипах, и ноги всех их - ласты -\nВсё теперь всем ясно - \nСтон стал сном, \nВо сне из диких лилий\nСтало много синих линий.\n\nСиних платьев стало мало -\nРазобрали всё назло\nИ дороже липкой стало\nСтали...\nНет, всё разобрали\nИ всё кончилось давно,\nВсё как в бездòнне дно.\n\nНàрук смерти на гире или шпиле,\nГоре в Трое,\nТемень в пирожке,\nПустота в башке,\nВ клетчатой рубашке\nВ фирменной, да в промокашке,\nНе без кошковой мордашки,\nКормится он манной кашкой.\n\nОн сильный, строгий и нарцисс,\nИ он не предводитель крыс,\nХотя кто его знает."},{"date":"03.10.2019","title":"Научите","titled":true,"body":"Научите плавать,\nЛетать научите,\nНаучите звёзды собирать\nИ падать научите!"},{"date":"04.10.2019","title":"Поход ночью в туалет","titled":true,"body":"Иду я ночью в туалет.\nВдруг передо мной появилась дверь,\nОна не пускает, говорит, мол, нельзя,\nНо я всё-таки её убедил.\nЯ вошёл, повернул вращающийся выключатель, свет не загорелся, я оглянулся, дверь исчезла. Всё исчезло, нет ничего. Я немного начал переживать и волноваться, потом подумал, что есть решение моей проблемы, если можно вообще назвать это проблемой, мне кажется, человек всё воспринимает близко к сердцу слишком, верит в происходящее. Я открыл пошире глаза и порвал геройский костёр, как рвали наши львы глухие с испугом, на руки смотря, тянули, будто так и надо, рычали, будто рычаги, рычали будто не спроста: вот так я выбрался на волю, а потом пошёл дальше спать в своей тёплой и нежной, густым, сладким и заснеженным."},{"date":"04.10.2019","title":"***","titled":true,"body":"Я не люблю грибы,\nЯ не люблю горностаев,\nЯ не люблю Гондвану,\nНо больше всего я не люблю липучий снег на ботинках."},{"date":"06.10.2019","title":"***","titled":true,"body":"Кто же в двери там стучится?\nЧто же дальше нам случится?\nКак сочиться? \nКак сочиться через щели,\nЧерез гром, через капели,\nЧерез розы, через дрели,\nЧтобы было в наслажденье,\nЧтобы было забытье?\nКто же долбит, кто ломает? \nЧто он ждёт, что он желает? \nЖажда, \nЖажда дождика и пыли,\nЖажда ягодки ль? любви ли?\nЖажда ярких-ярких тèней,\nЖажда ласточек кормить..."},{"date":"06.10.2019","title":"Тра-та-та","titled":true,"body":"Утратить жизнь способно только то,\nВ чём эта жизнь присутствует.\n\nЕё же метафизическая реализация\nПолного переворота зги-радуги или открытки\nНа день рождения,\nНа день победы.\n\nЛадно хоть умею говорить гадости,\nИначе совсем бы одиноко было,\nИначе чавкая совсем в пыли\nПолзёт мой колокольчик,\nА я его взял, да и положил в банку,\nА ему и там хорошо.\n\nПролила всё, что могла,\nНи капельки, всё поиссохло, порастёклось.\n\nЧтобы вещи стали малы,\nЧтобы утки стали мамой,\nБудто бабушка с косой -\nПролила стакан с росой\nИ ещё рюмашку \nЧая тёплого с ромашкой,\nСваренного осенью на зиму."},{"date":"06.10.2019","title":"На развалинах","titled":true,"body":"На развалинах зданий и городов, на всех стенах, когда будет отваливается краска, за ней будут проявляться новые произведения искусства, все прекрасные картины и страницы книг, которых мы не заметили на нашем веку, которые скрылись за толстыми слоями краски, которые всё равно в любом случае отвалятся и будут стёрты."},{"date":"06.10.2019","title":"Спать","titled":true,"body":"Я спать люблю, тогда, когда\nСтемнеет или мною съедена еда,\nНо только та, не что поймали в невода:\nИз вод я пищу не люблю,\nОбычно всю такую я изо рта плюю.\n\nЕщё поспать всё тянет из-за солнца,\nКогда печёт, когда всё светом жжётся.\n\nСтаи, своры рыб плывут,\nПоверхность их повсюду,\nОбнимет, жмёт их с всех сторон,\nСторон гремучих, всё как королевских трон, \nКак в дымке сером том\nВсё плавает в росинках сом,\nКоторый мне является почти что каждый божий сон.\nОн тащит, мнёт штыри, \nВсё тычет и кричит,\nО том, что мы его нашли.\nИз пальцев пропадает мысль,\nОна окутало глазницы,\nОна всё вьётся, злится,\nКак сом, как водяной его парящий дом,\nА в доме том\nВсё скрип и шелест тетивы,\nКоторой натянули\nПод дивну музыку весны\nИ веточку прогнули (,)\nПод ногами, да в самую, всё в даль\nДорога тянется, как эта тетива, \nИ осенью все листья ржавы,\nВсе листья как железо,\nВсе листья как огонь...\n...Окопный.\nСтрашно.\nИ весело.\nИ больно.\nИ смешно.\n\nВ полноте б людей всех запереть\n(Пòлно те реветь)\nИ раздавать всё леденцы,\nИ наставлять как праотцы\nИ всё тогда наладится.\nНапиться наконец водицей,\nНадеяться всё стать птицей\nИ взмахом крыльями запеть,\n(И не давать чтоб обещаний),\nВсю горько-звонкую ту песенку прощаний."},{"date":"06.10.2019","title":"Культура","titled":true,"body":"Культ поедания сердца.\nКульт заоблачных загадок.\nКульт котов.\nКульт божьих рогов.\nКульт Матери коров.\nКульт ржаных пирогов."},{"date":"06.10.2019","title":"И снова про огонь","titled":true,"body":"Огонь в глазах всё тушат слёзы горя, как водой\nИ разжигают слёзы счастья, словно керосин зимой.\n\nВ это время Цапля цепит\nЦепки цепи, и цепями, как совсем,\nТлеет бедное сознанье, \nТлеет грех, но не угли, \nТлеет улей и шмели, \nЖадно пьющие хмели, \nРаньше было да\nИ хуже, \nРаньше было за\nИ лужи,\nЛужи, колья, \nВсякие монголья, \nМонгольфьеры,\nМюллеры и Люциферы,\nТòпать, кòпоть и копить\nРазойдись, не стой как прыть,\nНу не стой, не стой как прут -\nСкажут зайцы: \"very good!\".\nСкажут зайцы, что пол царства,\nСкажут зайцы, что не тлен,\nВсё укутывать ребёнка, \nЖалко им пелèн -\nЖалко им пелёнок и колен,\nТворог, снова, снова, снова,\nСнов основа заблудилась,\nСнова дали ную милость,\nТыква в слёзах заблудилась,\nЗаплутала, замерцала, твёрдо сеяла, \nКричалась,\nБрызги веток и калин\nОтдаляет парафин,\nОтдаляет тихий дрязг,\nОтдаляется земля,\nДышло, дыхальце и кольца\nУ Сатурна есть, извольте.\n\nА на пятницу из скрепок\nСтало чудно и легко,\nСтало сразу мрачных тряпок,\nЧудных штаньев и трико."},{"date":"06.10.2019","title":"Я ветку покрепче найду","titled":true,"body":"Границей вселенной \nЯвится шар.\n\nУстали мои колени\nОни трясутся и болят,\nВозьму я верёвку-канат\nИ ветку покрепче найду,\nСделать качели поможет солдат,\nА я стану пулей в его автомат -\nЯ буду клинить всем ружьям, \nИх выстрелы станут как благостный мат,\nКак стоны, как лай нерождённых щенят."},{"date":"06.10.2019","title":"Земля","titled":true,"body":"Трубы из стали\nРжавеют давно.\nРжут кони, ржут трассы,\nОгни, города, ржут пузыри\nНа жгучем асфальте,\nГде трубы из стали.\n\nЗемля.\n\nРвёт трубы, \nОттуда вода,\nСамая горячая,\nКак молоко матери,\nКак солнечный тёплый обволакивающий свет,\nКак слёзы.\n\nЗемля, земля.\n\nИ раскалённый солнцем асфальт\nОблит горячей водой,\nГорячей, как человеческое тело,\nКак объятия, вернувшемуся с войны сыну,\nКак новорождённый ребёнок,\nКак слёзы в полном одиночестве.\n\nЗемля, земля...\n\nЗемля разве тёплая?\nНет солнца под ней,\nВ ней есть черви,\nИ корни растений,\nИ древние кости существ\nИ некогда горячие и живые люди\n\nПод землёй.\n\nЛюди, которые лили слёзы,\nВозвращались с войны и их обнимали,\nКормились молоком из груди матери,\nБоялись, боялись за жизнь смертью,\nБоялись смерти,\nТеперь не боятся и не льют слёзы.\n\nЗемля всё хранит.\n\nЗато, ты можешь кричать громко\nИли рыдать,\nВсё рано земля сохранит.\nА любовь земли такая же, как и любовь солнца,\nОбволакивающая,\nКак объятия сына, вернувшегося с войны."},{"date":"06.10.2019","title":"Вечеринка с чаем","titled":true,"body":"Пока мозг катался по глотке по пути к мочевому пузырю, мы с печенью устроили чаепитие в черепной коробке, позвали ещё левый глаз, а правый смотрит, следит за тем, когда вернётся мозг, интересно, что он никуда не пускает друг друга, я имею в виду, хотя и извилины растекаются, но доли всегда вместе, так вот, в мочевом пузыре камни, проблема в том, что лунный камень слишком красивый и мочепузырь не хочет расставаться с ним, но мозгу это не интересно, он эгоист какой-то, в общем, пьём мы чай, зелёный, он полезнее, ребро одно просится к нам, но мы его не пускаем, из-за него ведь Ева получилась, совсем что ли дурной... слюнные железы устроили нам фонтанчик, очень красивый кстати, жаль сердце не придёт, слишком уж оно занято, лёгкие не придут опять, потому что видишь ли мало им тут воздуха, задыхаются...\nВ принципе можно попросить, чтобы кишки, чтобы связали на время мозг, чтобы мы подольше потусовались, а то совсем устали, отдохнуть хочется, но разве они меня послушают? Обо мне вообще редко вспоминают, но селезёнка тоже важна!!...\nВ общем, пару моляров с нижней челюсти заскочили, говорят, скучно, но ведь мы же так все и не вместимся, да и уже пора расходиться, мозг скоро прикатит, эх..\nВсе начали расходиться, но никто не понял, что мочевой пузырь сошёл с ума из-за камня (уж очень тот ему понравился) и облил мочой мозг, а у того короткое замыкание, говорю же, что электричество это от лукавого.\nИ что теперь делать? Поднялся гул.\nТак! Всем тихо! Давайте вспорем брюхо и сбежим!? \nИ так они устроили побег.\nБежали день, бежали два, \nНашли дрова,\nКостёр зажгли, \nНашли и тело без дыханья\nИ спрятались на ночку там,\nВдруг оживает тело и поёт,\nКак радостно ему - оно живёт.\nТак и остались там друзья,\nВедь мозг не главное - важна душа.\nИ всё настало хорошо -\nВот хеппи енд пришёл."},{"date":"06.10.2019","title":"Эх","titled":true,"body":"Кипяток,\nКипяток!\nЮнона,\nСеляви!\nЛай - май...\nДо.. дай.\nКритик - кал: он \nБатон - оргàн \nДурак ты, Игорь!"},{"date":"06.10.2019","title":"Воротà","titled":true,"body":"Кому-то нравится al dente,\nКому-то Данте девять сыновей,\nОн написал комедию, чтобы поплакать,\nДантес же Пушкина стрелил,\nДурак? \nПростак? \nЗа просто так!\nЗа просто так людей не жалко -\nЖало тех, кто помнит всех и ждёт,\nКто открывает у порога дверь, хлебà суёт; \nИ воротà судьбы-сует кто тоже открывает.\nТогда там Люциус настанет лютиком\nИ Люсей, и Люси \nА ты тряси,\nТряси свой малосольный огуречик -\nТогда откроются тебе все речи, \nТы станешь старцем-мудрецом,\nВозможно, боговым отцом."},{"date":"06.10.2019","title":"Она одна","titled":true,"body":"Подштанники, штаны ли\nО том, что шили, мыли, шли мы,\nТаблетки раньше были в день,\nТаблетки раньше были здесь,\nТо здесь были, то не были,\nТо одежды, то грибы ли,\nТо гитара, то гита -\nЗагорели провода\nЗагудели, засверкали,\nЗаискрились, застремали,\nЗасрамили, поиссохлись\nПолегоньку, по лодоньке\nВетки крыльями ветвиться\nСомкнуты они молиться,\nКому сахар, кому пыль,\nКому звёзды, кому быль,\nКому крылья, кому порох,\nКому деньги, кому твòрог.\n\nИ, всё-таки, люблю я Родину!"},{"date":"06.10.2019","title":"Ожидание","titled":true,"body":
